{% extends 'base.html' %}
{% block content %}
<div class="my-tests-page">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=DM+Mono:wght@400;500&display=swap");

    .my-tests-page {
      --brand-a: #2563eb;
      --brand-b: #0d6efd;
      --brand-c: #06b6d4;
      --muted: #64748b;
      --panel: #ffffff;
      --panel-soft: #f8fbff;
      --panel-border: #e5edf8;
      --page-bg:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(37, 99, 235, 0.09), transparent 60%),
        radial-gradient(ellipse 60% 50% at 100% 100%, rgba(14, 165, 233, 0.08), transparent 60%),
        radial-gradient(ellipse 60% 50% at 0% 100%, rgba(13, 110, 253, 0.06), transparent 60%),
        #f4f9fc;
      padding: 1.5rem 0 2rem;
      color: #0f172a;
      background: var(--page-bg);
      font-family: "DM Sans", system-ui, sans-serif;
    }

    .my-tests-page .display {
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      letter-spacing: 0;
    }

    .my-tests-page .mono {
      font-family: "DM Mono", monospace;
    }

    .my-tests-page .soft {
      color: var(--muted);
    }

    .my-tests-page .brand-gradient {
      background: linear-gradient(
        135deg,
        var(--brand-a),
        var(--brand-b) 52%,
        var(--brand-c)
      );
    }

    .my-tests-page .brand-text {
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .my-tests-page .btn-brand {
      --bs-btn-color: #fff;
      --bs-btn-border-color: transparent;
      --bs-btn-hover-color: #fff;
      --bs-btn-hover-border-color: transparent;
      background: linear-gradient(
        135deg,
        var(--brand-a),
        var(--brand-b) 52%,
        var(--brand-c)
      );
      border-color: transparent;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.18);
    }

    .my-tests-page .hover-card {
      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .my-tests-page .hover-card:hover {
      transform: translateY(-2px);
      border-color: rgba(37, 99, 235, 0.2) !important;
      box-shadow: 0 1rem 2rem rgba(15, 23, 42, 0.12) !important;
    }

    .my-tests-page .subject-card:hover .progress-bar {
      filter: brightness(1.18);
    }

    .my-tests-page .student-highlight {
      --bs-table-bg: rgba(59, 130, 246, 0.12);
      --bs-table-striped-bg: rgba(59, 130, 246, 0.16);
      outline: 2px solid rgba(37, 99, 235, 0.28);
      outline-offset: -2px;
    }

    .my-tests-page .rank-medal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.4rem;
      height: 1.4rem;
      margin-left: 0.2rem;
      border-radius: 999px;
      background: #eef5ff;
      box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.1);
      font-size: 0.95rem;
      line-height: 1;
    }

    .my-tests-page .leaderboard-rank {
      width: 1%;
      white-space: nowrap;
      padding-right: 0.25rem !important;
    }

    .my-tests-page .leaderboard-student {
      padding-left: 0.15rem !important;
    }

    .my-tests-page .reward-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background: linear-gradient(
        135deg,
        var(--brand-a),
        var(--brand-b) 52%,
        var(--brand-c)
      );
      box-shadow: 0 0.5rem 1.4rem rgba(37, 99, 235, 0.18);
      color: #fff;
      font-size: 0.9rem;
      line-height: 1;
    }

    .my-tests-page .rise {
      animation: my-tests-rise 0.35s cubic-bezier(0.2, 0.8, 0.3, 1) both;
    }

    @keyframes my-tests-rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .my-tests-page .app-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 1.25rem;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    .my-tests-page .app-card-soft {
      background: var(--panel-soft);
      border: 1px solid #edf2f7;
      border-radius: 1rem;
    }

    .my-tests-page .nav-pills .nav-link.active,
    .my-tests-page .btn-brand:hover,
    .my-tests-page .btn-brand:focus {
      color: #fff;
    }

    .my-tests-page .nav-pills .nav-link {
      color: #475569;
      border-radius: 999px;
      font-weight: 600;
    }

    .my-tests-page .nav-pills .nav-link.active {
      background: linear-gradient(
        135deg,
        var(--brand-a),
        var(--brand-b) 52%,
        var(--brand-c)
      );
    }

    .my-tests-page .nav-pills.bg-black.bg-opacity-25 {
      background: #eef5ff !important;
      border: 1px solid #dbeafe;
    }

    .my-tests-page .btn-outline-light {
      color: #2563eb;
      background: #ffffff;
      border-color: #dbe4f0;
      font-weight: 600;
    }

    .my-tests-page .btn-outline-light:hover,
    .my-tests-page .btn-outline-light:focus {
      color: #1d4ed8;
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .my-tests-page .table-dark {
      --bs-table-bg: transparent;
      --bs-table-color: #0f172a;
      --bs-table-border-color: #e5edf8;
      --bs-table-striped-color: #0f172a;
      --bs-table-striped-bg: #f8fbff;
      --bs-table-hover-color: #0f172a;
      --bs-table-hover-bg: #eef5ff;
      margin-bottom: 0;
    }

    .my-tests-page .table thead th {
      background: #fbfdff;
      color: #64748b;
      border-bottom-color: #e5edf8;
      font-size: 12px;
      text-transform: uppercase;
    }

    .my-tests-page .table tbody td {
      color: #0f172a;
      border-bottom-color: #eef2f7;
    }

    .my-tests-page .progress {
      overflow: hidden;
      background: #e8edf3;
      height: 8px;
    }

    .my-tests-page .section-panel {
      display: none;
    }

    .my-tests-page .section-panel.active {
      display: block;
    }

    .my-tests-page .summary-orb {
      width: 180px;
      height: 180px;
      filter: blur(45px);
    }

    .my-tests-page .rank-hero-number {
      font-size: 4rem;
    }

    .my-tests-page .top-performer-card {
      width: 140px;
    }

    .my-tests-page .summary-card-title {
      color: #64748b;
      font-size: 0.85rem;
      text-transform: uppercase;
      font-weight: 700;
      font-family: "DM Mono", monospace;
    }

    .my-tests-page .summary-card-value {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .my-tests-page .summary-card-extra {
      font-size: 0.85rem;
      color: #64748b;
    }

    @media (max-width: 767.98px) {
      .my-tests-page {
        padding: 1rem 0 1.5rem;
      }

      .my-tests-page .rank-hero-number {
        font-size: 3rem;
      }
    }

    <section id="homeSection" class="section-panel active">

      <div class="card app-card p-3 mb-4">

        <div class="table-responsive">

            <thead>

                <th>PHY</th>
                <th>CHM</th>

        </div>
        <div class="d-flex justify-content-between align-items-center mt-3">

    </section>

    <section id="analyticsSection" class="section-panel">

    <section id="rewardsSection" class="section-panel">

  </div>

  <template id="kpiTemplate">

  <template id="topicRowTemplate">

      </div>
      <div class="progress">

  <template id="rewardCardTemplate">

      onlineBadge: document.getElementById("onlineBadge"),
      levelBadge: document.getElementById("levelBadge"),
      tabButtons: [...document.querySelectorAll("#studentTabs [data-tab]")],
      testButtons: [...document.querySelectorAll("#testSelector [data-test-id]")],
      homeSection: document.getElementById("homeSection"),
      analyticsSection: document.getElementById("analyticsSection"),
      rewardsSection: document.getElementById("rewardsSection"),
      rankTierBadge: document.getElementById("rankTierBadge"),
      rankValue: document.getElementById("rankValue"),
      rankSummary: document.getElementById("rankSummary"),
      homeKpiRow: document.getElementById("homeKpiRow"),
      coachingSection: document.getElementById("coachingSection"),
      coachingTitle: document.getElementById("coachingTitle"),
      coachingSchedule: document.getElementById("coachingSchedule"),
      coachingDurationBadge: document.getElementById("coachingDurationBadge"),
      coachingItems: document.getElementById("coachingItems"),
      subjectCards: document.getElementById("subjectCards"),
      topPerformers: document.getElementById("topPerformers"),
      leaderboardCountBadge: document.getElementById("leaderboardCountBadge"),
      leaderboardBody: document.getElementById("leaderboardBody"),
      leaderboardFooterText: document.getElementById("leaderboardFooterText"),
      leaderboardToggleBtn: document.getElementById("leaderboardToggleBtn"),
      rankJourneyRow: document.getElementById("rankJourneyRow"),
      topicAnalyticsContainer: document.getElementById("topicAnalyticsContainer"),
      rewardLevelTitle: document.getElementById("rewardLevelTitle"),
      rewardXpText: document.getElementById("rewardXpText"),
      rewardStreakBadge: document.getElementById("rewardStreakBadge"),
      rewardProgressBar: document.getElementById("rewardProgressBar"),
      rewardsGrid: document.getElementById("rewardsGrid"),
    };

    function blankAttendance() {
      return { Physics: {}, Chemistry: {}, Maths: {}, finalized: {} };
    }

    function getStore(key, fallback) {
      try {
        return JSON.parse(localStorage.getItem(key)) ?? fallback;
      } catch {
        return fallback;
      }
    }

    function loadAttendance() {
      state.attendance = getStore(
        StorageKeys.attendance(state.testId),
        blankAttendance(),
      );
    }

    function hashCode(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i += 1) {
        hash = ((hash << 5) - hash + str.charCodeAt(i)) | 0;
      }
      return Math.abs(hash);
    }

    function generateScores(testId) {
      const testHash = hashCode(testId);
      return STUDENTS.map((student) => {
        const studentHash = hashCode(student.id);
        const Physics = Math.max(
          18,
          Math.min(99, (studentHash % 65) + 25 + ((testHash + studentHash) % 22) - 11),
        );
        const Chemistry = Math.max(
          18,
          Math.min(99, ((studentHash * 7) % 65) + 25 + ((testHash * 3 + studentHash) % 22) - 11),
        );
        const Maths = Math.max(
          18,
          Math.min(99, ((studentHash * 13) % 65) + 25 + ((testHash * 5 + studentHash) % 22) - 11),
        );
        return {
          studentId: student.id,
          testId,
          Physics,
          Chemistry,
          Maths,
          total: Physics + Chemistry + Maths,
        };
      });
    }

    function generateTopicMastery(studentId, testId, subject) {
      return TOPICS[subject].map((topic, index) => {
        const score =
          (hashCode(studentId) +
            hashCode(testId) +
            hashCode(subject) +
            hashCode(topic) +
            index * 7) %
          100;
        return { topic, score: Math.max(15, Math.min(98, score)) };
      });
    }

    function currentScores() {
      return allScores[state.testId];
    }

    function currentTest() {
      return TESTS.find((test) => test.id === state.testId);
    }

    function getRankings(scores, key = "total") {
      return [...scores]
        .sort((left, right) => right[key] - left[key])
        .map((score, index) => ({ ...score, rank: index + 1 }));
    }

    function getBottomCluster(scores, subject, count = CLUSTER_SIZE) {
      return [...scores]
        .sort((left, right) => left[subject] - right[subject])
        .slice(0, count);
    }

    function getStudentClusterFlags(studentId, scores) {
      return Object.fromEntries(
        SUBJECTS.map((subject) => [
          subject,
          getBottomCluster(scores, subject).some(
            (score) => score.studentId === studentId,
          ),
        ]),
      );
    }

    function calculateXP(studentId) {
      let xp = 0;
      TESTS.forEach((test, index) => {
        const scores = allScores[test.id];
        const mine = scores.find((score) => score.studentId === studentId);
        const rank = getRankings(scores).find(
          (score) => score.studentId === studentId,
        ).rank;
        xp += Math.floor(mine.total / 3);
        xp +=
          rank === 1
            ? 200
            : rank <= 3
              ? 120
              : rank <= 10
                ? 60
                : rank <= 25
                  ? 25
                  : 0;

        if (index) {
          const previousRank = getRankings(allScores[TESTS[index - 1].id]).find(
            (score) => score.studentId === studentId,
          ).rank;
          if (previousRank > rank) xp += (previousRank - rank) * 10;
        }
      });

      const level = Math.floor(Math.sqrt(xp / 30)) + 1;
      const nextLevelXP = level * level * 30;
      const prevLevelXP = (level - 1) * (level - 1) * 30;
      return {
        xp,
        level,
        progress: (xp - prevLevelXP) / (nextLevelXP - prevLevelXP),
      };
    }

    function getEarnedBadges(studentId) {
      const earned = new Set(["first_test"]);
      let bestRank = 999;
      let ever90 = false;
      let climbedFive = false;
      let streak = 0;

      TESTS.forEach((test, index) => {
        const scores = allScores[test.id];
        const mine = scores.find((score) => score.studentId === studentId);
        const rank = getRankings(scores).find(
          (score) => score.studentId === studentId,
        ).rank;
        bestRank = Math.min(bestRank, rank);
        ever90 ||= mine.Physics >= 90 || mine.Chemistry >= 90 || mine.Maths >= 90;

        if (index) {
          const previousRank = getRankings(allScores[TESTS[index - 1].id]).find(
            (score) => score.studentId === studentId,
          ).rank;
          if (previousRank - rank >= 5) climbedFive = true;
          streak = previousRank > rank ? streak + 1 : 0;
        }
      });

      if (bestRank <= 25) earned.add("top_25");
      if (bestRank <= 10) earned.add("top_10");
      if (bestRank <= 3) earned.add("top_3");
      if (bestRank === 1) earned.add("rank_1");
      if (climbedFive) earned.add("climb_5");
      if (streak >= 2) earned.add("streak_3");
      if (ever90) earned.add("subject_90");

      const flags = getStudentClusterFlags(
        studentId,
        allScores[TESTS[TESTS.length - 1].id],
      );
      const flaggedSubjects = SUBJECTS.filter((subject) => flags[subject]);

      if (!flaggedSubjects.length) earned.add("no_cluster");
      if (
        flaggedSubjects.length &&
        flaggedSubjects.every((subject) =>
          ["present", "late"].includes(state.attendance[subject]?.[studentId]),
        )
      ) {
        earned.add("attend_perfect");
      }

      return earned;
    }

    function calculateStreaks(studentId) {
      let improveStreak = 0;
      for (let index = TESTS.length - 1; index > 0; index -= 1) {
        const currentRank = getRankings(allScores[TESTS[index].id]).find(
          (score) => score.studentId === studentId,
        ).rank;
        const previousRank = getRankings(allScores[TESTS[index - 1].id]).find(
          (score) => score.studentId === studentId,
        ).rank;
        if (previousRank > currentRank) improveStreak += 1;
        else break;
      }
      return { improveStreak };
    }

    function clearNode(node) {
      while (node.firstChild) {
        node.removeChild(node.firstChild);
      }
    }

    function cloneTemplate(id) {
      return document.getElementById(id).content.firstElementChild.cloneNode(true);
    }

    function createAvatar(name, size = 38) {
      const span = document.createElement("span");
      const initials = name
        .split(" ")
        .map((part) => part[0])
        .slice(0, 2)
        .join("");

      span.className =
        "d-inline-flex align-items-center justify-content-center rounded-circle text-white fw-bold brand-gradient flex-shrink-0";
      span.style.width = `${size}px`;
      span.style.height = `${size}px`;
      span.style.fontSize = `${Math.max(10, size * 0.32)}px`;
      span.textContent = initials;
      return span;
    }

    function createBadge(text, className) {
      const span = document.createElement("span");
      span.className = `badge rounded-pill ${className}`;
      span.textContent = text;
      return span;
    }

    function createSubjectIcon(subject) {
      const theme = SUBJECT_THEMES[subject];
      const span = document.createElement("span");
      span.className =
        "d-inline-flex align-items-center justify-content-center rounded-3 text-white fw-bold flex-shrink-0";
      span.style.width = "36px";
      span.style.height = "36px";
      span.style.background = `linear-gradient(135deg, ${theme.from}, ${theme.to})`;
      span.textContent = theme.icon;
      return span;
    }

    function createRankMedal(rank) {
      const medal = MEDALS[rank];
      if (!medal) return null;

      const span = document.createElement("span");
      span.className = "rank-medal";
      span.setAttribute("role", "img");
      span.setAttribute("aria-label", medal.label);
      span.title = medal.label;
      span.textContent = medal.icon;
      return span;
    }

    function setProgressBar(bar, value, background) {
      bar.style.width = `${Math.max(0, Math.min(100, value))}%`;
      bar.style.background = background;
    }

    function renderHeader(xp) {
      refs.onlineBadge.className = `badge rounded-pill ${
        state.online ? "text-bg-success" : "text-bg-danger"
      }`;
      refs.onlineBadge.textContent = state.online ? "ONLINE" : "OFFLINE";
      refs.levelBadge.textContent = `LVL ${xp.level}`;

      refs.tabButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === state.studentTab);
      });

      refs.testButtons.forEach((button) => {
        const test = TESTS.find((item) => item.id === button.dataset.testId);
        button.textContent = `${test.name} - ${test.date}`;
        button.classList.toggle("btn-brand", button.dataset.testId === state.testId);
        button.classList.toggle("btn-outline-light", button.dataset.testId !== state.testId);
      });

      refs.homeSection.classList.toggle("active", state.studentTab === "home");
      refs.analyticsSection.classList.toggle("active", state.studentTab === "analytics");
      refs.rewardsSection.classList.toggle("active", state.studentTab === "rewards");
    }

    function renderKpiRow(container, items) {
      clearNode(container);
      items.forEach((item) => {
        const node = cloneTemplate("kpiTemplate");
        node.querySelector(".summary-card-title").textContent = item.label;
        node.querySelector(".summary-card-value").textContent = item.value;
        node.querySelector(".summary-card-extra").textContent = item.extra;
        container.appendChild(node);
      });
    }

    function renderCoaching(studentId, flaggedSubjects) {
      if (!flaggedSubjects.length) {
        refs.coachingSection.classList.add("d-none");
        return;
      }

      refs.coachingSection.classList.remove("d-none");
      const allSubjects = flaggedSubjects.length === 3;
      refs.coachingTitle.textContent = allSubjects
        ? "All-Subjects Coaching Cluster"
        : "Coaching Cluster";
      refs.coachingSchedule.textContent = allSubjects
        ? "4:00 - 5:30 PM - 90 minutes"
        : flaggedSubjects
            .map((subject) => `${subject}: ${CLUSTER_SCHEDULE[subject].time}`)
            .join(" | ");
      refs.coachingDurationBadge.textContent = allSubjects ? "90 MIN" : "30 MIN";

      clearNode(refs.coachingItems);
      flaggedSubjects.forEach((subject) => {
        const node = cloneTemplate("clusterItemTemplate");
        node.querySelector(".cluster-icon").appendChild(createSubjectIcon(subject));
        node.querySelector(".cluster-subject").textContent = subject;
        node.querySelector(".cluster-faculty").textContent = CLUSTER_SCHEDULE[subject].faculty;
        node
          .querySelector(".cluster-status")
          .appendChild(
            createBadge(
              state.attendance[subject]?.[studentId] || "pending",
              {
                present: "text-bg-success",
                late: "text-bg-warning text-dark",
                absent: "text-bg-danger",
                pending: "text-bg-secondary",
              }[state.attendance[subject]?.[studentId] || "pending"],
            ),
          );
        refs.coachingItems.appendChild(node);
      });
    }

    function renderSubjectCards(score, studentId) {
      const flags = getStudentClusterFlags(studentId, currentScores());
      clearNode(refs.subjectCards);

      SUBJECTS.forEach((subject) => {
        const theme = SUBJECT_THEMES[subject];
        const average = Math.round(
          currentScores().reduce((sum, entry) => sum + entry[subject], 0) /
            STUDENTS.length,
        );
        const rank = getRankings(currentScores(), subject).find(
          (entry) => entry.studentId === studentId,
        ).rank;
        const delta = score[subject] - average;
        const node = cloneTemplate("subjectCardTemplate");

        node.querySelector(".subject-icon").appendChild(createSubjectIcon(subject));
        node.querySelector(".subject-title").textContent = subject;
        node.querySelector(".subject-rank").textContent = `Subject rank #${rank}`;
        node.querySelector(".subject-score").textContent = score[subject];
        node.querySelector(".subject-score").style.color = theme.accent;
        node.querySelector(".subject-average").textContent = `Class avg ${average}/100`;
        setProgressBar(
          node.querySelector(".subject-progress-fill"),
          score[subject],
          `linear-gradient(135deg, ${theme.from}, ${theme.to})`,
        );

        if (subject === "Maths" && flags[subject]) {
          node
            .querySelector(".subject-boost")
            .appendChild(createBadge("Boost", "text-bg-warning text-dark"));
        }

        node
          .querySelector(".subject-delta")
          .appendChild(
            createBadge(
              delta >= 0 ? `+${delta} vs avg` : `${delta} vs avg`,
              delta >= 0 ? "text-bg-success" : "text-bg-danger",
            ),
          );

        refs.subjectCards.appendChild(node);
      });

      return flags;
    }

    function renderTopPerformers(ranked) {
      clearNode(refs.topPerformers);

      ranked.slice(0, 5).forEach((entry) => {
        const student = STUDENTS.find((item) => item.id === entry.studentId);
        const node = cloneTemplate("topPerformerTemplate");
        const medal = createRankMedal(entry.rank);

        node.querySelector(".top-performer-rank").textContent = `#${entry.rank}`;
        if (medal) {
          node.querySelector(".top-performer-rank").appendChild(medal);
        }

        node.querySelector(".top-performer-avatar").appendChild(createAvatar(student.name, 42));
        node.querySelector(".top-performer-name").textContent = student.name;
        node.querySelector(".top-performer-meta").textContent = `#${entry.rank} - ${entry.total}`;
        refs.topPerformers.appendChild(node);
      });
    }

    function leaderboardRows(ranked, highlightId, collapsed) {
      if (!collapsed) return ranked;
      const topFive = ranked.slice(0, 5);
      const mine = ranked.find((row) => row.studentId === highlightId);
      return mine && !topFive.some((row) => row.studentId === highlightId)
        ? [...topFive, mine]
        : topFive;
    }

    function renderLeaderboard(ranked, highlightId) {
      refs.leaderboardCountBadge.textContent = `${ranked.length} students`;
      clearNode(refs.leaderboardBody);

      const rows = leaderboardRows(
        ranked,
        highlightId,
        !state.studentLeaderboardOpen,
      );

      rows.forEach((row) => {
        const student = STUDENTS.find((item) => item.id === row.studentId);
        const node = cloneTemplate("leaderboardRowTemplate");
        const mine = student.id === highlightId;
        const medal = createRankMedal(row.rank);

        if (mine) {
          node.classList.add("table-active", "student-highlight");
        }

        node.querySelector(".leaderboard-rank-text").textContent = `#${row.rank}`;
        if (medal) {
          node.querySelector(".leaderboard-rank-medal").appendChild(medal);
        }

        node.querySelector(".leaderboard-avatar").appendChild(createAvatar(student.name, 28));
        node.querySelector(".leaderboard-name").textContent = student.name;
        node.querySelector(".leaderboard-id").textContent = student.id;
        node.querySelector(".leaderboard-physics").textContent = row.Physics;
        node.querySelector(".leaderboard-chemistry").textContent = row.Chemistry;
        node.querySelector(".leaderboard-maths").textContent = row.Maths;
        node.querySelector(".leaderboard-total").textContent = row.total;

        if (mine) {
          node
            .querySelector(".leaderboard-you")
            .appendChild(createBadge("You", "text-bg-info"));
        }

        refs.leaderboardBody.appendChild(node);
      });

      refs.leaderboardFooterText.textContent = state.studentLeaderboardOpen
        ? `Showing all ${ranked.length} students`
        : `Showing top 5${rows.length > 5 ? " + your rank" : ""}`;
      refs.leaderboardToggleBtn.textContent = state.studentLeaderboardOpen
        ? "Show Less"
        : "View All";
    }

    function renderHome(student, score, rank, ranked) {
      const flags = renderSubjectCards(score, student.id);
      const flaggedSubjects = SUBJECTS.filter((subject) => flags[subject]);
      const testIndex = TESTS.findIndex((test) => test.id === state.testId);
      const previousRank = testIndex
        ? getRankings(allScores[TESTS[testIndex - 1].id]).find(
            (entry) => entry.studentId === student.id,
          ).rank
        : null;
      const delta = previousRank ? previousRank - rank : null;

      refs.rankTierBadge.className = `badge rounded-pill ${
        rank <= 10
          ? "text-bg-info"
          : rank <= 25
            ? "text-bg-primary"
            : "text-bg-secondary"
      }`;
      refs.rankTierBadge.textContent =
        rank <= 10 ? "ELITE" : rank <= 25 ? "RISING STAR" : "BOOST SQUAD";
      refs.rankValue.textContent = `#${rank}`;
      refs.rankSummary.textContent = `of ${STUDENTS.length} students - ${currentTest().name}`;

      renderKpiRow(refs.homeKpiRow, [
        {
          label: "Total",
          value: `${score.total}/300`,
          extra:
            delta === null
              ? "First test"
              : delta > 0
                ? `Up ${delta} ranks`
                : delta < 0
                  ? `Down ${Math.abs(delta)} ranks`
                  : "No rank change",
        },
        {
          label: "Cluster",
          value: flaggedSubjects.length ? flaggedSubjects.join(", ") : "None",
          extra:
            flaggedSubjects.length === 3
              ? "All-subjects session"
              : "Targeted revision",
        },
      ]);

      renderCoaching(student.id, flaggedSubjects);
      renderTopPerformers(ranked);
      renderLeaderboard(ranked, student.id);
    }

    function renderAnalytics(student, score) {
      const ranks = TESTS.map(
        (test) =>
          getRankings(allScores[test.id]).find(
            (entry) => entry.studentId === student.id,
          ).rank,
      );

      renderKpiRow(
        refs.rankJourneyRow,
        TESTS.map((test, index) => ({
          label: test.shortDate,
          value: `#${ranks[index]}`,
          extra: index
            ? `${ranks[index - 1] - ranks[index] >= 0 ? "Up" : "Down"} ${Math.abs(
                ranks[index - 1] - ranks[index],
              )}`
            : "Baseline",
        })),
      );

      clearNode(refs.topicAnalyticsContainer);
      SUBJECTS.forEach((subject) => {
        const theme = SUBJECT_THEMES[subject];
        const node = cloneTemplate("topicCardTemplate");
        const rowsContainer = node.querySelector(".topic-rows");

        node.querySelector(".topic-subject-icon").appendChild(createSubjectIcon(subject));
        node.querySelector(".topic-subject-name").textContent = subject;
        node.querySelector(".topic-subject-name").style.color = theme.accent;
        node.querySelector(".topic-subject-score").textContent = `${score[subject]}/100`;

        generateTopicMastery(student.id, state.testId, subject).forEach((topicItem) => {
          const row = cloneTemplate("topicRowTemplate");
          row.querySelector(".topic-name").textContent = topicItem.topic;
          row.querySelector(".topic-score").textContent = `${topicItem.score}%`;
          setProgressBar(
            row.querySelector(".topic-progress-fill"),
            topicItem.score,
            `linear-gradient(135deg, ${theme.from}, ${theme.to})`,
          );
          rowsContainer.appendChild(row);
        });

        refs.topicAnalyticsContainer.appendChild(node);
      });
    }

    function renderRewards(student) {
      const xp = calculateXP(student.id);
      const earned = getEarnedBadges(student.id);
      const streak = calculateStreaks(student.id).improveStreak;

      refs.rewardLevelTitle.textContent = `Level ${xp.level}`;
      refs.rewardXpText.textContent = `${xp.xp} XP earned`;
      refs.rewardStreakBadge.textContent = `${streak} TEST STREAK`;
      setProgressBar(
        refs.rewardProgressBar,
        Math.round(xp.progress * 100),
        "linear-gradient(135deg, #2563eb, #0d6efd 52%, #06b6d4)",
      );

      clearNode(refs.rewardsGrid);
      BADGES.forEach((badgeItem) => {
        const node = cloneTemplate("rewardCardTemplate");
        const shell = node.querySelector(".reward-card-shell");
        node.querySelector(".reward-icon-text").textContent = badgeItem.icon;
        node.querySelector(".reward-name").textContent = badgeItem.name;
        node.querySelector(".reward-desc").textContent = badgeItem.desc;
        node.querySelector(".reward-meta").textContent = `${
          earned.has(badgeItem.id) ? "earned" : "locked"
        } - ${badgeItem.tier}`;

        if (!earned.has(badgeItem.id)) {
          shell.classList.add("opacity-50");
        }

        refs.rewardsGrid.appendChild(node);
      });
    }

    function render() {
      const student = STUDENTS.find((entry) => entry.id === CURRENT_STUDENT_ID) || STUDENTS[0];
      const score = currentScores().find((entry) => entry.studentId === student.id);
      const ranked = getRankings(currentScores());
      const rank = ranked.find((entry) => entry.studentId === student.id).rank;
      const xp = calculateXP(student.id);

      renderHeader(xp);
      renderHome(student, score, rank, ranked);
      renderAnalytics(student, score);
      renderRewards(student);
    }

    refs.tabButtons.forEach((button) => {
      button.addEventListener("click", () => {
        state.studentTab = button.dataset.tab;
        render();
      });
    });

    refs.testButtons.forEach((button) => {
      button.addEventListener("click", () => {
        state.testId = button.dataset.testId;
        state.studentLeaderboardOpen = false;
        loadAttendance();
        render();
      });
    });

    refs.leaderboardToggleBtn.addEventListener("click", () => {
      state.studentLeaderboardOpen = !state.studentLeaderboardOpen;
      render();
    });

    window.addEventListener("online", () => {
      state.online = true;
      render();
    });

    window.addEventListener("offline", () => {
      state.online = false;
      render();
    });

    document.addEventListener("keydown", (event) => {
      if (["INPUT", "TEXTAREA", "SELECT"].includes(event.target.tagName)) return;
      if (["1", "2", "3"].includes(event.key)) {
        state.studentTab = ["home", "analytics", "rewards"][Number(event.key) - 1];
        render();
      }
    });

    loadAttendance();
    render();
  })();
</script>
