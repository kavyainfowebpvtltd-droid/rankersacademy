{% extends 'base.html' %}
{% block content %}
<div class="my-tests-page">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=DM+Mono:wght@400;500&display=swap");

    .my-tests-page {
      --brand-a: #2563eb;
      --brand-b: #0d6efd;
      --brand-c: #06b6d4;
      --muted: #64748b;
      --panel: #ffffff;
      --panel-soft: #f8fbff;
      --panel-border: #e5edf8;
      --page-bg:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(37, 99, 235, 0.09), transparent 60%),
        radial-gradient(ellipse 60% 50% at 100% 100%, rgba(14, 165, 233, 0.08), transparent 60%),
        radial-gradient(ellipse 60% 50% at 0% 100%, rgba(13, 110, 253, 0.06), transparent 60%),
        #f4f9fc;
      padding: 1.5rem 0 2rem;
      color: #0f172a;
      background: var(--page-bg);
      font-family: "DM Sans", system-ui, sans-serif;
    }

    .my-tests-page .display {
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      letter-spacing: 0;
    }

    .my-tests-page .mono {
      font-family: "DM Mono", monospace;
    }

    .my-tests-page .soft {
      color: var(--muted);
    }

    .my-tests-page .brand-gradient {
      background: linear-gradient(
        135deg,
        var(--brand-a),
        var(--brand-b) 52%,
        var(--brand-c)
      );
    }

    .my-tests-page .brand-text {
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .my-tests-page .btn-brand {
      --bs-btn-color: #fff;
      --bs-btn-border-color: transparent;
      --bs-btn-hover-color: #fff;
      --bs-btn-hover-border-color: transparent;
      background: linear-gradient(
        135deg,
        var(--brand-a),
        var(--brand-b) 52%,
        var(--brand-c)
      );
      border-color: transparent;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.18);
    }

    .my-tests-page .hover-card {
      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .my-tests-page .hover-card:hover {
      transform: translateY(-2px);
      border-color: rgba(37, 99, 235, 0.2) !important;
      box-shadow: 0 1rem 2rem rgba(15, 23, 42, 0.12) !important;
    }

    .my-tests-page .subject-card:hover .progress-bar {
      filter: brightness(1.18);
    }

    .my-tests-page .student-highlight {
      --bs-table-bg: rgba(59, 130, 246, 0.12);
      --bs-table-striped-bg: rgba(59, 130, 246, 0.16);
      outline: 2px solid rgba(37, 99, 235, 0.28);
      outline-offset: -2px;
    }

    .my-tests-page .rank-medal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.4rem;
      height: 1.4rem;
      margin-left: 0.2rem;
      border-radius: 999px;
      background: #eef5ff;
      box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.1);
      font-size: 0.95rem;
      line-height: 1;
    }

    .my-tests-page .leaderboard-rank {
      width: 1%;
      white-space: nowrap;
      padding-right: 0.25rem !important;
    }

    .my-tests-page .leaderboard-student {
      padding-left: 0.15rem !important;
    }

    .my-tests-page .reward-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background: linear-gradient(
        135deg,
        var(--brand-a),
        var(--brand-b) 52%,
        var(--brand-c)
      );
      box-shadow: 0 0.5rem 1.4rem rgba(37, 99, 235, 0.18);
      color: #fff;
      font-size: 0.9rem;
      line-height: 1;
    }

    .my-tests-page .rise {
      animation: my-tests-rise 0.35s cubic-bezier(0.2, 0.8, 0.3, 1) both;
    }

    @keyframes my-tests-rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .my-tests-page .app-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 1.25rem;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    .my-tests-page .app-card-soft {
      background: var(--panel-soft);
      border: 1px solid #edf2f7;
      border-radius: 1rem;
    }

    .my-tests-page .nav-pills .nav-link.active,
    .my-tests-page .btn-brand:hover,
    .my-tests-page .btn-brand:focus {
      color: #fff;
    }

    .my-tests-page .btn-outline-light {
      color: #2563eb;
      background: #ffffff;
      border-color: #dbe4f0;
      font-weight: 600;
    }

    .my-tests-page .btn-outline-light:hover,
    .my-tests-page .btn-outline-light:focus {
      color: #1d4ed8;
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .my-tests-page .table-dark {
      --bs-table-bg: transparent;
      --bs-table-color: #0f172a;
      --bs-table-border-color: #e5edf8;
      --bs-table-striped-color: #0f172a;
      --bs-table-striped-bg: #f8fbff;
      --bs-table-hover-color: #0f172a;
      --bs-table-hover-bg: #eef5ff;
      margin-bottom: 0;
    }

    .my-tests-page .table thead th {
      background: #fbfdff;
      color: #64748b;
      border-bottom-color: #e5edf8;
      font-size: 12px;
      text-transform: uppercase;
    }

    .my-tests-page .table tbody td {
      color: #0f172a;
      border-bottom-color: #eef2f7;
    }

    .my-tests-page .progress {
      overflow: hidden;
      background: #e8edf3;
      height: 8px;
    }

    .my-tests-page .section-panel {
      display: none;
    }

    .my-tests-page .section-panel.active {
      display: block;
    }

    .my-tests-page .summary-orb {
      width: 180px;
      height: 180px;
      filter: blur(45px);
    }

    .my-tests-page .rank-hero-number {
      font-size: 4rem;
    }

    .my-tests-page .top-performer-card {
      width: 140px;
    }

    .my-tests-page .summary-card-title {
      color: #64748b;
      font-size: 0.85rem;
      text-transform: uppercase;
      font-weight: 700;
      font-family: "DM Mono", monospace;
    }

    .my-tests-page .summary-card-value {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .my-tests-page .summary-card-extra {
      font-size: 0.85rem;
      color: #64748b;
    }

    .my-tests-page .level-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.42rem 0.8rem;
      border-radius: 999px;
      background: linear-gradient(180deg, #241c43, #17112c);
      border: 1px solid rgba(146, 125, 255, 0.24);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 10px 20px rgba(15, 23, 42, 0.12);
      color: #c4b5fd;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .my-tests-page .level-pill-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.15rem;
      height: 1.15rem;
      border-radius: 999px;
      background: rgba(250, 204, 21, 0.14);
      color: #facc15;
      font-size: 0.82rem;
      line-height: 1;
    }

    .my-tests-page .level-pill-text {
      font-size: 0.96rem;
      line-height: 1;
      color: #d8cbff;
    }

    .my-tests-page .student-switch {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.55rem;
      padding: 0.45rem;
      background: linear-gradient(180deg, #edf4ff, #f6faff);
      border: 1px solid #d7e6fb;
      border-radius: 1.35rem;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.78),
        0 12px 30px rgba(37, 99, 235, 0.08);
    }

    .my-tests-page .student-switch-btn {
      min-height: 3.1rem;
      border: 0;
      border-radius: 1rem;
      background: transparent;
      color: #475569;
      font-weight: 700;
      transition:
        transform 0.22s ease,
        box-shadow 0.22s ease,
        background 0.22s ease,
        color 0.22s ease;
    }

    .my-tests-page .student-switch-btn:hover,
    .my-tests-page .student-switch-btn:focus-visible {
      color: #1e293b;
      background: rgba(255, 255, 255, 0.72);
      transform: translateY(-1px);
      box-shadow: inset 0 0 0 1px rgba(191, 219, 254, 0.85);
    }

    .my-tests-page .student-switch-btn.active {
      color: #fff;
      background: linear-gradient(
        135deg,
        var(--brand-a),
        var(--brand-b) 52%,
        var(--brand-c)
      );
      box-shadow:
        0 14px 26px rgba(37, 99, 235, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }

    .my-tests-page .test-slot-btn {
      min-height: 2.85rem;
      padding-inline: 1rem;
      border-radius: 999px;
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease;
    }

    .my-tests-page .test-slot-btn:hover:not(:disabled),
    .my-tests-page .test-slot-btn:focus-visible:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.12);
    }

    .my-tests-page .test-slot-btn:disabled {
      opacity: 0.72;
      cursor: not-allowed;
      box-shadow: none;
    }

    .my-tests-page .hero-status {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.7rem;
    }

    .my-tests-page .streak-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      border: 1px solid rgba(249, 115, 22, 0.28);
      background: linear-gradient(180deg, #7c3a1d, #6b3016);
      color: #fed7aa;
      font-weight: 700;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .my-tests-page .streak-pill-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.15rem;
      height: 1.15rem;
      border-radius: 999px;
      background: rgba(251, 191, 36, 0.14);
      color: #fbbf24;
      font-size: 0.85rem;
      line-height: 1;
    }

    .my-tests-page .rank-shift-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 3rem;
      gap: 0.35rem;
      padding: 0.5rem 0.75rem;
      border-radius: 1rem;
      font-weight: 700;
      border: 1px solid transparent;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .my-tests-page .rank-shift-pill.up {
      color: #dcfce7;
      background: linear-gradient(180deg, #14532d, #166534);
      border-color: rgba(34, 197, 94, 0.3);
    }

    .my-tests-page .rank-shift-pill.down {
      color: #fecdd3;
      background: linear-gradient(180deg, #8a3b48, #7a3140);
      border-color: rgba(251, 113, 133, 0.28);
    }

    .my-tests-page .rank-shift-pill.flat {
      color: #dbeafe;
      background: linear-gradient(180deg, #334155, #293548);
      border-color: rgba(148, 163, 184, 0.28);
    }

    .my-tests-page .rank-shift-icon {
      font-size: 0.92rem;
      line-height: 1;
    }

    .my-tests-page .home-score-breakdown {
      display: grid;
      gap: 0.85rem;
    }

    .my-tests-page .home-score-card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(219, 234, 254, 0.95);
      border-radius: 1.1rem;
      padding: 1rem 1.05rem;
      box-shadow: 0 12px 26px rgba(37, 99, 235, 0.06);
    }

    .my-tests-page .home-score-label {
      color: #64748b;
      font-size: 0.78rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-family: "DM Mono", monospace;
    }

    .my-tests-page .home-score-total {
      display: flex;
      align-items: baseline;
      gap: 0.35rem;
      margin-top: 0.35rem;
    }

    .my-tests-page .home-score-value {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
      color: #0f172a;
    }

    .my-tests-page .home-score-outof {
      color: #64748b;
      font-size: 1rem;
      font-weight: 700;
    }

    .my-tests-page .home-score-meta {
      margin-top: 0.35rem;
      font-size: 0.88rem;
      color: #64748b;
    }

    .my-tests-page .home-score-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .my-tests-page .home-score-chip {
      background: linear-gradient(180deg, #f8fbff, #eff6ff);
      border: 1px solid #dbeafe;
      border-radius: 1rem;
      padding: 0.9rem 0.95rem;
    }

    .my-tests-page .home-score-chip-name {
      color: #475569;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .my-tests-page .home-score-chip-value {
      margin-top: 0.3rem;
      font-size: 1.15rem;
      font-weight: 800;
      color: #0f172a;
    }

    .my-tests-page .home-score-chip-meta {
      margin-top: 0.2rem;
      color: #64748b;
      font-size: 0.8rem;
    }

    @media (max-width: 767.98px) {
      .my-tests-page {
        padding: 1rem 0 1.5rem;
      }

      .my-tests-page .rank-hero-number {
        font-size: 3rem;
      }

      .my-tests-page .home-score-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <div class="container-fluid px-3 px-lg-4">
    <div class="position-fixed top-0 end-0 m-3" style="z-index: 3">
      <span id="onlineBadge" class="badge rounded-pill"></span>
    </div>

    <div class="mb-3">
      <span id="levelBadge" class="level-pill">
        <span class="level-pill-icon" aria-hidden="true">⚡</span>
        <span id="levelBadgeText" class="level-pill-text"></span>
      </span>
    </div>

    <div id="studentTabs" class="student-switch mb-3">
      <button type="button" class="student-switch-btn active" data-tab="home">Home</button>
      <button type="button" class="student-switch-btn" data-tab="analytics">Analytics</button>
      <button type="button" class="student-switch-btn" data-tab="rewards">Rewards</button>
    </div>

    <div id="testSelector" class="d-flex gap-2 overflow-auto pb-1 mb-3">
      <button type="button" class="btn btn-sm mono flex-shrink-0 test-slot-btn" data-slot-index="0"></button>
      <button type="button" class="btn btn-sm mono flex-shrink-0 test-slot-btn" data-slot-index="1"></button>
      <button type="button" class="btn btn-sm mono flex-shrink-0 test-slot-btn" data-slot-index="2"></button>
    </div>

    <section id="homeSection" class="section-panel active">
      <div class="card app-card p-4 mb-4 rise position-relative overflow-hidden">
        <div class="position-absolute top-0 end-0 brand-gradient opacity-25 rounded-circle summary-orb"></div>
        <div class="position-relative">
          <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap">
            <span id="rankTierBadge" class="badge rounded-pill"></span>
            <div class="hero-status">
              <span id="testStreakBadge" class="streak-pill d-none">
                <span class="streak-pill-icon" aria-hidden="true">🔥</span>
                <span id="testStreakText"></span>
              </span>
              <span id="rankShiftBadge" class="rank-shift-pill d-none">
                <span id="rankShiftIcon" class="rank-shift-icon"></span>
                <span id="rankShiftText"></span>
              </span>
            </div>
          </div>
          <h2 id="rankValue" class="display fw-bold mt-2 mb-0 rank-hero-number"></h2>
          <div id="rankSummary" class="soft"></div>
          <div id="homeKpiRow" class="home-score-breakdown mt-3"></div>
        </div>
      </div>

      <div id="coachingSection" class="card app-card p-3 mb-4 d-none">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <h5 id="coachingTitle" class="display fw-bold mb-1"></h5>
            <div id="coachingSchedule" class="small soft"></div>
          </div>
          <span id="coachingDurationBadge" class="badge rounded-pill text-bg-primary"></span>
        </div>
        <div id="coachingItems" class="row g-2 mt-2"></div>
      </div>

      <h5 class="display fw-bold">Subject Performance</h5>
      <div id="subjectCards" class="row g-3 mb-4"></div>

      <h5 class="display fw-bold">Top Performers</h5>
      <div id="topPerformers" class="d-flex gap-2 overflow-auto pb-1 mb-4"></div>

      <div class="card app-card p-3 mb-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="display fw-bold mb-0">Leaderboard</h5>
          <span id="leaderboardCountBadge" class="badge rounded-pill text-bg-info"></span>
        </div>
        <div class="table-responsive">
          <table class="table table-sm table-dark table-striped table-hover align-middle">
            <thead>
              <tr>
                <th>#</th>
                <th>Student</th>
                <th id="leaderboardSectionHead1">SEC 1</th>
                <th id="leaderboardSectionHead2">SEC 2</th>
                <th id="leaderboardSectionHead3">SEC 3</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody"></tbody>
          </table>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-3">
          <div id="leaderboardFooterText" class="small soft"></div>
          <button id="leaderboardToggleBtn" type="button" class="btn btn-outline-light btn-sm rounded-pill">View All</button>
        </div>
      </div>
    </section>

    <section id="analyticsSection" class="section-panel">
      <div class="card app-card p-4 mb-4">
        <h5 class="display fw-bold">Rank Journey</h5>
        <div id="rankJourneyRow" class="row g-2"></div>
      </div>

      <h5 id="analyticsBreakdownTitle" class="display fw-bold">Section Analytics</h5>
      <div id="topicAnalyticsContainer" class="vstack gap-3 mb-4"></div>
    </section>

    <section id="rewardsSection" class="section-panel">
      <div class="card app-card p-4 mb-4">
        <div class="d-flex justify-content-between">
          <div>
            <h5 id="rewardLevelTitle" class="display fw-bold"></h5>
            <div id="rewardXpText" class="soft small"></div>
          </div>
          <span id="rewardStreakBadge" class="badge rounded-pill text-bg-warning text-dark"></span>
        </div>
        <div class="mt-3">
          <div class="progress">
            <div id="rewardProgressBar" class="progress-bar progress-bar-striped progress-bar-animated"></div>
          </div>
        </div>
      </div>

      <div id="rewardsGrid" class="row g-3"></div>
    </section>
  </div>

  <template id="kpiTemplate">
    <div class="col-6 col-lg-3">
      <div class="card app-card-soft hover-card p-3 h-100">
        <div class="summary-card-title"></div>
        <div class="summary-card-value"></div>
        <div class="summary-card-extra"></div>
      </div>
    </div>
  </template>

  <template id="clusterItemTemplate">
    <div class="col-md-4">
      <div class="card app-card-soft hover-card p-2 d-flex align-items-center gap-2">
        <div class="cluster-icon"></div>
        <div class="flex-grow-1">
          <b class="cluster-subject"></b>
          <div class="small soft cluster-faculty"></div>
        </div>
        <div class="cluster-status"></div>
      </div>
    </div>
  </template>

  <template id="subjectCardTemplate">
    <div class="col-md-4">
      <div class="card app-card hover-card p-3 h-100 subject-card">
        <div class="d-flex align-items-center gap-2 mb-2">
          <div class="subject-icon"></div>
          <div>
            <div class="d-flex align-items-center gap-2">
              <b class="subject-title"></b>
              <div class="subject-boost"></div>
            </div>
            <div class="small soft subject-rank"></div>
          </div>
        </div>
        <div class="display fs-2 fw-bold subject-score"></div>
        <div class="progress">
          <div class="progress-bar progress-bar-striped progress-bar-animated subject-progress-fill"></div>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-2">
          <span class="small soft subject-average"></span>
          <div class="subject-delta"></div>
        </div>
      </div>
    </div>
  </template>

  <template id="topPerformerTemplate">
    <div class="card app-card-soft hover-card p-3 text-center flex-shrink-0 position-relative top-performer-card">
      <div class="top-performer-rank mb-1"></div>
      <div class="top-performer-avatar d-flex justify-content-center"></div>
      <div class="fw-bold mt-2 text-truncate top-performer-name"></div>
      <div class="mono soft top-performer-meta"></div>
    </div>
  </template>

  <template id="leaderboardRowTemplate">
    <tr>
      <td class="mono leaderboard-rank">
        <span class="leaderboard-rank-text"></span>
        <span class="leaderboard-rank-medal"></span>
      </td>
      <td class="leaderboard-student">
        <div class="d-flex align-items-center gap-2">
          <div class="leaderboard-avatar"></div>
          <div class="overflow-hidden">
            <div class="fw-semibold d-flex align-items-center gap-2">
              <span class="leaderboard-name"></span>
              <span class="leaderboard-you"></span>
            </div>
            <div class="small soft mono leaderboard-id"></div>
          </div>
        </div>
      </td>
      <td class="leaderboard-physics"></td>
      <td class="leaderboard-chemistry"></td>
      <td class="leaderboard-maths"></td>
      <td><b class="leaderboard-total"></b></td>
    </tr>

<script>

    const MY_TESTS_PAYLOAD = JSON.parse(

    const BASE_COMPLETED_TESTS = [];
    const CLUSTER_SCHEDULE = {};
    const BADGES = [
      ["first_test", "T1", "Mock Test Starter", "Completed the first academy test", "bronze"],
      ["top_25", "R25", "Rank Booster", "Entered the top 25 merit band", "silver"],
      ["top_10", "T10", "JEE Main Sprinter", "Cracked the top 10 in class", "gold"],
      ["top_3", "T3", "NEET Podium Performer", "Reached the top 3 merit list", "gold"],
      ["rank_1", "R1", "AIR Mindset Champion", "Held rank #1 on a test", "platinum"],
      ["climb_5", "UP5", "Comeback Climber", "Climbed 5+ ranks in one test", "silver"],
      ["streak_3", "S3", "Consistency Streak", "Improved across 3 tests in a row", "gold"],
      ["subject_90", "90+", "Subject Mastery Badge", "Scored 90+ in any subject", "gold"],
      ["attend_perfect", "ATT", "Revision Warrior", "Attended every assigned booster session", "silver"],
      ["no_cluster", "CLR", "Concept Clear Badge", "Stayed out of coaching clusters this test", "bronze"],
    ].map(([id, icon, name, desc, tier]) => ({ id, icon, name, desc, tier }));
    const MEDALS = {
      1: { icon: "🥇", label: "Gold medal" },
      2: { icon: "🥈", label: "Silver medal" },
      3: { icon: "🥉", label: "Bronze medal" },
    };
    const STUDENT_MAP = new Map();
    (MY_TESTS_PAYLOAD.completedTests || []).forEach((test) => {
      (test.leaderboard || []).forEach((entry) => {
        STUDENT_MAP.set(entry.studentId, {
          id: entry.studentId,
          name: entry.studentName,
          batch: "",
          parentPhone: "",
          studentRef: entry.studentRef || "",
          profilePhotoUrl: entry.profilePhotoUrl || "",
        });
      });
    });
    STUDENT_MAP.set(CURRENT_STUDENT.id, {
      ...CURRENT_STUDENT,
      studentRef: CURRENT_STUDENT.id,
    });
    const STUDENTS = [...STUDENT_MAP.values()];
    const CURRENT_STUDENT_ID = CURRENT_STUDENT.id;
    const SCHOLARSHIP_COMPLETED_TESTS = (MY_TESTS_PAYLOAD.completedTests || []).map(
      (test) => ({
        ...test,
        kind: "completed",
      }),
    );
    const TESTS = [...BASE_COMPLETED_TESTS, ...SCHOLARSHIP_COMPLETED_TESTS].sort(
      (left, right) => new Date(left.sortAt) - new Date(right.sortAt),
    );
    const VISIBLE_COMPLETED_TESTS = TESTS.slice(-2);
    const UPCOMING_TEST_SLOT = MY_TESTS_PAYLOAD.upcomingTest
      ? {
          ...MY_TESTS_PAYLOAD.upcomingTest,
          kind: "upcoming",
        }
      : {
          id: "upcoming-placeholder",
          name: "Upcoming Test",
          date: "Awaiting schedule",
          shortDate: "Soon",
          kind: "placeholder",
          canLaunchNow: false,
          launchUrl: "",
        };
    const TEST_SELECTOR_SLOTS = [
      VISIBLE_COMPLETED_TESTS[0] || TESTS[TESTS.length - 1] || null,
      VISIBLE_COMPLETED_TESTS[1] || VISIBLE_COMPLETED_TESTS[0] || TESTS[TESTS.length - 1] || null,
      UPCOMING_TEST_SLOT,
    ];
    MEDALS[1].icon = "\uD83E\uDD47";
    MEDALS[2].icon = "\uD83E\uDD48";
    MEDALS[3].icon = "\uD83E\uDD49";
    const REWARD_PAYLOAD = MY_TESTS_PAYLOAD.rewards || {
      xp: 0,
      level: 1,
      progress: 0,
      streak: 0,
      badges: BADGES.map((badge) => ({ ...badge, earned: false })),
    };
    const state = {
      studentTab: "home",
      studentLeaderboardOpen: false,
      testId:
        (VISIBLE_COMPLETED_TESTS[1] && VISIBLE_COMPLETED_TESTS[1].id) ||
        (VISIBLE_COMPLETED_TESTS[0] && VISIBLE_COMPLETED_TESTS[0].id) ||
        (TESTS[TESTS.length - 1] && TESTS[TESTS.length - 1].id) ||
        null,
      online: navigator.onLine,
    };
    const refs = {
      onlineBadge: document.getElementById("onlineBadge"),
      levelBadgeText: document.getElementById("levelBadgeText"),
      tabButtons: [...document.querySelectorAll("#studentTabs [data-tab]")],
      testButtons: [...document.querySelectorAll("#testSelector [data-slot-index]")],
      homeSection: document.getElementById("homeSection"),
      analyticsSection: document.getElementById("analyticsSection"),
      rewardsSection: document.getElementById("rewardsSection"),
      rankTierBadge: document.getElementById("rankTierBadge"),
      testStreakBadge: document.getElementById("testStreakBadge"),
      testStreakText: document.getElementById("testStreakText"),
      rankShiftBadge: document.getElementById("rankShiftBadge"),
      rankShiftIcon: document.getElementById("rankShiftIcon"),
      rankShiftText: document.getElementById("rankShiftText"),
      rankValue: document.getElementById("rankValue"),
      rankSummary: document.getElementById("rankSummary"),
      homeKpiRow: document.getElementById("homeKpiRow"),
      coachingSection: document.getElementById("coachingSection"),
      coachingTitle: document.getElementById("coachingTitle"),
      coachingSchedule: document.getElementById("coachingSchedule"),
      coachingDurationBadge: document.getElementById("coachingDurationBadge"),
      coachingItems: document.getElementById("coachingItems"),
      subjectCards: document.getElementById("subjectCards"),
      topPerformers: document.getElementById("topPerformers"),
      leaderboardCountBadge: document.getElementById("leaderboardCountBadge"),
      leaderboardBody: document.getElementById("leaderboardBody"),
      leaderboardFooterText: document.getElementById("leaderboardFooterText"),
      leaderboardToggleBtn: document.getElementById("leaderboardToggleBtn"),
      leaderboardSectionHeads: [
        document.getElementById("leaderboardSectionHead1"),
        document.getElementById("leaderboardSectionHead2"),
        document.getElementById("leaderboardSectionHead3"),
      ],
      rankJourneyRow: document.getElementById("rankJourneyRow"),
      analyticsBreakdownTitle: document.getElementById("analyticsBreakdownTitle"),
      topicAnalyticsContainer: document.getElementById("topicAnalyticsContainer"),
      rewardLevelTitle: document.getElementById("rewardLevelTitle"),
      rewardXpText: document.getElementById("rewardXpText"),
      rewardStreakBadge: document.getElementById("rewardStreakBadge"),
      rewardProgressBar: document.getElementById("rewardProgressBar"),
      rewardsGrid: document.getElementById("rewardsGrid"),
    };
    document.querySelector(".level-pill-icon").textContent = "\u26A1";
    document.querySelector(".streak-pill-icon").textContent = "\uD83D\uDD25";

    function currentTest() {
      return TESTS.find((test) => test.id === state.testId);
    }
    function currentLeaderboard() {
      return currentTest()?.leaderboard || [];
    }

    function currentStudentLeaderboardEntry() {
      return currentLeaderboard().find((entry) => entry.studentId === CURRENT_STUDENT_ID) || null;
    }

    function getHomeBreakdownItems() {
      const test = currentTest();
      const items = (test?.sectionBreakdown || []).map((section) => ({
        label: section.name,
        value: section.score,
        total: section.total,
        meta: `${section.percentage}% scored`,
      }));

      return {
        title: items.length <= 1 ? "Topic Scorecard" : "Subject Scorecard",
        items,
      };
    }

    function renderHomeBreakdown(student, score, scoreTotal, previousRank, rank) {
      clearNode(refs.homeKpiRow);

      const selectedTest = currentTest();
      const totalCard = document.createElement("div");
      totalCard.className = "home-score-card";
      const totalLabel = document.createElement("div");
      totalLabel.className = "home-score-label";
      totalLabel.textContent = "Scored Marks";

      const totalValueRow = document.createElement("div");
      totalValueRow.className = "home-score-total";

      const totalValue = document.createElement("span");
      totalValue.className = "home-score-value";
      totalValue.textContent = String(scoreTotal);

      const totalOutOf = document.createElement("span");
      totalOutOf.className = "home-score-outof";
      totalOutOf.textContent = `/ ${selectedTest?.totalMarks || 0}`;

      totalValueRow.appendChild(totalValue);
      totalValueRow.appendChild(totalOutOf);

      const totalMeta = document.createElement("div");
      totalMeta.className = "home-score-meta";
      totalMeta.textContent =
        `${
          previousRank === null
            ? "First recorded test"
            : rank < previousRank
              ? `Improved by ${previousRank - rank} rank${previousRank - rank === 1 ? "" : "s"} from previous test`
              : rank > previousRank
                ? `Dropped by ${rank - previousRank} rank${rank - previousRank === 1 ? "" : "s"} from previous test`
                : "Same rank as previous test"
        } • ${selectedTest.name}`;

      totalCard.appendChild(totalLabel);
      totalCard.appendChild(totalValueRow);
      totalCard.appendChild(totalMeta);
      refs.homeKpiRow.appendChild(totalCard);

      const breakdown = getHomeBreakdownItems();
      const breakdownCard = document.createElement("div");
      breakdownCard.className = "home-score-card";

      const title = document.createElement("div");
      title.className = "home-score-label";
      title.textContent = breakdown.title;
      breakdownCard.appendChild(title);

      const grid = document.createElement("div");
      grid.className = "home-score-grid mt-3";

      breakdown.items.forEach((item) => {
        const chip = document.createElement("div");
        chip.className = "home-score-chip";
        const chipName = document.createElement("div");
        chipName.className = "home-score-chip-name";
        chipName.textContent = item.label;

        const chipValue = document.createElement("div");
        chipValue.className = "home-score-chip-value";
        chipValue.textContent = `${item.value}/${item.total}`;

        const chipMeta = document.createElement("div");
        chipMeta.className = "home-score-chip-meta";
        chipMeta.textContent = item.meta;

        chip.appendChild(chipName);
        chip.appendChild(chipValue);
        chip.appendChild(chipMeta);
        grid.appendChild(chip);
      });

      breakdownCard.appendChild(grid);
      refs.homeKpiRow.appendChild(breakdownCard);
    }

    function clearNode(node) {
      while (node.firstChild) {
        node.removeChild(node.firstChild);
      }
    }

    function cloneTemplate(id) {
      return document.getElementById(id).content.firstElementChild.cloneNode(true);
    }

    function createAvatar(name, size = 38, photoUrl = "") {
      if (photoUrl) {
        const img = document.createElement("img");
        img.src = photoUrl;
        img.alt = name;
        img.className = "rounded-circle flex-shrink-0";
        img.style.width = `${size}px`;
        img.style.height = `${size}px`;
        img.style.objectFit = "cover";
        return img;
      }

      const span = document.createElement("span");
      const initials = name
        .split(" ")
        .map((part) => part[0])
        .slice(0, 2)
        .join("");

      span.className =
        "d-inline-flex align-items-center justify-content-center rounded-circle text-white fw-bold brand-gradient flex-shrink-0";
      span.style.width = `${size}px`;
      span.style.height = `${size}px`;
      span.style.fontSize = `${Math.max(10, size * 0.32)}px`;
      span.textContent = initials;
      return span;
    }

    function createBadge(text, className) {
      const span = document.createElement("span");
      span.className = `badge rounded-pill ${className}`;
      span.textContent = text;
      return span;
    }

    function createSubjectIcon(subject) {
      const subjectThemes = Object.values(SUBJECT_THEMES);
      const theme = SUBJECT_THEMES[subject] || subjectThemes[0];
      const span = document.createElement("span");
      span.className =
        "d-inline-flex align-items-center justify-content-center rounded-3 text-white fw-bold flex-shrink-0";
      span.style.width = "36px";
      span.style.height = "36px";
      span.style.background = `linear-gradient(135deg, ${theme.from}, ${theme.to})`;
      span.textContent = theme.icon || String(subject || "S").slice(0, 1).toUpperCase();
      return span;
    }

    function createRankMedal(rank) {
      const medal = MEDALS[rank];
      if (!medal) return null;

      const span = document.createElement("span");
      span.className = "rank-medal";
      span.setAttribute("role", "img");
      span.setAttribute("aria-label", medal.label);
      span.title = medal.label;
      span.textContent = medal.icon;
      return span;
    }

    function setProgressBar(bar, value, background) {
      bar.style.width = `${Math.max(0, Math.min(100, value))}%`;
      bar.style.background = background;
    }

    function applyTestSlotButtonState(button, slot) {
      button.classList.remove("btn-brand", "btn-outline-light");
      button.disabled = false;
      button.title = "";

      if (!slot) {
        button.textContent = "Unavailable";
        button.disabled = true;
        button.classList.add("btn-outline-light");
        return;
      }

      if (slot.kind === "completed") {
        button.textContent = `${slot.name} - ${slot.date}`;
        const isActive = slot.id === state.testId;
        button.classList.add(isActive ? "btn-brand" : "btn-outline-light");
        return;
      }

      if (slot.kind === "placeholder") {
        button.textContent = `${slot.name} - ${slot.date}`;
      } else if (slot.isLive) {
        button.textContent = `${slot.name} - Live Now`;
      } else if (slot.canLaunchNow) {
        button.textContent = `${slot.name} - Starts Soon`;
      } else {
        button.textContent = `${slot.name} - ${slot.date}`;
      }

      const isLaunchable = slot.kind === "upcoming" && slot.canLaunchNow;
      button.classList.add(isLaunchable ? "btn-brand" : "btn-outline-light");
      button.disabled = !isLaunchable;

      if (slot.kind === "placeholder") {
        button.title = "No upcoming test has been scheduled yet.";
      } else if (!isLaunchable) {
        button.title = "This test opens 10 minutes before the scheduled start time.";
      }
    }

    function renderHeader() {
      refs.onlineBadge.className = `badge rounded-pill ${
        state.online ? "text-bg-success" : "text-bg-danger"
      }`;
      refs.onlineBadge.textContent = state.online ? "ONLINE" : "OFFLINE";
      refs.levelBadgeText.textContent = `LVL ${REWARD_PAYLOAD.level}`;

      refs.tabButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === state.studentTab);
      });

      refs.testButtons.forEach((button) => {
        const slot = TEST_SELECTOR_SLOTS[Number(button.dataset.slotIndex)];
        applyTestSlotButtonState(button, slot);
      });

      refs.homeSection.classList.toggle("active", state.studentTab === "home");
      refs.analyticsSection.classList.toggle("active", state.studentTab === "analytics");
      refs.rewardsSection.classList.toggle("active", state.studentTab === "rewards");
    }

    function renderKpiRow(container, items) {
      clearNode(container);
      items.forEach((item) => {
        const node = cloneTemplate("kpiTemplate");
        node.querySelector(".summary-card-title").textContent = item.label;
        node.querySelector(".summary-card-value").textContent = item.value;
        node.querySelector(".summary-card-extra").textContent = item.extra;
        container.appendChild(node);
      });
    }

    function renderCoaching(studentId, flaggedSubjects) {
      const test = currentTest();
      const coachingItems = (test && test.coachingItems) || [];
      if (!coachingItems.length) {
        refs.coachingSection.classList.add("d-none");
        return;
      }

      refs.coachingSection.classList.remove("d-none");
      refs.coachingTitle.textContent = "Tonight's Coaching";
      refs.coachingSchedule.textContent = "Personal mentorship · 30 minutes per subject";
      refs.coachingDurationBadge.textContent = `${Math.max(coachingItems.length, 1) * 30} MIN`;

      clearNode(refs.coachingItems);
      coachingItems.forEach((item) => {
        const node = cloneTemplate("clusterItemTemplate");
        node.querySelector(".cluster-icon").appendChild(createSubjectIcon(item.name));
        node.querySelector(".cluster-subject").textContent = item.name;
        node.querySelector(".cluster-faculty").textContent = `${item.score}/${item.total} marks · ${item.percentage}%`;
        node
          .querySelector(".cluster-status")
          .appendChild(
            createBadge(
              item.status || "Focus Area",
              {
                "Focus Area": "text-bg-danger",
                "On Track": "text-bg-success",
              }[item.status || "Focus Area"],
            ),
          );
        refs.coachingItems.appendChild(node);
      });
    }

    function renderSubjectCards(score, studentId) {
      const test = currentTest();
      const flags = getStudentClusterFlags(studentId, currentScores());
      clearNode(refs.subjectCards);

      (test?.sectionBreakdown || []).forEach((section, index) => {
        const theme = Object.values(SUBJECT_THEMES)[index % Object.values(SUBJECT_THEMES).length];
        const average = Math.round(
          ((test.leaderboard || []).reduce((sum, entry) => {
            const sectionScore = entry.sectionScores?.[index];
            return sum + (sectionScore ? sectionScore.score : 0);
          }, 0) / Math.max((test.leaderboard || []).length, 1)) * 10,
        ) / 10;
        const node = cloneTemplate("subjectCardTemplate");

        node.querySelector(".subject-icon").appendChild(createSubjectIcon(section.shortLabel || section.name));
        node.querySelector(".subject-title").textContent = section.name;
        node.querySelector(".subject-rank").textContent = `${section.score}/${section.total} in this section`;
        node.querySelector(".subject-score").textContent = section.score;
        node.querySelector(".subject-score").style.color = theme.accent;
        node.querySelector(".subject-average").textContent = `Class avg ${average}/${section.total}`;
        setProgressBar(
          node.querySelector(".subject-progress-fill"),
          section.percentage,
          `linear-gradient(135deg, ${theme.from}, ${theme.to})`,
        );
        node
          .querySelector(".subject-delta")
          .appendChild(
            createBadge(
              `${section.percentage}% scored`,
              section.percentage >= 60 ? "text-bg-success" : "text-bg-danger",
            ),
          );

        refs.subjectCards.appendChild(node);
      });

      return flags;
    }

    function renderTopPerformers(ranked) {
      clearNode(refs.topPerformers);

      const test = currentTest();
      const topEntries = (test && test.topPerformers && test.topPerformers.length)
        ? test.topPerformers
        : ranked.slice(0, 5).map((entry) => {
            const student = STUDENTS.find((item) => item.id === entry.studentId) || {};
            return {
              rank: entry.rank,
              studentName: student.name || entry.studentId,
              profilePhotoUrl: student.profilePhotoUrl || "",
              score: entry.total,
              totalMarks: entry.totalMarks || 0,
            };
          });

      topEntries.forEach((entry) => {
        const node = cloneTemplate("topPerformerTemplate");
        const medal = createRankMedal(entry.rank);

        node.querySelector(".top-performer-rank").textContent = `#${entry.rank}`;
        if (medal) {
          node.querySelector(".top-performer-rank").appendChild(medal);
        }

        node
          .querySelector(".top-performer-avatar")
          .appendChild(createAvatar(entry.studentName, 42, entry.profilePhotoUrl || ""));
        node.querySelector(".top-performer-name").textContent = entry.studentName;
        node.querySelector(".top-performer-meta").textContent = `#${entry.rank} - ${entry.score}/${entry.totalMarks}`;
        refs.topPerformers.appendChild(node);
      });
    }

    function leaderboardRows(ranked, highlightId, collapsed) {
      if (!collapsed) return ranked;
      const topFive = ranked.slice(0, 5);
      const mine = ranked.find((row) => row.studentId === highlightId);
      return mine && !topFive.some((row) => row.studentId === highlightId)
        ? [...topFive, mine]
        : topFive;
    }

    function renderLeaderboard(ranked, highlightId) {
      const test = currentTest();
      refs.leaderboardCountBadge.textContent = `${ranked.length} students`;
      clearNode(refs.leaderboardBody);
      const headerItems = (test?.sectionBreakdown || []).slice(0, 3);
      refs.leaderboardSectionHeads.forEach((head, index) => {
        const item = headerItems[index];
        head.textContent = item ? item.shortLabel || item.name.slice(0, 3).toUpperCase() : `SEC ${index + 1}`;
      });

      const rows = leaderboardRows(
        ranked,
        highlightId,
        !state.studentLeaderboardOpen,
      );

      rows.forEach((row) => {
        const student = STUDENTS.find((item) => item.id === row.studentId) || {};
        const node = cloneTemplate("leaderboardRowTemplate");
        const mine = row.studentId === highlightId;
        const medal = createRankMedal(row.rank);

        if (mine) {
          node.classList.add("table-active", "student-highlight");
        }

        node.querySelector(".leaderboard-rank-text").textContent = `#${row.rank}`;
        if (medal) {
          node.querySelector(".leaderboard-rank-medal").appendChild(medal);
        }

        node
          .querySelector(".leaderboard-avatar")
          .appendChild(createAvatar(student.name || row.studentId, 28, student.profilePhotoUrl || ""));
        node.querySelector(".leaderboard-name").textContent = student.name || row.studentId;
        node.querySelector(".leaderboard-id").textContent = student.studentRef || student.id || row.studentId;
        node.querySelector(".leaderboard-physics").textContent = row.sectionScores?.[0]?.score ?? row.Physics;
        node.querySelector(".leaderboard-chemistry").textContent = row.sectionScores?.[1]?.score ?? row.Chemistry;
        node.querySelector(".leaderboard-maths").textContent = row.sectionScores?.[2]?.score ?? row.Maths;
        node.querySelector(".leaderboard-total").textContent = `${row.total}/${row.totalMarks || test?.totalMarks || 0}`;

        if (mine) {
          node
            .querySelector(".leaderboard-you")
            .appendChild(createBadge("You", "text-bg-info"));
        }

        refs.leaderboardBody.appendChild(node);
      });

      refs.leaderboardFooterText.textContent = state.studentLeaderboardOpen
        ? `Showing all ${ranked.length} students`
        : `Showing top 5${rows.length > 5 ? " + your rank" : ""}`;
      refs.leaderboardToggleBtn.textContent = state.studentLeaderboardOpen
        ? "Show Less"
        : "View All";
    }

    function renderHome(student, score, rank, ranked) {
      const test = currentTest();
      const flags = renderSubjectCards(score, student.id);
      const flaggedSubjects = SUBJECTS.filter((subject) => flags[subject]);
      const testIndex = TESTS.findIndex((test) => test.id === state.testId);
      const previousRank = testIndex
        ? getRankings(allScores[TESTS[testIndex - 1].id]).find(
            (entry) => entry.studentId === student.id,
          ).rank
        : null;
      const delta = previousRank ? previousRank - rank : null;
      const testStreak = calculateTestStreak(student.id, state.testId);

      refs.rankTierBadge.className = `badge rounded-pill ${
        rank <= 10
          ? "text-bg-info"
          : rank <= 25
            ? "text-bg-primary"
            : "text-bg-secondary"
      }`;
      refs.rankTierBadge.textContent =
        rank <= 10 ? "ELITE" : rank <= 25 ? "RISING STAR" : "BOOST SQUAD";
      refs.rankValue.textContent = `#${rank}`;
      refs.rankSummary.textContent = `of ${test?.totalStudents || ranked.length} students - ${currentTest().name}`;

      if (testStreak > 0) {
        refs.testStreakBadge.classList.remove("d-none");
        refs.testStreakText.textContent = `${testStreak}-TEST STREAK`;
      } else {
        refs.testStreakBadge.classList.add("d-none");
        refs.testStreakText.textContent = "";
      }

      refs.rankShiftBadge.classList.remove("up", "down", "flat", "d-none");
      if (delta === null) {
        refs.rankShiftBadge.classList.add("flat");
        refs.rankShiftIcon.textContent = "•";
        refs.rankShiftText.textContent = "0";
      } else if (delta > 0) {
        refs.rankShiftBadge.classList.add("up");
        refs.rankShiftIcon.textContent = "↑";
        refs.rankShiftText.textContent = String(delta);
      } else if (delta < 0) {
        refs.rankShiftBadge.classList.add("down");
        refs.rankShiftIcon.textContent = "↓";
        refs.rankShiftText.textContent = String(Math.abs(delta));
      } else {
        refs.rankShiftBadge.classList.add("flat");
        refs.rankShiftIcon.textContent = "•";
        refs.rankShiftText.textContent = "0";
      }

      renderHomeBreakdown(student, score, test?.score || score.total, previousRank, rank);

      renderCoaching(student.id, flaggedSubjects);
      renderTopPerformers(ranked);
      renderLeaderboard(ranked, student.id);
    }

    function renderAnalytics(student, score) {
      const ranks = TESTS.map(
        (test) =>
          getRankings(allScores[test.id]).find(
            (entry) => entry.studentId === student.id,
          ).rank,
      );

      renderKpiRow(
        refs.rankJourneyRow,
        TESTS.map((test, index) => ({
          label: test.shortDate,
          value: `#${ranks[index]}`,
          extra: index
            ? `${ranks[index - 1] - ranks[index] >= 0 ? "Up" : "Down"} ${Math.abs(
                ranks[index - 1] - ranks[index],
              )}`
            : "Baseline",
        })),
      );

      clearNode(refs.topicAnalyticsContainer);
      const test = currentTest();
      const sections = test?.sectionBreakdown || [];
      refs.analyticsBreakdownTitle.textContent = sections.length <= 1
        ? "Topic Analytics"
        : "Section Analytics";

      sections.forEach((section, index) => {
        const theme = Object.values(SUBJECT_THEMES)[index % Object.values(SUBJECT_THEMES).length];
        const node = cloneTemplate("topicCardTemplate");
        const rowsContainer = node.querySelector(".topic-rows");

        node.querySelector(".topic-subject-icon").appendChild(createSubjectIcon(section.shortLabel || section.name));
        node.querySelector(".topic-subject-name").textContent = section.name;
        node.querySelector(".topic-subject-name").style.color = theme.accent;
        node.querySelector(".topic-subject-score").textContent = `${section.score}/${section.total}`;

        TESTS.forEach((item) => {
          const sectionItem = (item.sectionBreakdown || []).find((entry) => entry.name === section.name);
          if (!sectionItem) {
            return;
          }
          const row = cloneTemplate("topicRowTemplate");
          row.querySelector(".topic-name").textContent = `${item.shortDate} - ${item.name}`;
          row.querySelector(".topic-score").textContent = `${sectionItem.score}/${sectionItem.total}`;
          setProgressBar(
            row.querySelector(".topic-progress-fill"),
            sectionItem.percentage,
            `linear-gradient(135deg, ${theme.from}, ${theme.to})`,
          );
          rowsContainer.appendChild(row);
        });

        refs.topicAnalyticsContainer.appendChild(node);
      });
    }

    function renderRewards(student) {
      const rewardPayload = MY_TESTS_PAYLOAD.rewards || {
        xp: 0,
        level: 1,
        progress: 0,
        streak: 0,
        badges: BADGES.map((badge) => ({ ...badge, earned: false })),
      };

      refs.rewardLevelTitle.textContent = `Level ${rewardPayload.level}`;
      refs.rewardXpText.textContent = `${rewardPayload.xp} XP earned`;
      refs.rewardStreakBadge.textContent = `${rewardPayload.streak} TEST STREAK`;
      setProgressBar(
        refs.rewardProgressBar,
        Math.round((rewardPayload.progress || 0) * 100),
        "linear-gradient(135deg, #2563eb, #0d6efd 52%, #06b6d4)",
      );

      clearNode(refs.rewardsGrid);
      (rewardPayload.badges || []).forEach((badgeItem) => {
        const node = cloneTemplate("rewardCardTemplate");
        const shell = node.querySelector(".reward-card-shell");
        node.querySelector(".reward-icon-text").textContent = badgeItem.icon;
        node.querySelector(".reward-name").textContent = badgeItem.name;
        node.querySelector(".reward-desc").textContent = badgeItem.desc;
        node.querySelector(".reward-meta").textContent = `${
          badgeItem.earned ? "earned" : "locked"
        } - ${badgeItem.tier}`;

        if (!badgeItem.earned) {
          shell.classList.add("opacity-50");
        }

        refs.rewardsGrid.appendChild(node);
      });
    }

    function render() {
      const student = STUDENTS.find((entry) => entry.id === CURRENT_STUDENT_ID) || CURRENT_STUDENT;
      const scores = currentScores() || [];
      const ranked = getRankings(scores);
      const score = scores.find((entry) => entry.studentId === student.id) || {
        studentId: student.id,
        Physics: 0,
        Chemistry: 0,
        Maths: 0,
        total: 0,
      };
      const rankEntry = ranked.find((entry) => entry.studentId === student.id);
      const rank = rankEntry ? rankEntry.rank : 0;
      const xp = calculateXP(student.id);

      renderHeader(xp);
      if (!scores.length) {
        refs.rankTierBadge.className = "badge rounded-pill text-bg-secondary";
        refs.rankTierBadge.textContent = "NO TESTS YET";
        refs.rankValue.textContent = "--";
        refs.rankSummary.textContent = "No completed tests available yet.";
        refs.testStreakBadge.classList.add("d-none");
        refs.rankShiftBadge.classList.add("d-none");
        clearNode(refs.homeKpiRow);
        clearNode(refs.subjectCards);
        clearNode(refs.topPerformers);
        clearNode(refs.leaderboardBody);
        clearNode(refs.rankJourneyRow);
        clearNode(refs.topicAnalyticsContainer);
        refs.coachingSection.classList.add("d-none");
        refs.leaderboardCountBadge.textContent = "0 students";
        refs.leaderboardFooterText.textContent = "";
        renderRewards(student);
        return;
      }

      renderHome(student, score, rank, ranked);
      renderAnalytics(student, score);
      renderRewards(student);
    }

    function renderHomeBreakdown(scoreTotal, previousRank, rank) {
      clearNode(refs.homeKpiRow);

      const selectedTest = currentTest();
      const totalCard = document.createElement("div");
      totalCard.className = "home-score-card";
      const totalLabel = document.createElement("div");
      totalLabel.className = "home-score-label";
      totalLabel.textContent = "Scored Marks";

      const totalValueRow = document.createElement("div");
      totalValueRow.className = "home-score-total";

      const totalValue = document.createElement("span");
      totalValue.className = "home-score-value";
      totalValue.textContent = String(scoreTotal);

      const totalOutOf = document.createElement("span");
      totalOutOf.className = "home-score-outof";
      totalOutOf.textContent = `/ ${selectedTest?.totalMarks || 0}`;

      totalValueRow.appendChild(totalValue);
      totalValueRow.appendChild(totalOutOf);

      const totalMeta = document.createElement("div");
      totalMeta.className = "home-score-meta";
      totalMeta.textContent =
        `${
          previousRank === null
            ? "First recorded test"
            : rank < previousRank
              ? `Improved by ${previousRank - rank} rank${previousRank - rank === 1 ? "" : "s"} from previous test`
              : rank > previousRank
                ? `Dropped by ${rank - previousRank} rank${rank - previousRank === 1 ? "" : "s"} from previous test`
                : "Same rank as previous test"
        } \u00b7 ${selectedTest?.name || ""}`;

      totalCard.appendChild(totalLabel);
      totalCard.appendChild(totalValueRow);
      totalCard.appendChild(totalMeta);
      refs.homeKpiRow.appendChild(totalCard);

      const breakdown = getHomeBreakdownItems();
      const breakdownCard = document.createElement("div");
      breakdownCard.className = "home-score-card";

      const title = document.createElement("div");
      title.className = "home-score-label";
      title.textContent = breakdown.title;
      breakdownCard.appendChild(title);

      const grid = document.createElement("div");
      grid.className = "home-score-grid mt-3";

      breakdown.items.forEach((item) => {
        const chip = document.createElement("div");
        chip.className = "home-score-chip";
        const chipName = document.createElement("div");
        chipName.className = "home-score-chip-name";
        chipName.textContent = item.label;

        const chipValue = document.createElement("div");
        chipValue.className = "home-score-chip-value";
        chipValue.textContent = `${item.value}/${item.total}`;

        const chipMeta = document.createElement("div");
        chipMeta.className = "home-score-chip-meta";
        chipMeta.textContent = item.meta;

        chip.appendChild(chipName);
        chip.appendChild(chipValue);
        chip.appendChild(chipMeta);
        grid.appendChild(chip);
      });

      breakdownCard.appendChild(grid);
      refs.homeKpiRow.appendChild(breakdownCard);
    }

    function renderCoaching() {
      const test = currentTest();
      const coachingItems = test?.coachingItems || [];
      if (!coachingItems.length) {
        refs.coachingSection.classList.add("d-none");
        return;
      }

      refs.coachingSection.classList.remove("d-none");
      refs.coachingTitle.textContent = "Tonight's Coaching";
      refs.coachingSchedule.textContent = "Personal mentorship \u00b7 30 minutes per subject";
      refs.coachingDurationBadge.textContent = `${Math.max(coachingItems.length, 1) * 30} MIN`;

      clearNode(refs.coachingItems);
      coachingItems.forEach((item) => {
        const node = cloneTemplate("clusterItemTemplate");
        node.querySelector(".cluster-icon").appendChild(createSubjectIcon(item.shortLabel || item.name));
        node.querySelector(".cluster-subject").textContent = item.name;
        node.querySelector(".cluster-faculty").textContent = `${item.score}/${item.total} marks \u00b7 ${item.percentage}%`;
        node
          .querySelector(".cluster-status")
          .appendChild(
            createBadge(
              item.status || "Focus Area",
              {
                "Focus Area": "text-bg-danger",
                "On Track": "text-bg-success",
              }[item.status || "Focus Area"],
            ),
          );
        refs.coachingItems.appendChild(node);
      });
    }

    function renderSubjectCards() {
      const test = currentTest();
      clearNode(refs.subjectCards);

      (test?.sectionBreakdown || []).forEach((section, index) => {
        const theme = Object.values(SUBJECT_THEMES)[index % Object.values(SUBJECT_THEMES).length];
        const average = Math.round(
          ((test.leaderboard || []).reduce((sum, entry) => {
            const sectionScore = entry.sectionScores?.[index];
            return sum + (sectionScore ? sectionScore.score : 0);
          }, 0) / Math.max((test.leaderboard || []).length, 1)) * 10,
        ) / 10;
        const node = cloneTemplate("subjectCardTemplate");

        node.querySelector(".subject-icon").appendChild(createSubjectIcon(section.shortLabel || section.name));
        node.querySelector(".subject-title").textContent = section.name;
        node.querySelector(".subject-rank").textContent = `${section.score}/${section.total} in this section`;
        node.querySelector(".subject-score").textContent = section.score;
        node.querySelector(".subject-score").style.color = theme.accent;
        node.querySelector(".subject-average").textContent = `Class avg ${average}/${section.total}`;
        setProgressBar(
          node.querySelector(".subject-progress-fill"),
          section.percentage,
          `linear-gradient(135deg, ${theme.from}, ${theme.to})`,
        );
        node
          .querySelector(".subject-delta")
          .appendChild(
            createBadge(
              `${section.percentage}% scored`,
              section.percentage >= 60 ? "text-bg-success" : "text-bg-danger",
            ),
          );

        refs.subjectCards.appendChild(node);
      });
    }

    function renderTopPerformers() {
      clearNode(refs.topPerformers);

      const test = currentTest();
      const topEntries = (test?.topPerformers && test.topPerformers.length)
        ? test.topPerformers
        : currentLeaderboard().slice(0, 5);

      topEntries.forEach((entry) => {
        const student = STUDENTS.find((item) => item.id === entry.studentId) || {};
        const node = cloneTemplate("topPerformerTemplate");
        const medal = createRankMedal(entry.rank);

        node.querySelector(".top-performer-rank").textContent = `#${entry.rank}`;
        if (medal) {
          node.querySelector(".top-performer-rank").appendChild(medal);
        }

        node
          .querySelector(".top-performer-avatar")
          .appendChild(
            createAvatar(
              entry.studentName || student.name || entry.studentId,
              42,
              entry.profilePhotoUrl || student.profilePhotoUrl || "",
            ),
          );
        node.querySelector(".top-performer-name").textContent =
          entry.studentName || student.name || entry.studentId;
        node.querySelector(".top-performer-meta").textContent =
          `#${entry.rank} - ${(entry.score ?? entry.total ?? 0)}/${entry.totalMarks || test?.totalMarks || 0}`;
        refs.topPerformers.appendChild(node);
      });
    }

    function renderLeaderboard() {
      const test = currentTest();
      const ranked = currentLeaderboard();
      refs.leaderboardCountBadge.textContent = `${ranked.length} students`;
      clearNode(refs.leaderboardBody);
      const headerItems = (test?.sectionBreakdown || []).slice(0, 3);
      refs.leaderboardSectionHeads.forEach((head, index) => {
        const item = headerItems[index];
        head.textContent = item ? item.shortLabel || item.name.slice(0, 3).toUpperCase() : `SEC ${index + 1}`;
      });

      const rows = leaderboardRows(
        ranked,
        CURRENT_STUDENT_ID,
        !state.studentLeaderboardOpen,
      );

      rows.forEach((row) => {
        const student = STUDENTS.find((item) => item.id === row.studentId) || {};
        const node = cloneTemplate("leaderboardRowTemplate");
        const mine = row.studentId === CURRENT_STUDENT_ID;
        const medal = createRankMedal(row.rank);

        if (mine) {
          node.classList.add("table-active", "student-highlight");
        }

        node.querySelector(".leaderboard-rank-text").textContent = `#${row.rank}`;
        if (medal) {
          node.querySelector(".leaderboard-rank-medal").appendChild(medal);
        }

        node
          .querySelector(".leaderboard-avatar")
          .appendChild(
            createAvatar(
              row.studentName || student.name || row.studentId,
              28,
              row.profilePhotoUrl || student.profilePhotoUrl || "",
            ),
          );
        node.querySelector(".leaderboard-name").textContent = row.studentName || student.name || row.studentId;
        node.querySelector(".leaderboard-id").textContent = row.studentRef || student.studentRef || student.id || row.studentId;
        node.querySelector(".leaderboard-physics").textContent = row.sectionScores?.[0]?.score ?? "-";
        node.querySelector(".leaderboard-chemistry").textContent = row.sectionScores?.[1]?.score ?? "-";
        node.querySelector(".leaderboard-maths").textContent = row.sectionScores?.[2]?.score ?? "-";
        node.querySelector(".leaderboard-total").textContent = `${row.score ?? 0}/${row.totalMarks || test?.totalMarks || 0}`;

        if (mine) {
          node
            .querySelector(".leaderboard-you")
            .appendChild(createBadge("You", "text-bg-info"));
        }

        refs.leaderboardBody.appendChild(node);
      });

      refs.leaderboardFooterText.textContent = state.studentLeaderboardOpen
        ? `Showing all ${ranked.length} students`
        : `Showing top 5${rows.length > 5 ? " + your rank" : ""}`;
      refs.leaderboardToggleBtn.textContent = state.studentLeaderboardOpen
        ? "Show Less"
        : "View All";
    }

    function renderHome(student) {
      const test = currentTest();
      const rank = test?.rank || 0;
      const delta = test?.rankDelta ?? null;
      const previousRank = delta === null ? null : rank + delta;
      const testStreak = test?.testStreak || 0;

      refs.rankTierBadge.className = `badge rounded-pill ${
        rank <= 10
          ? "text-bg-info"
          : rank <= 25
            ? "text-bg-primary"
            : "text-bg-secondary"
      }`;
      refs.rankTierBadge.textContent =
        rank <= 10 ? "ELITE" : rank <= 25 ? "RISING STAR" : "BOOST SQUAD";
      refs.rankValue.textContent = `#${rank}`;
      refs.rankSummary.textContent = `of ${test?.totalStudents || currentLeaderboard().length} students - ${test?.name || ""}`;

      if (testStreak > 0) {
        refs.testStreakBadge.classList.remove("d-none");
        refs.testStreakText.textContent = `${testStreak}-TEST STREAK`;
      } else {
        refs.testStreakBadge.classList.add("d-none");
        refs.testStreakText.textContent = "";
      }

      refs.rankShiftBadge.classList.remove("up", "down", "flat", "d-none");
      if (delta === null) {
        refs.rankShiftBadge.classList.add("flat");
        refs.rankShiftIcon.textContent = "\u2022";
        refs.rankShiftText.textContent = "0";
      } else if (delta > 0) {
        refs.rankShiftBadge.classList.add("up");
        refs.rankShiftIcon.textContent = "\u2191";
        refs.rankShiftText.textContent = String(delta);
      } else if (delta < 0) {
        refs.rankShiftBadge.classList.add("down");
        refs.rankShiftIcon.textContent = "\u2193";
        refs.rankShiftText.textContent = String(Math.abs(delta));
      } else {
        refs.rankShiftBadge.classList.add("flat");
        refs.rankShiftIcon.textContent = "\u2022";
        refs.rankShiftText.textContent = "0";
      }

      renderHomeBreakdown(test?.score || 0, previousRank, rank);
      renderSubjectCards();
      renderCoaching();
      renderTopPerformers();
      renderLeaderboard();
    }

    function renderAnalytics() {
      renderKpiRow(
        refs.rankJourneyRow,
        TESTS.map((test, index) => ({
          label: test.shortDate,
          value: `#${test.rank || "-"}`,
          extra:
            index === 0 || test.rankDelta === null || test.rankDelta === undefined
              ? "Baseline"
              : `${test.rankDelta >= 0 ? "Up" : "Down"} ${Math.abs(test.rankDelta)}`,
        })),
      );

      clearNode(refs.topicAnalyticsContainer);
      const test = currentTest();
      const sections = test?.sectionBreakdown || [];
      refs.analyticsBreakdownTitle.textContent = sections.length <= 1
        ? "Topic Analytics"
        : "Section Analytics";

      sections.forEach((section, index) => {
        const theme = Object.values(SUBJECT_THEMES)[index % Object.values(SUBJECT_THEMES).length];
        const node = cloneTemplate("topicCardTemplate");
        const rowsContainer = node.querySelector(".topic-rows");

        node.querySelector(".topic-subject-icon").appendChild(createSubjectIcon(section.shortLabel || section.name));
        node.querySelector(".topic-subject-name").textContent = section.name;
        node.querySelector(".topic-subject-name").style.color = theme.accent;
        node.querySelector(".topic-subject-score").textContent = `${section.score}/${section.total}`;

        TESTS.forEach((item) => {
          const sectionItem = (item.sectionBreakdown || []).find((entry) => entry.name === section.name);
          if (!sectionItem) {
            return;
          }
          const row = cloneTemplate("topicRowTemplate");
          row.querySelector(".topic-name").textContent = `${item.shortDate} - ${item.name}`;
          row.querySelector(".topic-score").textContent = `${sectionItem.score}/${sectionItem.total}`;
          setProgressBar(
            row.querySelector(".topic-progress-fill"),
            sectionItem.percentage,
            `linear-gradient(135deg, ${theme.from}, ${theme.to})`,
          );
          rowsContainer.appendChild(row);
        });

        refs.topicAnalyticsContainer.appendChild(node);
      });
    }

    function renderRewards() {
      refs.rewardLevelTitle.textContent = `Level ${REWARD_PAYLOAD.level}`;
      refs.rewardXpText.textContent = `${REWARD_PAYLOAD.xp} XP earned`;
      refs.rewardStreakBadge.textContent = `${REWARD_PAYLOAD.streak} TEST STREAK`;
      setProgressBar(
        refs.rewardProgressBar,
        Math.round((REWARD_PAYLOAD.progress || 0) * 100),
        "linear-gradient(135deg, #2563eb, #0d6efd 52%, #06b6d4)",
      );

      clearNode(refs.rewardsGrid);
      (REWARD_PAYLOAD.badges || []).forEach((badgeItem) => {
        const node = cloneTemplate("rewardCardTemplate");
        const shell = node.querySelector(".reward-card-shell");
        node.querySelector(".reward-icon-text").textContent = badgeItem.icon;
        node.querySelector(".reward-name").textContent = badgeItem.name;
        node.querySelector(".reward-desc").textContent = badgeItem.desc;
        node.querySelector(".reward-meta").textContent = `${
          badgeItem.earned ? "earned" : "locked"
        } - ${badgeItem.tier}`;

        if (!badgeItem.earned) {
          shell.classList.add("opacity-50");
        }

        refs.rewardsGrid.appendChild(node);
      });
    }

    function render() {
      const student = STUDENTS.find((entry) => entry.id === CURRENT_STUDENT_ID) || CURRENT_STUDENT;
      const test = currentTest();

      renderHeader();
      if (!test) {
        refs.rankTierBadge.className = "badge rounded-pill text-bg-secondary";
        refs.rankTierBadge.textContent = "NO TESTS YET";
        refs.rankValue.textContent = "--";
        refs.rankSummary.textContent = "No completed tests available yet.";
        refs.testStreakBadge.classList.add("d-none");
        refs.rankShiftBadge.classList.add("d-none");
        clearNode(refs.homeKpiRow);
        clearNode(refs.subjectCards);
        clearNode(refs.topPerformers);
        clearNode(refs.leaderboardBody);
        clearNode(refs.rankJourneyRow);
        clearNode(refs.topicAnalyticsContainer);
        refs.coachingSection.classList.add("d-none");
        refs.leaderboardCountBadge.textContent = "0 students";
        refs.leaderboardFooterText.textContent = "";
        renderRewards();
        return;
      }

      renderHome(student);
      renderAnalytics();
      renderRewards();
    }

    refs.tabButtons.forEach((button) => {
      button.addEventListener("click", () => {
        state.studentTab = button.dataset.tab;
        render();
      });
    });

    refs.testButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const slot = TEST_SELECTOR_SLOTS[Number(button.dataset.slotIndex)];
        if (!slot) return;

        if (slot.kind === "completed") {
          state.testId = slot.id;
          state.studentLeaderboardOpen = false;
          render();
          return;
        }

        if (slot.kind === "upcoming" && slot.canLaunchNow && slot.launchUrl) {
          window.location.href = slot.launchUrl;
          return;
        }

        state.studentLeaderboardOpen = false;
      });
    });

    refs.leaderboardToggleBtn.addEventListener("click", () => {
      state.studentLeaderboardOpen = !state.studentLeaderboardOpen;
      render();
    });

    window.addEventListener("online", () => {
      state.online = true;
      render();
    });

    window.addEventListener("offline", () => {
      state.online = false;
      render();
    });

    document.addEventListener("keydown", (event) => {
      if (["INPUT", "TEXTAREA", "SELECT"].includes(event.target.tagName)) return;
      if (["1", "2", "3"].includes(event.key)) {
        state.studentTab = ["home", "analytics", "rewards"][Number(event.key) - 1];
        render();
      }
    });
    render();
  })();
</script>
{% endblock %}
