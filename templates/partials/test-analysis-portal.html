        const meta = analysisSectionMeta(score, sub);
        const total = meta.total || 100;
        const scoreBasis = currentScores();
        const avg = scoreBasis.length ? Math.round(scoreBasis.reduce((n, s) => n + scoreForSubject(s, sub, index), 0) / scoreBasis.length) : 0;
        const rank = getRankings(scoreBasis, sub.key).find((s) => s.studentId === score.studentId)?.rank || "NA";
        const delta = meta.score - avg;
        const boostBadge = sub.key === "Biology" && flagged ? ` ${badge("Boost", "text-bg-warning text-dark")}` : "";
        return `<div class="col-md-4">${card("p-3 h-100 subject-card", `<div class="d-flex align-items-center gap-2 mb-2">${subjectIcon(sub.key)}<div><b>${esc(sub.label || sub.key)}</b>${boostBadge}<div class="small soft">Subject rank ${formatRankValue(rank)}</div></div></div><div class="display fs-2 fw-bold" style="color:${t.accent}">${meta.score}${meta.total ? `/${meta.total}` : ""}</div>${progress(meta.total ? Math.round((meta.score / meta.total) * 100) : meta.score, t.accent)}<div class="d-flex justify-content-between align-items-center mt-2"><span class="small soft">Class avg ${avg}${meta.total ? `/${meta.total}` : ""}</span>${badge(delta >= 0 ? `+${delta} vs avg` : `${delta} vs avg`, delta >= 0 ? "text-bg-success" : "text-bg-danger")}</div>` )}</div>`;
      }

      function rankMedal(rank) {
        const medals = {
          1: { icon: "🥇", label: "Gold medal" },
          2: { icon: "🥈", label: "Silver medal" },
          3: { icon: "🥉", label: "Bronze medal" }
        };
        const medal = medals[rank];
        if (medal) return `<span class="rank-medal" role="img" aria-label="${medal.label}" title="${medal.label}">${medal.icon}</span>`;
        return "";
      }

      function leaderboardRows(ranked, highlightId, collapsed) {
        if (!collapsed) return ranked;
        const firstFive = ranked.slice(0, 5);
        const me = ranked.find((r) => r.studentId === highlightId);
        return me && !firstFive.some((r) => r.studentId === highlightId) ? [...firstFive, me] : firstFive;
      }

      function toggleStudentLeaderboard() {
        state.studentLeaderboardOpen = !state.studentLeaderboardOpen;
        render();
      }

      function getBatchRank(score) {
        if (state.user?.type === "admin" && state.batchId) {
          const rankedForSelectedBatch = getRankings(currentScores()).map(scoreStudent);
          const index = rankedForSelectedBatch.findIndex((item) => item.studentId === score.studentId);
          return index >= 0 ? index + 1 : "NA";
        }

        if (String(score?.batchRank || "").toUpperCase() === "NA") return "NA";
        const explicitRank = Number.parseInt(score?.batchRank, 10);
        if (Number.isInteger(explicitRank)) return explicitRank;

        const student = scoreStudent(score);
        const batch = String(student.batch || "").trim();
        if (!batch) return "NA";

        const batchRanked = getRankings(currentScores())
          .map(scoreStudent)
          .filter((item) => String(item.batch || "").trim().toLowerCase() === batch.toLowerCase());
        const index = batchRanked.findIndex((item) => item.studentId === score.studentId);
        return index >= 0 ? index + 1 : "NA";
      }

      function leaderboard(ranked, highlightId = "", collapsible = false) {
        const rows = leaderboardRows(ranked, highlightId, collapsible && !state.studentLeaderboardOpen);
        const subjectDefs = currentSubjectDefinitions();
        const footer = collapsible ? `<div class="d-flex justify-content-between align-items-center mt-3">
          <div class="small soft">${state.studentLeaderboardOpen ? `Showing all ${ranked.length} students` : `Showing top 5${rows.length > 5 ? " + your rank" : ""}`}</div>
          <button class="btn btn-outline-light btn-sm rounded-pill" onclick="toggleStudentLeaderboard()">${state.studentLeaderboardOpen ? "Show Less" : "View All"}</button>
        </div>` : "";
        return card("p-3 mb-4", `<div class="d-flex justify-content-between align-items-center mb-2"><h5 class="display fw-bold mb-0">Leaderboard</h5>${collapsible ? badge(`${ranked.length} students`, "text-bg-info") : ""}</div><div class="table-responsive"><table class="table table-sm table-dark table-striped table-hover align-middle mb-0"><thead><tr><th>#</th><th>Student</th>${subjectDefs.map((subject, index) => `<th title="${esc(subject.name || subject.sectionName || subject.label || subject.key)}">${esc(subject.shortLabel || sectionDisplayLabel(subject, index))}</th>`).join("")}<th>TOTAL SCORE</th><th>BATCH RANKING</th><th>INSTITUTE RANKING</th></tr></thead><tbody>${rows.map((r) => {
          const stu = scoreStudent(r);
          const mine = stu.id === highlightId;
          const batchRank = getBatchRank(r);
          const subjectCells = subjectDefs.map((subject, index) => `<td>${scoreForSubject(r, subject, index)}</td>`).join("");
          const totalMarks = rowTotalMarks(r);
          return `<tr class="${mine ? "table-active student-highlight" : ""}"><td class="mono leaderboard-rank"><span>${formatRankValue(r.rank)}</span>${Number.isInteger(Number.parseInt(r.rank, 10)) ? rankMedal(Number.parseInt(r.rank, 10)) : ""}</td><td class="leaderboard-student"><div class="d-flex align-items-center gap-2">${avatar(stu.name, 28)}<div class="overflow-hidden"><span class="fw-semibold">${esc(stu.name)}</span>${mine ? ` ${badge("You", "text-bg-info")}` : ""}<div class="small soft mono">${esc(displayStudentId(stu))}${stu.batch ? ` - ${esc(stu.batch)}` : ""}</div></div></div></td>${subjectCells}<td><b>${rowTotalScore(r)}${totalMarks ? `/${totalMarks}` : ""}</b></td><td>${batchRank === "NA" ? "NA" : `#${batchRank}`}</td><td>${formatRankValue(r.rank)}</td></tr>`;
        }).join("")}</tbody></table></div>${footer}`);
      }

      function studentAnalytics(student, score) {
        const ranks = TESTS.map((t) => getRankings(allScores[t.id]).find((s) => s.studentId === student.id).rank);
        return `${card("p-4 mb-4", `<h5 class="display fw-bold">Rank Journey</h5><div class="row g-2">${TESTS.map((t, i) => kpi(t.shortDate, `#${ranks[i]}`, i ? `${ranks[i - 1] - ranks[i] >= 0 ? "Up" : "Down"} ${Math.abs(ranks[i - 1] - ranks[i])}` : "Baseline")).join("")}</div>`)}
        <h5 class="display fw-bold">Topic Analytics</h5>
        <div class="vstack gap-3 mb-4">${currentSubjectDefinitions().map((sub, index) => {
          const t = subjectTheme(sub.key, index);
          const meta = analysisSectionMeta(score, sub);
          return card("p-3", `<div class="d-flex align-items-center justify-content-between mb-2"><div class="d-flex align-items-center gap-2">${subjectIcon(sub.key)}<div><b style="color:${t.accent}">${esc(sub.label || sub.key)}</b><div class="small soft">Topic-wise mastery</div></div></div><span class="mono">${meta.score}${meta.total ? `/${meta.total}` : ""}</span></div>${generateTopicMastery(student.id, state.testId, sub.key).map((x) => `<div class="mt-2"><div class="d-flex justify-content-between small"><span>${esc(x.topic)}</span><span class="soft">${x.score}%</span></div>${progress(x.score, t.accent)}</div>`).join("")}`);
        }).join("")}</div>`;
      }

      function studentRewards(student, xp) {
        const earned = getEarnedBadges(student.id);
        const streak = calculateStreaks(student.id).improveStreak;
        return `${card("p-4 mb-4", `<div class="d-flex justify-content-between"><div><h5 class="display fw-bold">Level ${xp.level}</h5><div class="soft small">${xp.xp} XP earned</div></div>${badge(`${streak} TEST STREAK`, "text-bg-warning text-dark")}</div><div class="mt-3">${progress(Math.round(xp.progress * 100), "linear-gradient(135deg,#ff8a00,#e52e71,#7c3aed)")}</div>`)}
        <div class="row g-3">${BADGES.map((b) => `<div class="col-md-6">${card(`p-3 h-100 ${earned.has(b.id) ? "" : "opacity-50"}`, `<div class="d-flex gap-3"><div class="reward-icon">${b.icon}</div><div><b>${b.name}</b><div class="small soft">${b.desc}</div><div class="small mono soft text-uppercase">${earned.has(b.id) ? "earned" : "locked"} - ${b.tier}</div></div></div>`)}</div>`).join("")}</div>`;
      }

      function facultyView() {
        const faculty = state.user.faculty, subject = faculty.subject;
        return `<div class="app-shell pb-5"><div class="container-fluid px-3 px-lg-4">
          ${nav([["attend","Attendance"],["topics","Topic Focus"],["notes","Notes"]], state.facultyTab, "state.facultyTab")}
          ${testSelector()}
          ${state.facultyTab === "attend" ? facultyAttendance(subject) : state.facultyTab === "topics" ? facultyTopics(subject) : facultyNotes(subject)}
        </div></div>`;
      }

      function facultyAttendance(subject) {
        const cluster = getBottomCluster(currentScores(), subject).map(scoreStudent);
        const att = state.attendance[subject] || {};
        const counts = ["present", "late", "absent"].map((x) => Object.values(att).filter((s) => s === x).length);
        const marked = counts.reduce((a, b) => a + b, 0);
        const finalized = !!state.attendance.finalized?.[subject];
        const allThree = getAllThreeSet(currentScores());
        const scheduleItem = CLUSTER_SCHEDULE[subject] || { time: "To be scheduled", room: "Room pending" };
        const theme = subjectTheme(subject);
        return `${card("p-4 mb-4", `${badge("Tonight's Session", "text-bg-primary")}<h2 class="display fw-bold mt-2">${subject} Revision</h2><div class="soft small mono">${scheduleItem.time} - ${scheduleItem.room} - ${cluster.length} students</div><div class="row g-2 mt-3">${kpi("Present", counts[0], "marked")}${kpi("Late", counts[1], "marked")}${kpi("Absent", counts[2], "marked")}</div><div class="mt-3">${progress(cluster.length ? Math.round(marked / cluster.length * 100) : 0, theme.accent)}</div><div class="d-flex gap-2 flex-wrap mt-3"><button class="btn btn-outline-light" ${finalized ? "disabled" : ""} onclick="openQR('${subject}')">Scan QR</button>${finalized ? `${badge("Finalized", "text-bg-success")}<button class="btn btn-outline-light btn-sm" onclick="resetAttendance('${subject}')">Re-open</button>` : `<button class="btn btn-brand flex-grow-1" onclick="finalizeAttendance('${subject}')">Finalize and auto-mark rest absent</button>`}</div>`)}
        <h5 class="display fw-bold">Mark Attendance</h5><div class="vstack gap-2 mb-4">${cluster.map((s, i) => attendanceRow(s, i, att[s.studentId] || "pending", allThree.has(s.studentId), finalized, subject)).join("")}</div>`;
      }

      function attendanceRow(s, i, status, allThree, disabled, subject) {
        const btnClass = (x) => status !== x ? "btn-outline-light" : x === "present" ? "btn-success" : x === "late" ? "btn-warning" : "btn-danger";
        return card("p-2 d-flex flex-row align-items-center gap-2", `<span class="mono soft text-center" style="width:26px">${i + 1}</span>${avatar(s.name, 34)}<div class="flex-grow-1 overflow-hidden"><b class="text-truncate d-block">${esc(s.name)}</b><div class="small soft mono">${esc(displayStudentId(s))} ${allThree ? "- all subjects" : ""}</div></div>${["present","late","absent"].map((x) => `<button class="btn btn-sm ${btnClass(x)}" ${disabled ? "disabled" : ""} onclick="setAttendanceStatus('${subject}','${s.studentId}','${x}')">${x}</button>`).join("")}`);
      }

      function getAllThreeSet(scores) {
        const subjects = currentSubjectKeys();
        const clusters = Object.fromEntries(subjects.map((sub) => [sub, getBottomCluster(scores, sub).map((s) => s.studentId)]));
        return new Set(STUDENTS.filter((s) => subjects.every((sub) => clusters[sub].includes(s.id))).map((s) => s.id));
      }

      async function setAttendanceStatus(subject, studentId, status) {
        if (state.attendance.finalized?.[subject]) return;
        if (USE_BACKEND_ANALYSIS_DATA && state.user?.type === "faculty") {
          try {
            await postAnalysisJson(ANALYSIS_API.attendanceStatus, {
              test_id: currentBackendTestId(),
              subject,
              student_id: studentId,
              status,
            });
          } catch (error) {
            window.alert(error.message || "Unable to save attendance.");
            return;
          }
        }
        state.attendance[subject] = { ...(state.attendance[subject] || {}), [studentId]: status };
        saveAttendance();
        render();
      }

      async function finalizeAttendance(subject) {
        if (USE_BACKEND_ANALYSIS_DATA && state.user?.type === "faculty") {
          try {
            await postAnalysisJson(ANALYSIS_API.attendanceFinalize, {
              test_id: currentBackendTestId(),
              subject,
              finalized: true,
            });
          } catch (error) {
            window.alert(error.message || "Unable to finalize attendance.");
            return;
          }
        }
        const subj = { ...(state.attendance[subject] || {}) };
        getBottomCluster(currentScores(), subject).forEach((s) => {
          if (!subj[s.studentId]) subj[s.studentId] = "absent";
        });
        state.attendance[subject] = subj;
        state.attendance.finalized = { ...(state.attendance.finalized || {}), [subject]: true };
        saveAttendance();
        render();
      }

      async function resetAttendance(subject) {
        if (USE_BACKEND_ANALYSIS_DATA && state.user?.type === "faculty") {
          try {
            await postAnalysisJson(ANALYSIS_API.attendanceFinalize, {
              test_id: currentBackendTestId(),
              subject,
              finalized: false,
            });
          } catch (error) {
            window.alert(error.message || "Unable to reopen attendance.");
            return;
          }
        }
        state.attendance[subject] = {};
        state.attendance.finalized = { ...(state.attendance.finalized || {}), [subject]: false };
        saveAttendance();
        render();
      }

      function openQR(subject) {
        state.modal = `<div class="modal d-block" tabindex="-1" style="background:rgba(0,0,0,.72)"><div class="modal-dialog modal-dialog-centered"><div class="modal-content bg-dark text-white border-secondary"><div class="modal-header"><h5 class="modal-title">QR Attendance - ${subject}</h5><button class="btn-close btn-close-white" onclick="closeModal()"></button></div><div class="modal-body text-center"><div class="qr-box mx-auto mb-3"></div><p class="soft small">Type a student ID from this cluster and mark present.</p><div class="input-group"><input id="qr-input" class="form-control" placeholder="TRA001" onkeydown="if(event.key==='Enter') markQR('${subject}')"><button class="btn btn-brand" onclick="markQR('${subject}')">Mark</button></div></div></div></div></div>`;
        render(); setTimeout(() => document.getElementById("qr-input")?.focus(), 0);
      }

      async function markQR(subject) {
        const studentId = findClusterStudentIdByInput(subject, document.getElementById("qr-input").value);
        if (studentId) {
          await setAttendanceStatus(subject, studentId, "present");
        }
        state.modal = "";
        render();
      }

      function closeModal() { state.modal = ""; render(); }

      function facultyTopics(subject) {
        const cluster = getBottomCluster(currentScores(), subject).map(scoreStudent);
        const theme = subjectTheme(subject);
        return card("p-4 mb-4", `<h5 class="display fw-bold">${subject} Topic Focus</h5>${cluster.map((s) => mini("p-3 mb-2", `<div class="d-flex align-items-center gap-2 mb-2">${avatar(s.name, 32)}<div><b>${esc(s.name)}</b><div class="small soft mono">${esc(displayStudentId(s))} - score ${s[subject] || 0}</div></div></div>${generateTopicMastery(s.studentId, state.testId, subject).sort((a,b) => a.score - b.score).slice(0,4).map((x) => `<div class="mt-2"><div class="d-flex justify-content-between small"><span>${esc(x.topic)}</span><span>${x.score}%</span></div>${progress(x.score, theme.accent)}</div>`).join("")}`)).join("")}`);
      }

      function facultyNotes(subject) {
        const cluster = getBottomCluster(currentScores(), subject).map(scoreStudent);
        return card("p-4 mb-4", `<h5 class="display fw-bold">Faculty Notes</h5>${cluster.map((s) => {
          const key = noteStateKey(s.studentId, subject), notes = state.facultyNotes[key] || [];
          return mini("p-3 mb-2", `<div class="d-flex align-items-center gap-2">${avatar(s.name, 32)}<div class="flex-grow-1"><b>${esc(s.name)}</b><div class="small soft mono">${esc(displayStudentId(s))}</div></div></div><div class="input-group input-group-sm my-2"><input id="note-${key}" class="form-control" placeholder="Add a note"><button class="btn btn-brand" onclick="addNote('${key}')">Add</button></div>${notes.map((n) => `<div class="small soft border-top border-secondary border-opacity-25 py-1 d-flex justify-content-between"><span>${esc(n.text)}</span><button class="btn btn-sm btn-link text-danger p-0" onclick="deleteNote('${key}','${n.id}')">x</button></div>`).join("")}`);
        }).join("")}`);
      }

      async function addNote(key) {
        const text = document.getElementById(`note-${key}`).value.trim();
        if (!text) return;
        let note = { id: Date.now().toString(), text, at: new Date().toISOString() };
        if (USE_BACKEND_ANALYSIS_DATA && state.user?.type === "faculty") {
          const parsed = parseNoteStateKey(key);
          try {
            const response = await postAnalysisJson(ANALYSIS_API.noteCreate, {
              test_id: currentBackendTestId(),
              subject: parsed.subject,
              student_id: parsed.studentId,
              text,
            });
            note = response.note || note;
          } catch (error) {
            window.alert(error.message || "Unable to save note.");
            return;
          }
        }
        state.facultyNotes[key] = [note, ...(state.facultyNotes[key] || [])];
        saveAttendance();
        render();
      }

      async function deleteNote(key, id) {
        if (USE_BACKEND_ANALYSIS_DATA && state.user?.type === "faculty") {
          try {
            await postAnalysisJson(ANALYSIS_API.noteDelete, {
              note_id: id,
            });
          } catch (error) {
            window.alert(error.message || "Unable to delete note.");
            return;
          }
        }
        state.facultyNotes[key] = (state.facultyNotes[key] || []).filter((n) => n.id !== id);
        saveAttendance();
        render();
      }

      function adminView() {
        return `<div class="app-shell pb-5"><div class="container-fluid px-3 px-lg-4">
          ${adminTestSelector()}
          ${adminRecentTestChips()}
          ${adminOverview()}
        </div></div>`;
      }

      function downloadAnalysisPdf() {
        const test = currentTest();
        if (!test || !test.id) {
          window.alert("Please select a completed test first.");
          return;
        }
        const params = new URLSearchParams({ test_id: currentBackendTestId() || test.id });
        if (state.batchId) params.set("batch_id", state.batchId);
        const url = `${ANALYSIS_DOWNLOAD_PDF_URL}?${params}`;
        window.open(url, "_blank");
      }

      function adminOverview() {
        const scores = currentScores();
        const tests = testsForBatch();
        if (!tests.length || !state.testId) {
          return adminEmptyState();
        }

        const appeared = scores.filter((score) => score.attempted !== false);
        const analyticsScores = appeared.length ? appeared : scores;
        const ranked = getRankings(scores);
        const attemptedRanked = ranked.filter((score) => score.attempted !== false);
        const participantCount = appeared.length;
        const avg = analyticsScores.length ? Math.round(analyticsScores.reduce((n, s) => n + rowTotalScore(s), 0) / analyticsScores.length) : 0;
        const top = attemptedRanked[0] || null;
        const topStudent = top ? scoreStudent(top).name : "No attempts yet";
        const attendance = attendanceSummary(scores);
        const batch = currentBatch();
        const test = currentTest();

        return `<div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-2 mb-3">
          <div>
            <h4 class="display fw-bold mb-1">Batch-wise Test Analysis Dashboard</h4>
          </div>
          ${badge(`${participantCount}/${scores.length} appeared`, "text-bg-info")}
        </div>
        <div class="row g-3 mb-4">
          ${kpi("Total Students Appeared", `${participantCount}`, `${scores.length} assigned`)}
          ${kpi("Highest Score", `${top ? rowTotalScore(top) : 0}${rowTotalMarks(top) ? `/${rowTotalMarks(top)}` : ""}`, topStudent)}
          ${kpi("Average Score", `${avg}${analysisTotalMarks() ? `/${analysisTotalMarks()}` : ""}`, "selected batch")}
          ${kpi("Attendance", `${attendance.rate}%`, `${attendance.present}/${attendance.marked || 0} marked present`)}
        </div>
        ${adminSubjectAverages(scores)}
        ${leaderboard(ranked.slice(0, 25))}`;
      }

      function adminEmptyState() {
        return card("analysis-empty p-4 mb-4", `<div><div class="display fw-bold fs-4 mb-2">No tests found for ${esc(currentBatch().label)}</div><div class="soft">Once a test is assigned or attempted for this batch, the overview dashboard will appear here.</div></div>`);
      }

      function attendanceSummary(scores) {
        let present = 0, marked = 0;
        currentSubjectKeys().forEach((sub) => {
          getBottomCluster(scores, sub).forEach((score) => {
            const status = state.attendance[sub]?.[score.studentId];
            if (!status) return;
            marked += 1;
            if (["present", "late"].includes(status)) present += 1;
          });
        });
        return { present, marked, rate: marked ? Math.round((present / marked) * 100) : 0 };
      }

      function adminSubjectAverages(scores) {
        const appeared = scores.filter((score) => score.attempted !== false);
        const basis = appeared.length ? appeared : scores;
        const subjects = currentSubjectDefinitions();
        return `<div class="analysis-section-title"><h5 class="display fw-bold">Subject-wise Performance</h5>${badge(`${basis.length} students`, "text-bg-secondary")}</div>
        <div class="row g-3 mb-4">${subjects.map((sub, index) => {
          const t = subjectTheme(sub.key, index);
          const avgSub = basis.length ? Math.round(basis.reduce((n, s) => n + scoreForSubject(s, sub, index), 0) / basis.length) : 0;
          const sectionTotal = totalForSubject(basis.find((item) => item?.sectionScores?.length), sub, index) || sub.total || 0;
          const subjectRows = appeared
            .map((score) => ({ ...score, subjectScore: scoreForSubject(score, sub, index) }))
            .sort((a, b) => b.subjectScore - a.subjectScore || rowTotalScore(b) - rowTotalScore(a));
          const top = subjectRows[0] || null;
          const topStudent = top ? scoreStudent(top) : null;
          const topperText = topStudent
            ? `Highest: ${topStudent.name} - ${top.subjectScore}${sectionTotal ? `/${sectionTotal}` : ""}`
            : "Highest: No attempts yet";
          return `<div class="col-md-4">${mini("p-3 h-100", `${subjectIcon(sub.key)}<b class="ms-2">${esc(sub.label || sub.key)}</b><div class="small soft mt-3">Average marks</div><div class="display fs-3 fw-bold">${avgSub}${sectionTotal ? `/${sectionTotal}` : ""}</div>${progress(sectionTotal ? Math.round((avgSub / sectionTotal) * 100) : avgSub, t.accent)}<div class="small soft mt-2">${esc(topperText)}</div>`)}</div>`;
        }).join("")}</div>`;
      }

      function adminDistributionChart(scores) {
        const totalMarks = analysisTotalMarks() || 100;
        const buckets = [
          { label: "0-20%", min: 0, max: 20 },
          { label: "21-40%", min: 21, max: 40 },
          { label: "41-60%", min: 41, max: 60 },
          { label: "61-80%", min: 61, max: 80 },
          { label: "81-100%", min: 81, max: 100 },
        ].map((bucket) => ({
          ...bucket,
          count: scores.filter((score) => {
            const pct = totalMarks ? Math.round(rowTotalScore(score) / totalMarks * 100) : 0;
            return pct >= bucket.min && pct <= bucket.max;
          }).length,
        }));
        const maxCount = Math.max(1, ...buckets.map((bucket) => bucket.count));
        return card("p-3 h-100", `<div class="analysis-section-title"><h5 class="display fw-bold">Performance Distribution</h5>${badge(`${scores.length} appeared`, "text-bg-info")}</div>
          ${buckets.map((bucket) => `<div class="analysis-bar"><div class="analysis-bar-label mono">${bucket.label}</div><div class="analysis-bar-track"><div class="analysis-bar-fill" style="width:${Math.round(bucket.count / maxCount * 100)}%"></div></div><b class="mono">${bucket.count}</b></div>`).join("")}`);
      }

      function adminTopperPanel(ranked) {
        const rows = ranked.slice(0, 5).map((score, index) => {
          const stu = scoreStudent(score);
          return `<div class="d-flex align-items-center gap-2 py-2 border-bottom border-secondary border-opacity-25">
            <span class="mono soft" style="width:28px">#${index + 1}</span>${avatar(stu.name, 34)}
            <div class="flex-grow-1 overflow-hidden"><b class="text-truncate d-block">${esc(stu.name)}</b><div class="small soft mono">${esc(displayStudentId(stu))}</div></div>
            <b>${rowTotalScore(score)}${rowTotalMarks(score) ? `/${rowTotalMarks(score)}` : ""}</b>
          </div>`;
        }).join("");
        return card("p-3 h-100", `<div class="analysis-section-title"><h5 class="display fw-bold">Toppers List</h5>${badge("Top 5", "text-bg-success")}</div>${rows || `<div class="soft small">No topper data yet.</div>`}`);
      }

      function adminRiskPanel(alerts) {
        const rows = alerts.slice(0, 6).map((alert) => `<div class="py-2 border-bottom border-secondary border-opacity-25">
          <div class="d-flex align-items-center gap-2">${avatar(alert.name, 32)}<div class="flex-grow-1"><b>${esc(alert.name)}</b><div class="small soft mono">${esc(alert.studentRef || alert.id)}</div></div>${badge(`S${alert.severity}`, alert.severity >= 4 ? "text-bg-danger" : "text-bg-warning text-dark")}</div>
          <div class="small soft mt-2">${alert.reasons.map(esc).join(" | ")}</div>
        </div>`).join("");
        return card("p-3 h-100", `<div class="analysis-section-title"><h5 class="display fw-bold">Student Risk Alerts</h5>${badge(alerts.length, alerts.length ? "text-bg-danger" : "text-bg-success")}</div>${rows || `<div class="soft small">No active risk alerts for this batch.</div>`}`);
      }

      function adminWeakConcepts(scores) {
        const rows = currentSubjectKeys().map((sub) => {
          const topics = new Map();
          getBottomCluster(scores, sub, Math.min(6, scores.length)).forEach((score) => {
            generateTopicMastery(score.studentId, state.testId, sub)
              .sort((a, b) => a.score - b.score)
              .slice(0, 2)
              .forEach((item) => {
                const current = topics.get(item.topic) || { count: 0, total: 0 };
                topics.set(item.topic, { count: current.count + 1, total: current.total + item.score });
              });
          });
          const weak = [...topics.entries()]
            .map(([topic, value]) => ({ topic, count: value.count, avg: Math.round(value.total / value.count) }))
            .sort((a, b) => b.count - a.count || a.avg - b.avg)
            .slice(0, 3);
          return `<div class="mb-3"><div class="d-flex align-items-center gap-2 mb-2">${subjectIcon(sub)}<b>${esc(sub)}</b></div>${weak.map((item) => `<div class="d-flex justify-content-between small py-1"><span>${esc(item.topic)}</span><span class="soft">${item.count} flags</span></div>`).join("") || `<div class="small soft">No weak concepts detected.</div>`}</div>`;
        }).join("");
        return card("p-3 h-100", `<div class="analysis-section-title"><h5 class="display fw-bold">Weak Concepts</h5>${badge("Focus", "text-bg-warning text-dark")}</div>${rows}`);
      }

      function adminAttendanceSnapshot(scores) {
        const rows = currentSubjectKeys().map((sub) => {
          const cluster = getBottomCluster(scores, sub);
          const statuses = cluster.map((score) => state.attendance[sub]?.[score.studentId]).filter(Boolean);
          const present = statuses.filter((status) => ["present", "late"].includes(status)).length;
          const rate = statuses.length ? Math.round((present / statuses.length) * 100) : 0;
          return `<div class="d-flex justify-content-between align-items-center py-2 border-bottom border-secondary border-opacity-25"><span>${subjectIcon(sub)} <b class="ms-2">${esc(sub)}</b></span>${badge(`${rate}%`, rate >= 80 ? "text-bg-success" : rate >= 50 ? "text-bg-warning text-dark" : "text-bg-secondary")}</div>`;
        }).join("");
        return card("p-3 h-100", `<div class="analysis-section-title"><h5 class="display fw-bold">Attendance %</h5></div>${rows}`);
      }

      function adminClusterSnapshot(scores) {
        const allThree = getAllThreeSet(scores);
        const rows = currentSubjectKeys().map((sub) => `<div class="d-flex justify-content-between py-2 border-bottom border-secondary border-opacity-25"><span>${esc(sub)} cluster</span><b>${getBottomCluster(scores, sub).length}</b></div>`).join("");
        return card("p-3 h-100", `<div class="analysis-section-title"><h5 class="display fw-bold">Clusters</h5>${badge(`${allThree.size} all-subject`, "text-bg-info")}</div>${rows}`);
      }

      function adminPerformanceTrend() {
        const tests = testsForBatch().slice(-5);
        const rows = tests.map((test) => {
          const scores = filterScoresByBatch(rawScoresForTest(test.id), state.batchId).filter((score) => score.attempted !== false);
          const total = Number(test.totalMarks) || analysisTotalMarks() || 100;
          const avg = scores.length ? Math.round(scores.reduce((sum, score) => sum + rowTotalScore(score), 0) / scores.length) : 0;
          const pct = total ? Math.round(avg / total * 100) : avg;
          return `<div class="analysis-bar"><div class="analysis-bar-label text-truncate">${esc(test.shortDate || test.date || test.name)}</div><div class="analysis-bar-track"><div class="analysis-bar-fill" style="width:${Math.max(0, Math.min(100, pct))}%"></div></div><b class="mono">${avg}</b></div>`;
        }).join("");
        return card("p-3 h-100", `<div class="analysis-section-title"><h5 class="display fw-bold">Performance Trends</h5></div>${rows || `<div class="soft small">Trend appears after tests are available.</div>`}`);
      }

      function adminPredict() {
        const alerts = getPredictiveAlerts();
        return card("p-4 mb-4", `<h5 class="display fw-bold">Predictive Alerts</h5><div class="vstack gap-2">${alerts.map((a) => {
          const notes = currentSubjectKeys().flatMap((sub) => state.facultyNotes[noteStateKey(a.id, sub)] || []);
          return mini("p-3", `<div class="d-flex align-items-start gap-3">${avatar(a.name, 38)}<div class="flex-grow-1"><div class="d-flex justify-content-between"><b>${esc(a.name)}</b>${badge(`S${a.severity}`, a.severity >= 4 ? "text-bg-danger" : "text-bg-warning text-dark")}</div><div class="small soft mono">${esc(a.studentRef || a.id)} - ranks ${a.ranks.join(" -> ")}</div><ul class="small soft mb-1 mt-2">${a.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>${notes.length ? `<div class="small text-info">Faculty notes: ${notes.map((n) => esc(n.text)).join("; ")}</div>` : ""}</div></div>`);
        }).join("") || `<div class="soft small">No active risk alerts.</div>`}</div>`);
      }

      function adminStudents() {
        const q = state.adminSearch.toLowerCase();
        const ranked = getRankings(currentScores(), state.adminSort).map(scoreStudent).filter((s) => !q || s.name.toLowerCase().includes(q) || String(s.id || s.studentRef || "").toLowerCase().includes(q));
        const sortOptions = ["total", ...currentSubjectKeys()];
        return card("p-3 mb-4", `<div class="row g-2 mb-3"><div class="col-md"><input class="form-control" value="${esc(state.adminSearch)}" placeholder="Search name or ID" oninput="state.adminSearch=this.value;render()"></div><div class="col-md-auto"><select class="form-select" onchange="state.adminSort=this.value;render()">${sortOptions.map((k) => `<option ${state.adminSort === k ? "selected" : ""} value="${k}">${esc(k)}</option>`).join("")}</select></div></div>${leaderboard(ranked)}`);
      }

      function adminClusters() {
        const sc = currentScores(), allThree = getAllThreeSet(sc), notice = buildNotice(sc);
        const subjects = currentSubjectDefinitions();
        const schedule = card("p-4 mb-4", `<h5 class="display fw-bold">Cluster Schedule</h5><div class="row g-2">${subjects.map((sub) => {
          const scheduleItem = CLUSTER_SCHEDULE[sub.key] || { faculty: "Faculty", time: "To be scheduled" };
          return `<div class="col-md-4">${mini("p-3", `${subjectIcon(sub.key)}<b class="ms-2">${esc(sub.label || sub.key)}</b><div class="small soft mt-2">${esc(scheduleItem.faculty)}<br>${esc(scheduleItem.time)}</div>`)}</div>`;
        }).join("")}</div>`);
        const allSubjectBlock = allThree.size ? card("p-4 mb-4", `<h5 class="display fw-bold">All-Subjects Cluster</h5>${[...allThree].map((id) => {
          const s = scoreStudent(sc.find((x) => x.studentId === id));
          const scoreText = subjects.map((sub, index) => `${sub.shortLabel || sub.key}: ${scoreForSubject(s, sub, index)}`).join(" ");
          return mini("p-2 mb-2 d-flex flex-row align-items-center gap-2", `${avatar(s.name, 30)}<div class="flex-grow-1"><b>${esc(s.name)}</b><div class="small soft mono">${esc(displayStudentId(s))}</div></div><span class="mono small">${esc(scoreText)}</span>`);
        }).join("")}`) : "";
        const subjectBlocks = subjects.map((sub, index) => {
          const t = subjectTheme(sub.key, index);
          const rows = getBottomCluster(sc, sub.key)
            .filter((s) => !allThree.has(s.studentId))
            .map(scoreStudent)
            .map((s, i) => mini("p-2 mb-2 d-flex flex-row align-items-center gap-2", `<span class="mono soft">${i + 1}</span>${avatar(s.name, 28)}<div class="flex-grow-1 text-truncate"><b>${esc(s.name)}</b><div class="small soft mono">${esc(displayStudentId(s))}</div></div><b style="color:${t.accent}">${scoreForSubject(s, sub, index)}</b>`))
            .join("") || `<div class="small soft">All weak ${esc(sub.label || sub.key)} students are in the all-subjects group.</div>`;
          return `<div class="col-lg-4">${card("p-3 h-100", `<h6 class="display fw-bold">${esc(sub.label || sub.key)} Cluster</h6>${rows}`)}</div>`;
        }).join("");
        const noticeBlock = card("p-4 my-4", `<div class="d-flex justify-content-between"><h5 class="display fw-bold">Faculty Notice</h5><button class="btn btn-outline-light btn-sm" onclick="navigator.clipboard?.writeText(document.getElementById('notice').innerText)">Copy</button></div><pre id="notice" class="message-box bg-black bg-opacity-25 border border-secondary border-opacity-25 rounded-3 p-3 mono">${esc(notice)}</pre>`);
        return `${schedule}${allSubjectBlock}<div class="row g-3">${subjectBlocks}</div>${noticeBlock}`;
      }

      function buildNotice(sc) {
        const lines = [`The Rankers Academy - ${currentTest().name}`, `Cluster sessions for ${currentTest().date}`, ""];
        currentSubjectDefinitions().forEach((sub, index) => {
          const scheduleItem = CLUSTER_SCHEDULE[sub.key] || { faculty: "Faculty", time: "To be scheduled" };
          const total = sub.total || totalForSubject(sc.find((item) => item?.sectionScores?.length), sub, index) || 100;
          lines.push(`${sub.label || sub.key} (${scheduleItem.time}) - ${scheduleItem.faculty}`);
          getBottomCluster(sc, sub.key).map(scoreStudent).forEach((s, i) => lines.push(`${i + 1}. ${s.name} (${displayStudentId(s)}) - ${scoreForSubject(s, sub, index)}/${total}`));
          lines.push("");
        });
        return lines.join("\n");
      }

      function adminAttendance() {
        return card("p-4 mb-4", `<h5 class="display fw-bold">Attendance Records</h5>${currentSubjectDefinitions().map((sub, index) => {
          const t = subjectTheme(sub.key, index);
          const scheduleItem = CLUSTER_SCHEDULE[sub.key] || { time: "To be scheduled" };
          const cluster = getBottomCluster(currentScores(), sub.key), att = state.attendance[sub.key] || {};
          const present = cluster.filter((s) => ["present", "late"].includes(att[s.studentId])).length;
          const rate = cluster.length ? Math.round(present / cluster.length * 100) : 0;
          const absent = cluster.map(scoreStudent).filter((s) => att[s.studentId] === "absent");
          return mini("p-3 mb-3", `<div class="d-flex justify-content-between align-items-center"><div>${subjectIcon(sub.key)}<b class="ms-2">${esc(sub.label || sub.key)}</b><div class="small soft">${esc(scheduleItem.time)}</div></div>${badge(`${rate}%`, rate >= 80 ? "text-bg-success" : rate >= 50 ? "text-bg-warning text-dark" : "text-bg-danger")}</div><div class="mt-2">${progress(rate, t.accent)}</div>${absent.length ? `<div class="small text-danger mt-2">Absentees: ${absent.map((s) => `${esc(s.name)} (${esc(displayStudentId(s))})`).join(", ")}</div>` : ""}`);
        }).join("")}`);
      }

      function parentComms() {
        const messages = state.commsTab === "post-test" ? postTestMessages() : absenceMessages();
        const sent = messages.filter((m) => state.parentAlerts[msgId(m)]).length;
        return `${card("p-4 mb-4", `<div class="d-flex align-items-center gap-3"><div class="d-inline-flex align-items-center justify-content-center rounded-circle text-white fw-bold brand-gradient" style="width:48px;height:48px">PA</div><div><h5 class="display fw-bold mb-0">Parent Communications</h5><div class="small soft">Auto-drafted WhatsApp/SMS - review before sending</div></div></div><div class="row g-2 mt-3"><div class="col"><button class="card bg-black bg-opacity-25 border-secondary rounded-3 p-3 w-100 text-start text-white ${state.commsTab === "post-test" ? "border-light" : ""}" onclick="state.commsTab='post-test';render()"><div class="small soft text-uppercase fw-bold">Post-Test Reports</div><b>${postTestMessages().length} drafts</b></button></div><div class="col"><button class="card bg-black bg-opacity-25 border-secondary rounded-3 p-3 w-100 text-start text-white ${state.commsTab === "absences" ? "border-light" : ""}" onclick="state.commsTab='absences';render()"><div class="small soft text-uppercase fw-bold">Absence Alerts</div><b>${absenceMessages().length} drafts</b></button></div></div><div class="d-flex justify-content-between align-items-center mt-3 small soft"><span>${sent}/${messages.length} sent - ${messages.length - sent} queued</span><button class="btn btn-brand btn-sm" onclick="sendAllMessages()" ${messages.length ? "" : "disabled"}>Send all queued</button></div>`)}
        <div class="vstack gap-2">${messages.map(messageCard).join("") || card("p-4 text-center soft", "No drafts yet.")}</div>`;
      }

      function postTestMessages() {
        const ranked = getRankings(currentScores());
        const subjects = currentSubjectDefinitions();
        return currentScores().map(scoreStudent).map((stu) => {
          const me = currentScores().find((s) => s.studentId === stu.id);
          const rankEntry = ranked.find((s) => s.studentId === stu.id);
          if (!me || !rankEntry) return null;
          const rank = rankEntry.rank;
          const flagged = subjects.map((subject) => subject.key).filter((s) => getStudentClusterFlags(stu.id, currentScores())[s]);
          const tone = rank <= 10 ? "Celebrate" : rank <= 25 ? "Positive" : flagged.length === subjects.length ? "Concerned" : "Support";
          const subjectLine = subjects.map((subject, index) => {
            const meta = analysisSectionMeta(me, subject);
            return `${subject.label || subject.key}: ${meta.score}${meta.total ? `/${meta.total}` : ""}`;
          }).join(" - ");
          let body = `Dear Parent,\n\n${stu.name} appeared in ${currentTest().name} (${currentTest().date}) at The Rankers Academy.\n\nTotal: ${rowTotalScore(me)}/${rowTotalMarks(me)} - Rank: ${formatRankValue(rank)} of ${currentScores().length}\n${subjectLine}\n\n`;
          body += tone === "Celebrate" ? `Outstanding performance. ${stu.name.split(" ")[0]} cracked the top 10. Congratulations!` : tone === "Positive" ? `Solid showing this round. Encourage ${stu.name.split(" ")[0]} to keep the momentum.` : flagged.length ? `${stu.name.split(" ")[0]} will join faculty-led revision for ${flagged.join(", ")} after class. Please ensure attendance.` : "Steady performance. Keep up the consistency.";
          body += "\n\n- The Rankers Academy";
          return { studentId: stu.id, student: stu, tone, body, type: "post-test" };
        }).filter(Boolean);
      }

      function absenceMessages() {
        const messages = [];
        currentSubjectKeys().forEach((sub) => Object.entries(state.attendance[sub] || {}).forEach(([sid, status]) => {
          if (status !== "absent") return;
          const stu = getStudentById(sid) || { id: sid, name: sid, parentPhone: "" };
          const scheduleItem = CLUSTER_SCHEDULE[sub] || { faculty: "Faculty", time: "To be scheduled" };
          messages.push({ studentId: sid, student: stu, subject: sub, type: "absence", tone: "Absence", body: `Dear Parent,\n\n${stu.name} was marked ABSENT for the ${sub} revision session today (${scheduleItem.time}).\n\nThis was a faculty-led targeted coaching session for students who scored below the threshold. Missing it directly impacts ${stu.name.split(" ")[0]}'s performance.\n\nPlease discuss this at home.\n\n- ${scheduleItem.faculty}\n  The Rankers Academy` });
        }));
        return messages;
      }

      function msgId(m) { return `${m.studentId}-${m.type}-${m.subject || ""}-${state.testId}`; }

      function messageCard(m) {
        const sent = state.parentAlerts[msgId(m)];
        return card("p-3", `<div class="d-flex align-items-center gap-3">${avatar(m.student.name, 36)}<div class="flex-grow-1"><b>${esc(m.student.name)}</b> ${badge(m.tone, m.type === "absence" || m.tone === "Concerned" ? "text-bg-danger" : "text-bg-success")} ${m.subject ? badge(m.subject) : ""}<div class="small soft mono">${m.student.parentPhone}</div></div><button class="btn btn-sm btn-outline-light" onclick="toggleMessage('${msgId(m)}')">View</button>${sent ? badge("Sent", "text-bg-success") : `<button class="btn btn-sm btn-brand" onclick='sendMessage(${JSON.stringify(msgId(m))})'>Send</button>`}</div><div id="body-${msgId(m)}" class="mt-3 d-none"><pre class="message-box bg-black bg-opacity-25 border border-secondary border-opacity-25 rounded-3 p-3">${esc(m.body)}</pre>${sent ? `<div class="small soft mono">Sent at ${new Date(sent.sentAt).toLocaleString("en-IN")}</div>` : ""}</div>`);
      }

      function toggleMessage(id) { document.getElementById(`body-${id}`)?.classList.toggle("d-none"); }

      function sendMessage(id) {
        const msg = [...postTestMessages(), ...absenceMessages()].find((m) => msgId(m) === id);
        state.parentAlerts[id] = { ...msg, sentAt: new Date().toISOString(), testId: state.testId };
        setStore(StorageKeys.parentAlerts, state.parentAlerts); render();
      }

      function sendAllMessages() {
        const messages = state.commsTab === "post-test" ? postTestMessages() : absenceMessages();
        messages.forEach((m) => {
          const id = msgId(m);
          if (!state.parentAlerts[id]) state.parentAlerts[id] = { ...m, sentAt: new Date().toISOString(), testId: state.testId };
        });
        setStore(StorageKeys.parentAlerts, state.parentAlerts); render();
      }
    </script>
  </body>
</html>
