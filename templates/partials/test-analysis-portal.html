<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ analysis_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap");

      :root {
        --brand-a: #ff8a00;
        --brand-b: #e52e71;
        --brand-c: #7c3aed;
        --muted: #a1a1aa;
      }

      body {
        min-height: 100vh;
        color: #fafafa;
        background:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(124, 58, 237, .2), transparent 60%),
          radial-gradient(ellipse 60% 50% at 100% 100%, rgba(229, 46, 113, .13), transparent 60%),
          radial-gradient(ellipse 60% 50% at 0% 100%, rgba(255, 138, 0, .1), transparent 60%),
          #06060a;
        font-family: "DM Sans", system-ui, sans-serif;
      }

      .display { font-family: "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: 0; }
      .mono { font-family: "DM Mono", monospace; }
      .soft { color: var(--muted); }
      .brand-gradient { background: linear-gradient(135deg, var(--brand-a), var(--brand-b) 52%, var(--brand-c)); }
      .brand-text {
        background: linear-gradient(135deg, #ffb55a, #f72585 50%, #a78bfa);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .glass {
        background: rgba(7, 7, 12, .78);
        backdrop-filter: blur(18px) saturate(160%);
      }
      .btn-brand {
        --bs-btn-color: #fff;
        --bs-btn-border-color: transparent;
        --bs-btn-hover-color: #fff;
        --bs-btn-hover-border-color: transparent;
        background: linear-gradient(135deg, var(--brand-a), var(--brand-b) 52%, var(--brand-c));
      }
      .app-shell { min-height: 100vh; }
      .sticky-head { position: sticky; top: 0; z-index: 5; }
      .hover-card {
        transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
      }
      .hover-card:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, .32) !important;
        box-shadow: 0 1rem 2rem rgba(0, 0, 0, .32) !important;
      }
      .subject-card:hover .progress-bar {
        filter: brightness(1.18);
      }
      .student-highlight {
        --bs-table-bg: rgba(13, 202, 240, .22);
        --bs-table-striped-bg: rgba(13, 202, 240, .28);
        outline: 2px solid rgba(13, 202, 240, .7);
        outline-offset: -2px;
      }
      .rank-medal {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.9rem;
        height: 1.9rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, .08);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16);
        font-size: 1.25rem;
        line-height: 1;
      }
      .leaderboard-rank {
        width: 1%;
        white-space: nowrap;
        padding-right: .25rem !important;
      }
      .leaderboard-rank .rank-medal {
        width: 1.4rem;
        height: 1.4rem;
        margin-left: .2rem;
        background: transparent;
        box-shadow: none;
        font-size: 1rem;
      }
      .leaderboard-student {
        padding-left: .15rem !important;
      }
      .reward-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        width: 48px;
        height: 48px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--brand-a), var(--brand-b) 52%, var(--brand-c));
        box-shadow: 0 .5rem 1.4rem rgba(229, 46, 113, .22);
        color: #fff;
        font-size: 1.45rem;
        line-height: 1;
      }
      .rise { animation: rise .35s cubic-bezier(.2,.8,.3,1) both; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .qr-box {
        width: 144px;
        height: 144px;
        background:
          linear-gradient(90deg, #fff 10px, transparent 10px) 0 0 / 18px 18px,
          linear-gradient(#fff 10px, transparent 10px) 0 0 / 18px 18px,
          #111;
        border: 10px solid #fff;
        border-radius: .5rem;
      }
      pre.message-box {
        white-space: pre-wrap;
        font-size: .78rem;
      }
    </style>
  </head>
  <body data-page="{{ analysis_page }}">
    <main id="app"></main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const SUBJECTS = ["Physics", "Chemistry", "Maths"];
      const CLUSTER_SIZE = 12;
      const SUBJECT_THEMES = {
        Physics: { from: "#0ea5e9", to: "#06b6d4", accent: "#22d3ee", icon: "P", short: "PHY" },
        Chemistry: { from: "#d946ef", to: "#ec4899", accent: "#f472b6", icon: "C", short: "CHM" },
        Maths: { from: "#f59e0b", to: "#f97316", accent: "#fb923c", icon: "M", short: "MTH" }
      };
      const TOPICS = {
        Physics: ["Mechanics", "Thermodynamics", "Waves & Sound", "Optics", "Electrostatics", "Current Electricity", "Magnetism", "Modern Physics"],
        Chemistry: ["Atomic Structure", "Chemical Bonding", "Thermochemistry", "Equilibrium", "Organic Reactions", "Coordination Compounds", "Electrochemistry", "Periodic Table"],
        Maths: ["Algebra", "Quadratic Equations", "Trigonometry", "Coordinate Geometry", "Differential Calculus", "Integral Calculus", "Vectors & 3D", "Probability"]
      };
      const STUDENT_NAMES = [
        "Aarav Sharma","Vivaan Gupta","Aditya Patel","Vihaan Iyer","Arjun Reddy","Sai Kumar","Reyansh Joshi","Krishna Mehta","Ishaan Singh","Shaurya Malhotra",
        "Ananya Verma","Diya Kapoor","Aanya Rao","Saanvi Bhat","Aaradhya Nair","Kavya Pillai","Pari Desai","Riya Khanna","Anika Bose","Navya Menon",
        "Atharv Trivedi","Aarush Saxena","Dev Bhatia","Kabir Chopra","Yash Agarwal","Rudra Dube","Veer Naidu","Ayan Mishra","Aryan Tiwari","Aanav Goel",
        "Myra Bansal","Aadhya Goyal","Sara Sinha","Ira Choudhury","Tara Pandey","Kiara Sehgal","Pihu Kashyap","Avni Mahajan","Anaya Shukla","Ishita Yadav",
        "Daksh Dewan","Parth Bedi","Aaryan Bali","Rohit Anand","Karan Bajaj","Riya Sood","Tanvi Bhalla","Suhani Walia","Mahi Sethi","Naina Gera"
      ];
      const STUDENTS = STUDENT_NAMES.map((name, i) => ({
        id: `TRA${String(i + 1).padStart(3, "0")}`,
        name,
        password: `demo${String(i + 1).padStart(3, "0")}`,
        batch: i < 25 ? "Alpha" : "Star-01",
        parentPhone: `+91 9${String(800000000 + i * 13579).slice(0, 9)}`
      }));
      const TESTS = [
        { id: "T01", name: "Mock Test 01", date: "15 Apr 2026", shortDate: "Apr 15" },
        { id: "T02", name: "Mock Test 02", date: "22 Apr 2026", shortDate: "Apr 22" },
        { id: "T03", name: "Mock Test 03", date: "29 Apr 2026", shortDate: "Apr 29" }
      ];
      const CLUSTER_SCHEDULE = {
        Physics: { time: "4:00 - 4:30 PM", faculty: "Mr. Rajesh Kumar", room: "Conference Room A" },
        Chemistry: { time: "4:30 - 5:00 PM", faculty: "Dr. Priya Verma", room: "Conference Room A" },
        Maths: { time: "5:00 - 5:30 PM", faculty: "Mr. Amit Sharma", room: "Conference Room A" }
      };
      const ADMIN_CREDS = { user: "admin", pwd: "admin@2026" };
      const FACULTY_CREDS = {
        physics: { user: "physics", pwd: "coach@2026", name: "Mr. Rajesh Kumar", subject: "Physics" },
        chemistry: { user: "chemistry", pwd: "coach@2026", name: "Dr. Priya Verma", subject: "Chemistry" },
        maths: { user: "maths", pwd: "coach@2026", name: "Mr. Amit Sharma", subject: "Maths" }
      };
      const BADGES = [
        ["first_test", "&#127919;", "Mock Test Starter", "Completed the first academy test", "bronze"],
        ["top_25", "&#128200;", "Rank Booster", "Entered the top 25 merit band", "silver"],
        ["top_10", "&#9889;", "JEE Main Sprinter", "Cracked the top 10 in class", "gold"],
        ["top_3", "&#127942;", "NEET Podium Performer", "Reached the top 3 merit list", "gold"],
        ["rank_1", "&#128081;", "AIR Mindset Champion", "Held rank #1 on a test", "platinum"],
        ["climb_5", "&#128640;", "Comeback Climber", "Climbed 5+ ranks in one test", "silver"],
        ["streak_3", "&#128293;", "Consistency Streak", "Improved across 3 tests in a row", "gold"],
        ["subject_90", "&#127891;", "Subject Mastery Badge", "Scored 90+ in any subject", "gold"],
        ["attend_perfect", "&#9989;", "Revision Warrior", "Attended every assigned booster session", "silver"],
        ["no_cluster", "&#128142;", "Concept Clear Badge", "Stayed out of coaching clusters this test", "bronze"]
      ].map(([id, icon, name, desc, tier]) => ({ id, icon, name, desc, tier }));
      const StorageKeys = {
        attendance: (testId) => `tra4_att:${testId}`,
        facultyNotes: "tra4_fac_notes",
        parentAlerts: "tra4_parent_alerts",
        session: "tra4_session"
      };
      const ROUTES = {
        login: "{% url 'login' %}",
        student: "{% url 'login' %}",
        faculty: "{% url 'test-analysis-faculty-page' %}",
        admin: "{% url 'test-analysis-admin-page' %}"
      };
      const SERVER_SESSION = JSON.parse('{{ test_analysis_session|escapejs }}');

      const state = {
        page: document.body.dataset.page || "login",
        user: SERVER_SESSION || getStore(StorageKeys.session, null),
        loginMode: "student",
        testId: TESTS.at(-1).id,
        studentTab: "home",
        studentLeaderboardOpen: false,
        facultyTab: "attend",
        adminTab: "overview",
        adminSort: "total",
        adminSearch: "",
        commsTab: "post-test",
        online: navigator.onLine,
        attendance: blankAttendance(),
        facultyNotes: getStore(StorageKeys.facultyNotes, {}),
        parentAlerts: getStore(StorageKeys.parentAlerts, {}),
        modal: ""
      };
      window.state = state;

      if (SERVER_SESSION) {
        setStore(StorageKeys.session, SERVER_SESSION);
      }

      const allScores = Object.fromEntries(TESTS.map((t) => [t.id, generateScores(t.id)]));
      const app = document.getElementById("app");

      window.addEventListener("online", () => { state.online = true; render(); });
      window.addEventListener("offline", () => { state.online = false; render(); });
      document.addEventListener("keydown", (e) => {
        if (!state.user || state.user.type !== "student" || ["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
        if (["1", "2", "3"].includes(e.key)) {
          state.studentTab = ["home", "analytics", "rewards"][Number(e.key) - 1];
          render();
        }
      });

      loadAttendance();
      if (!guardRoute()) render();

      function guardRoute() {
        if (!state.user) {
          if (state.page !== "login") {
            window.location.href = ROUTES.login;
            return true;
          }
          return false;
        }

        if (state.page === "login") {
          window.location.href = routeForUser(state.user);
          return true;
        }

        const expected = state.page === "teacher" ? "faculty" : state.page;
        if (state.user.type !== expected) {
          window.location.href = routeForUser(state.user);
          return true;
        }
        return false;
      }

      function routeForUser(user) {
        return ROUTES[user.type] || ROUTES.login;
      }

      function saveSession() {
        setStore(StorageKeys.session, state.user);
      }

      function clearSession() {
        localStorage.removeItem(StorageKeys.session);
      }

      function hashCode(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
        return Math.abs(h);
      }

      function generateScores(testId) {
        const testHash = hashCode(testId);
        return STUDENTS.map((s) => {
          const sh = hashCode(s.id);
          const Physics = Math.max(18, Math.min(99, (sh % 65) + 25 + ((testHash + sh) % 22) - 11));
          const Chemistry = Math.max(18, Math.min(99, ((sh * 7) % 65) + 25 + ((testHash * 3 + sh) % 22) - 11));
          const Maths = Math.max(18, Math.min(99, ((sh * 13) % 65) + 25 + ((testHash * 5 + sh) % 22) - 11));
          return { studentId: s.id, testId, Physics, Chemistry, Maths, total: Physics + Chemistry + Maths };
        });
      }

      function generateTopicMastery(studentId, testId, subject) {
        return TOPICS[subject].map((topic, i) => {
          const score = (hashCode(studentId) + hashCode(testId) + hashCode(subject) + hashCode(topic) + i * 7) % 100;
          return { topic, score: Math.max(15, Math.min(98, score)) };
        });
      }

      function getRankings(scores, key = "total") {
        return [...scores].sort((a, b) => b[key] - a[key]).map((s, i) => ({ ...s, rank: i + 1 }));
      }

      function getBottomCluster(scores, subject, count = CLUSTER_SIZE) {
        return [...scores].sort((a, b) => a[subject] - b[subject]).slice(0, count);
      }

      function getStudentClusterFlags(studentId, scores) {
        return Object.fromEntries(SUBJECTS.map((sub) => [sub, getBottomCluster(scores, sub).some((s) => s.studentId === studentId)]));
      }

      function calculateXP(studentId) {
        let xp = 0;
        TESTS.forEach((t, ti) => {
          const scores = allScores[t.id];
          const me = scores.find((s) => s.studentId === studentId);
          const rank = getRankings(scores).find((s) => s.studentId === studentId).rank;
          xp += Math.floor(me.total / 3);
          xp += rank === 1 ? 200 : rank <= 3 ? 120 : rank <= 10 ? 60 : rank <= 25 ? 25 : 0;
          if (ti) {
            const prev = getRankings(allScores[TESTS[ti - 1].id]).find((s) => s.studentId === studentId).rank;
            if (prev > rank) xp += (prev - rank) * 10;
          }
        });
        const level = Math.floor(Math.sqrt(xp / 30)) + 1;
        const nextLevelXP = level * level * 30;
        const prevLevelXP = (level - 1) * (level - 1) * 30;
        return { xp, level, progress: (xp - prevLevelXP) / (nextLevelXP - prevLevelXP) };
      }

      function getEarnedBadges(studentId) {
        const earned = new Set(["first_test"]);
        let bestRank = 999, ever90 = false, climbedFive = false, streak = 0;
        TESTS.forEach((t, i) => {
          const scores = allScores[t.id], me = scores.find((s) => s.studentId === studentId);
          const rank = getRankings(scores).find((s) => s.studentId === studentId).rank;
          bestRank = Math.min(bestRank, rank);
          ever90 ||= me.Physics >= 90 || me.Chemistry >= 90 || me.Maths >= 90;
          if (i) {
            const prev = getRankings(allScores[TESTS[i - 1].id]).find((s) => s.studentId === studentId).rank;
            if (prev - rank >= 5) climbedFive = true;
            streak = prev > rank ? streak + 1 : 0;
          }
        });
        if (bestRank <= 25) earned.add("top_25");
        if (bestRank <= 10) earned.add("top_10");
        if (bestRank <= 3) earned.add("top_3");
        if (bestRank === 1) earned.add("rank_1");
        if (climbedFive) earned.add("climb_5");
        if (streak >= 2) earned.add("streak_3");
        if (ever90) earned.add("subject_90");
        const flags = getStudentClusterFlags(studentId, allScores[TESTS.at(-1).id]);
        const flagged = SUBJECTS.filter((s) => flags[s]);
        if (!flagged.length) earned.add("no_cluster");
        if (flagged.length && flagged.every((s) => ["present", "late"].includes(state.attendance[s]?.[studentId]))) earned.add("attend_perfect");
        return earned;
      }

      function calculateStreaks(studentId) {
        let improveStreak = 0;
        for (let i = TESTS.length - 1; i > 0; i--) {
          const cur = getRankings(allScores[TESTS[i].id]).find((s) => s.studentId === studentId).rank;
          const prev = getRankings(allScores[TESTS[i - 1].id]).find((s) => s.studentId === studentId).rank;
          if (prev > cur) improveStreak++;
          else break;
        }
        return { improveStreak };
      }

      function getPredictiveAlerts() {
        const alerts = [];
        STUDENTS.forEach((stu) => {
          const reasons = [];
          let severity = 0;
          const ranks = TESTS.map((t) => getRankings(allScores[t.id]).find((s) => s.studentId === stu.id).rank);
          const drop = ranks.at(-1) - ranks.at(-2);
          if (drop >= 8) { reasons.push(`Dropped ${drop} ranks vs last test`); severity += 3; }
          else if (drop >= 4) { reasons.push(`Dropped ${drop} ranks vs last test`); severity += 1; }
          if (ranks.every((r) => r > 35)) { reasons.push("Bottom-15 in all tests"); severity += 2; }
          const clusterCount = TESTS.reduce((n, t) => n + Object.values(getStudentClusterFlags(stu.id, allScores[t.id])).filter(Boolean).length, 0);
          if (clusterCount >= 6) { reasons.push(`In ${clusterCount} subject clusters across ${TESTS.length} tests`); severity += 2; }
          let absent = 0, marked = 0;
          SUBJECTS.forEach((sub) => {
            const status = state.attendance[sub]?.[stu.id];
            if (status) marked++;
            if (status === "absent") absent++;
          });
          if (marked && absent / marked >= .5) { reasons.push(`${absent}/${marked} sessions absent`); severity += 2; }
          if (reasons.length) alerts.push({ ...stu, reasons, severity, ranks });
        });
        return alerts.sort((a, b) => b.severity - a.severity);
      }

      function blankAttendance() { return { Physics: {}, Chemistry: {}, Maths: {}, finalized: {} }; }
      function getStore(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } }
      function setStore(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
      function loadAttendance() { state.attendance = getStore(StorageKeys.attendance(state.testId), blankAttendance()); }
      function saveAttendance() { setStore(StorageKeys.attendance(state.testId), state.attendance); }
      function esc(v) { return String(v ?? "").replace(/[&<>\"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c])); }
      function currentScores() { return allScores[state.testId]; }
      function currentTest() { return TESTS.find((t) => t.id === state.testId); }
      function scoreStudent(score) { return { ...score, ...STUDENTS.find((s) => s.id === score.studentId) }; }

      function avatar(name, size = 38) {
        const initials = name.split(" ").map((x) => x[0]).slice(0, 2).join("");
        return `<span class="d-inline-flex align-items-center justify-content-center rounded-circle text-white fw-bold brand-gradient flex-shrink-0" style="width:${size}px;height:${size}px;font-size:${Math.max(10, size * .32)}px">${esc(initials)}</span>`;
      }

      function badge(text, tone = "text-bg-secondary", style = "") {
        const map = { present: "text-bg-success", late: "text-bg-warning text-dark", absent: "text-bg-danger", pending: "text-bg-secondary" };
        return `<span class="badge rounded-pill ${map[tone] || tone}" style="${style}">${esc(text)}</span>`;
      }

      function progress(value, color) {
        return `<div class="progress bg-black bg-opacity-25" style="height:8px"><div class="progress-bar progress-bar-striped progress-bar-animated" style="width:${Math.max(0, Math.min(100, value))}%;background:${color}"></div></div>`;
      }

      function subjectIcon(sub) {
        const t = SUBJECT_THEMES[sub];
        return `<span class="d-inline-flex align-items-center justify-content-center rounded-3 text-white fw-bold flex-shrink-0" style="width:36px;height:36px;background:linear-gradient(135deg,${t.from},${t.to})">${t.icon}</span>`;
      }

      function card(cls = "p-3", body = "") {
        return `<div class="card bg-dark bg-opacity-50 border-secondary border-opacity-25 shadow-sm rounded-3 hover-card ${cls}">${body}</div>`;
      }

      function mini(cls = "p-3", body = "") {
        return `<div class="card bg-black bg-opacity-25 border-secondary border-opacity-25 rounded-3 hover-card ${cls}">${body}</div>`;
      }

      function render() {
        app.innerHTML = !state.user ? loginView() : state.user.type === "student" ? studentView() : state.user.type === "faculty" ? facultyView() : adminView();
        if (state.modal) app.insertAdjacentHTML("beforeend", state.modal);
      }

      function onlineBadge() {
        return `<div class="position-fixed top-0 end-0 m-3 z-3">${badge(state.online ? "ONLINE" : "OFFLINE", state.online ? "text-bg-success" : "text-bg-danger")}</div>`;
      }

      function loginView(err = "") {
        const label = state.loginMode === "student" ? "Student ID" : state.loginMode === "faculty" ? "Faculty ID" : "Username";
        const placeholder = state.loginMode === "student" ? "TRA001" : state.loginMode === "faculty" ? "physics" : "admin";
        const demo = state.loginMode === "student"
          ? "TRA001 / demo001<br>TRA014 / demo014<br>TRA033 / demo033<br><span class='soft'>Any TRA001-TRA050 with demo&lt;num&gt;</span>"
          : state.loginMode === "faculty"
            ? "physics / coach@2026<br>chemistry / coach@2026<br>maths / coach@2026"
            : "admin / admin@2026";
        return `<div class="app-shell d-flex align-items-center justify-content-center px-3 py-5">
          <section class="w-100 rise" style="max-width:420px">
            <div class="text-center mb-4">
              <div class="brand-gradient d-inline-flex align-items-center justify-content-center rounded-4 mb-3" style="width:58px;height:58px"><b class="display fs-3">TR</b></div>
              <div class="text-uppercase soft small fw-bold mono" style="letter-spacing:.22em">The Rankers Academy</div>
              <h1 class="display fw-bold mt-2 mb-0">Climb Smarter.</h1><h1 class="display fw-bold brand-text">Rank Higher.</h1>
            </div>
            ${card("p-4", `
              <ul class="nav nav-pills nav-fill bg-black bg-opacity-25 rounded-pill p-1 mb-4">
                ${["student","faculty","admin"].map((m) => `<li class="nav-item"><button class="nav-link ${state.loginMode === m ? "active" : ""}" onclick="setLoginMode('${m}')">${m[0].toUpperCase() + m.slice(1)}</button></li>`).join("")}
              </ul>
              <div class="mb-3"><label class="form-label text-uppercase soft small fw-bold mono">${label}</label><input id="login-user" class="form-control" placeholder="${placeholder}"></div>
              <div class="mb-3"><label class="form-label text-uppercase soft small fw-bold mono">Password</label><input id="login-pwd" type="password" class="form-control" placeholder="password" onkeydown="if(event.key==='Enter') login()"></div>
              ${err ? `<div class="alert alert-danger py-2 small">${esc(err)}</div>` : ""}
              <button class="btn btn-brand w-100 fw-bold py-2" onclick="login()">Sign in</button>
              <div class="border-top border-secondary border-opacity-25 mt-4 pt-3 small soft"><div class="text-uppercase fw-bold mono mb-1">Demo Credentials</div><div class="mono">${demo}</div></div>
            `)}
          </section>
        </div>`;
      }

      function setLoginMode(mode) { state.loginMode = mode; render(); }

      function login() {
        const user = document.getElementById("login-user").value.trim();
        const pwd = document.getElementById("login-pwd").value;
        let err = "";
        if (state.loginMode === "student") {
          const s = STUDENTS.find((x) => x.id.toLowerCase() === user.toLowerCase());
          if (!s) err = "Student ID not found";
          else if (s.password !== pwd) err = "Incorrect password";
          else state.user = { type: "student", studentId: s.id };
        } else if (state.loginMode === "admin") {
          if (user === ADMIN_CREDS.user && pwd === ADMIN_CREDS.pwd) state.user = { type: "admin" };
          else err = "Wrong admin credentials";
        } else {
          const f = Object.values(FACULTY_CREDS).find((x) => x.user.toLowerCase() === user.toLowerCase());
          if (!f) err = "Faculty ID not found";
          else if (f.pwd !== pwd) err = "Incorrect password";
          else state.user = { type: "faculty", faculty: f };
        }
        if (err) {
          app.innerHTML = loginView(err);
          return;
        }
        saveSession();
        window.location.href = routeForUser(state.user);
      }

      function logout() {
        state.user = null;
        state.modal = "";
        state.studentLeaderboardOpen = false;
        clearSession();
        if (state.page === "login") render();
        else window.location.href = ROUTES.login;
      }

      function setTest(id) { state.testId = id; state.studentLeaderboardOpen = false; loadAttendance(); render(); }

      function shell(title, subtitle, icon, max = "760px") {
        return `<div class="app-shell pb-5">${onlineBadge()}<div class="container-fluid px-3 px-lg-4">
          <header class="sticky-head glass border-bottom border-secondary border-opacity-25 py-3 mb-3 d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">${icon}<div><div class="soft text-uppercase small fw-bold mono">${subtitle}</div><div class="fw-bold">${title}</div></div></div>
            <button class="btn btn-sm btn-outline-light fw-bold" onclick="logout()">Sign out</button>
          </header>`;
      }

      function testSelector() {
        return `<div class="d-flex gap-2 overflow-auto pb-1 mb-3">${TESTS.map((t) => `<button class="btn btn-sm ${state.testId === t.id ? "btn-brand" : "btn-outline-light"} rounded-pill mono flex-shrink-0" onclick="setTest('${t.id}')">${t.name} - ${t.date}</button>`).join("")}</div>`;
      }

      function nav(items, active, setter) {
        return `<ul class="nav nav-pills bg-black bg-opacity-25 rounded-pill p-1 mb-3">${items.map(([id, label]) => `<li class="nav-item flex-fill"><button class="nav-link w-100 ${active === id ? "active" : ""}" onclick="${setter}='${id}';render()">${label}</button></li>`).join("")}</ul>`;
      }

      function studentView() {
        const student = STUDENTS.find((s) => s.id === state.user.studentId);
        const score = currentScores().find((s) => s.studentId === student.id);
        const ranked = getRankings(currentScores());
        const rank = ranked.find((s) => s.studentId === student.id).rank;
        const xp = calculateXP(student.id);
        return `${shell(student.name.split(" ")[0], "Welcome back", avatar(student.name))}
          <div class="mb-2">${badge(`LVL ${xp.level}`, "text-bg-info")}</div>
          ${nav([["home","Home"],["analytics","Analytics"],["rewards","Rewards"]], state.studentTab, "state.studentTab")}
          ${testSelector()}
          ${state.studentTab === "home" ? studentHome(student, score, rank, ranked) : state.studentTab === "analytics" ? studentAnalytics(student, score) : studentRewards(student, xp)}
        </div></div>`;
      }

      function kpi(label, value, extra = "") {
        return `<div class="col-6 col-lg-3">${mini("p-3 h-100", `<div class="soft small text-uppercase fw-bold mono">${esc(label)}</div><div class="display fs-4 fw-bold">${esc(value)}</div><div class="small soft">${esc(extra)}</div>`)}</div>`;
      }

      function studentHome(student, score, rank, ranked) {
        const flags = getStudentClusterFlags(student.id, currentScores());
        const flagged = SUBJECTS.filter((s) => flags[s]);
        const testIndex = TESTS.findIndex((t) => t.id === state.testId);
        const prevRank = testIndex ? getRankings(allScores[TESTS[testIndex - 1].id]).find((s) => s.studentId === student.id).rank : null;
        const delta = prevRank ? prevRank - rank : null;
        return `${card("p-4 mb-4 rise position-relative overflow-hidden", `
          <div class="position-absolute top-0 end-0 brand-gradient opacity-25 rounded-circle" style="width:180px;height:180px;filter:blur(45px)"></div>
          <div class="position-relative">${badge(rank <= 10 ? "ELITE" : rank <= 25 ? "RISING STAR" : "BOOST SQUAD")}
          <h2 class="display fw-bold mt-2 mb-0" style="font-size:4rem">#${rank}</h2>
          <div class="soft">of ${STUDENTS.length} students - ${currentTest().name}</div>
          <div class="row g-2 mt-3">${kpi("Total", `${score.total}/300`, delta === null ? "First test" : delta > 0 ? `Up ${delta} ranks` : delta < 0 ? `Down ${Math.abs(delta)} ranks` : "No rank change")}${kpi("Cluster", flagged.length ? flagged.join(", ") : "None", flagged.length === 3 ? "All-subjects session" : "Targeted revision")}</div></div>
        `)}
        ${flagged.length ? coaching(student.id, flagged) : ""}
        <h5 class="display fw-bold">Subject Performance</h5>
        <div class="row g-3 mb-4">${SUBJECTS.map((sub) => subjectCard(sub, score, flags[sub])).join("")}</div>
        <h5 class="display fw-bold">Top Performers</h5>
        <div class="d-flex gap-2 overflow-auto pb-1 mb-4">${ranked.slice(0, 5).map((r) => {
          const stu = STUDENTS.find((s) => s.id === r.studentId);
          return mini("p-3 text-center flex-shrink-0 position-relative", `${rankMedal(r.rank)}${avatar(stu.name, 42)}<div class="fw-bold mt-2 text-truncate" style="width:120px">${esc(stu.name)}</div><div class="mono soft">#${r.rank} - ${r.total}</div>`);
        }).join("")}</div>
        ${leaderboard(ranked, student.id, true)}`;
      }

      function coaching(studentId, flagged) {
        const all = flagged.length === 3;
        return card("p-3 mb-4", `
          <div class="d-flex justify-content-between align-items-start"><div><h5 class="display fw-bold mb-1">${all ? "All-Subjects Coaching Cluster" : "Coaching Cluster"}</h5><div class="small soft">${all ? "4:00 - 5:30 PM - 90 minutes" : flagged.map((s) => `${s}: ${CLUSTER_SCHEDULE[s].time}`).join(" | ")}</div></div>${badge(all ? "90 MIN" : "30 MIN", "text-bg-primary")}</div>
          <div class="row g-2 mt-2">${flagged.map((sub) => `<div class="col-md-4">${mini("p-2 d-flex align-items-center gap-2", `${subjectIcon(sub)}<div class="flex-grow-1"><b>${sub}</b><div class="small soft">${CLUSTER_SCHEDULE[sub].faculty}</div></div>${badge(state.attendance[sub]?.[studentId] || "pending", state.attendance[sub]?.[studentId] || "pending")}`)}</div>`).join("")}</div>
        `);
      }

      function subjectCard(sub, score, flagged) {
        const t = SUBJECT_THEMES[sub];
        const avg = Math.round(currentScores().reduce((n, s) => n + s[sub], 0) / STUDENTS.length);
        const rank = getRankings(currentScores(), sub).find((s) => s.studentId === score.studentId).rank;
        const delta = score[sub] - avg;
        const boostBadge = sub === "Maths" && flagged ? ` ${badge("Boost", "text-bg-warning text-dark")}` : "";
        return `<div class="col-md-4">${card("p-3 h-100 subject-card", `<div class="d-flex align-items-center gap-2 mb-2">${subjectIcon(sub)}<div><b>${sub}</b>${boostBadge}<div class="small soft">Subject rank #${rank}</div></div></div><div class="display fs-2 fw-bold" style="color:${t.accent}">${score[sub]}</div>${progress(score[sub], t.accent)}<div class="d-flex justify-content-between align-items-center mt-2"><span class="small soft">Class avg ${avg}/100</span>${badge(delta >= 0 ? `+${delta} vs avg` : `${delta} vs avg`, delta >= 0 ? "text-bg-success" : "text-bg-danger")}</div>` )}</div>`;
      }

      function rankMedal(rank) {
        const medals = {
          1: { icon: "🥇", label: "Gold medal" },
          2: { icon: "🥈", label: "Silver medal" },
          3: { icon: "🥉", label: "Bronze medal" }
        };
        const medal = medals[rank];
        if (medal) return `<span class="rank-medal" role="img" aria-label="${medal.label}" title="${medal.label}">${medal.icon}</span>`;
        return "";
      }

      function leaderboardRows(ranked, highlightId, collapsed) {
        if (!collapsed) return ranked;
        const firstFive = ranked.slice(0, 5);
        const me = ranked.find((r) => r.studentId === highlightId);
        return me && !firstFive.some((r) => r.studentId === highlightId) ? [...firstFive, me] : firstFive;
      }

      function toggleStudentLeaderboard() {
        state.studentLeaderboardOpen = !state.studentLeaderboardOpen;
        render();
      }

      function leaderboard(ranked, highlightId = "", collapsible = false) {
        const rows = leaderboardRows(ranked, highlightId, collapsible && !state.studentLeaderboardOpen);
        const footer = collapsible ? `<div class="d-flex justify-content-between align-items-center mt-3">
          <div class="small soft">${state.studentLeaderboardOpen ? `Showing all ${ranked.length} students` : `Showing top 5${rows.length > 5 ? " + your rank" : ""}`}</div>
          <button class="btn btn-outline-light btn-sm rounded-pill" onclick="toggleStudentLeaderboard()">${state.studentLeaderboardOpen ? "Show Less" : "View All"}</button>
        </div>` : "";
        return card("p-3 mb-4", `<div class="d-flex justify-content-between align-items-center mb-2"><h5 class="display fw-bold mb-0">Leaderboard</h5>${collapsible ? badge(`${ranked.length} students`, "text-bg-info") : ""}</div><div class="table-responsive"><table class="table table-sm table-dark table-striped table-hover align-middle mb-0"><thead><tr><th>#</th><th>Student</th><th>PHY</th><th>CHM</th><th>MTH</th><th>Total</th></tr></thead><tbody>${rows.map((r) => {
          const stu = STUDENTS.find((s) => s.id === r.studentId);
          const mine = stu.id === highlightId;
          return `<tr class="${mine ? "table-active student-highlight" : ""}"><td class="mono leaderboard-rank"><span>#${r.rank}</span>${rankMedal(r.rank)}</td><td class="leaderboard-student"><div class="d-flex align-items-center gap-2">${avatar(stu.name, 28)}<div class="overflow-hidden"><span class="fw-semibold">${esc(stu.name)}</span>${mine ? ` ${badge("You", "text-bg-info")}` : ""}<div class="small soft mono">${stu.id}</div></div></div></td><td>${r.Physics}</td><td>${r.Chemistry}</td><td>${r.Maths}</td><td><b>${r.total}</b></td></tr>`;
        }).join("")}</tbody></table></div>${footer}`);
      }

      function studentAnalytics(student, score) {
        const ranks = TESTS.map((t) => getRankings(allScores[t.id]).find((s) => s.studentId === student.id).rank);
        return `${card("p-4 mb-4", `<h5 class="display fw-bold">Rank Journey</h5><div class="row g-2">${TESTS.map((t, i) => kpi(t.shortDate, `#${ranks[i]}`, i ? `${ranks[i - 1] - ranks[i] >= 0 ? "Up" : "Down"} ${Math.abs(ranks[i - 1] - ranks[i])}` : "Baseline")).join("")}</div>`)}
        <h5 class="display fw-bold">Topic Analytics</h5>
        <div class="vstack gap-3 mb-4">${SUBJECTS.map((sub) => {
          const t = SUBJECT_THEMES[sub];
          return card("p-3", `<div class="d-flex align-items-center justify-content-between mb-2"><div class="d-flex align-items-center gap-2">${subjectIcon(sub)}<div><b style="color:${t.accent}">${sub}</b><div class="small soft">Topic-wise mastery</div></div></div><span class="mono">${score[sub]}/100</span></div>${generateTopicMastery(student.id, state.testId, sub).map((x) => `<div class="mt-2"><div class="d-flex justify-content-between small"><span>${esc(x.topic)}</span><span class="soft">${x.score}%</span></div>${progress(x.score, t.accent)}</div>`).join("")}`);
        }).join("")}</div>`;
      }

      function studentRewards(student, xp) {
        const earned = getEarnedBadges(student.id);
        const streak = calculateStreaks(student.id).improveStreak;
        return `${card("p-4 mb-4", `<div class="d-flex justify-content-between"><div><h5 class="display fw-bold">Level ${xp.level}</h5><div class="soft small">${xp.xp} XP earned</div></div>${badge(`${streak} TEST STREAK`, "text-bg-warning text-dark")}</div><div class="mt-3">${progress(Math.round(xp.progress * 100), "linear-gradient(135deg,#ff8a00,#e52e71,#7c3aed)")}</div>`)}
        <div class="row g-3">${BADGES.map((b) => `<div class="col-md-6">${card(`p-3 h-100 ${earned.has(b.id) ? "" : "opacity-50"}`, `<div class="d-flex gap-3"><div class="reward-icon">${b.icon}</div><div><b>${b.name}</b><div class="small soft">${b.desc}</div><div class="small mono soft text-uppercase">${earned.has(b.id) ? "earned" : "locked"} - ${b.tier}</div></div></div>`)}</div>`).join("")}</div>`;
      }

      function facultyView() {
        const faculty = state.user.faculty, subject = faculty.subject;
        return `${shell(faculty.name, "Faculty", subjectIcon(subject))}
          ${nav([["attend","Attendance"],["topics","Topic Focus"],["notes","Notes"]], state.facultyTab, "state.facultyTab")}
          ${testSelector()}
          ${state.facultyTab === "attend" ? facultyAttendance(subject) : state.facultyTab === "topics" ? facultyTopics(subject) : facultyNotes(subject)}
        </div></div>`;
      }

      function facultyAttendance(subject) {
        const cluster = getBottomCluster(currentScores(), subject).map(scoreStudent);
        const att = state.attendance[subject] || {};
        const counts = ["present", "late", "absent"].map((x) => Object.values(att).filter((s) => s === x).length);
        const marked = counts.reduce((a, b) => a + b, 0);
        const finalized = !!state.attendance.finalized?.[subject];
        const allThree = getAllThreeSet(currentScores());
        return `${card("p-4 mb-4", `${badge("Tonight's Session", "text-bg-primary")}<h2 class="display fw-bold mt-2">${subject} Revision</h2><div class="soft small mono">${CLUSTER_SCHEDULE[subject].time} - ${CLUSTER_SCHEDULE[subject].room} - ${cluster.length} students</div><div class="row g-2 mt-3">${kpi("Present", counts[0], "marked")}${kpi("Late", counts[1], "marked")}${kpi("Absent", counts[2], "marked")}</div><div class="mt-3">${progress(Math.round(marked / cluster.length * 100), SUBJECT_THEMES[subject].accent)}</div><div class="d-flex gap-2 flex-wrap mt-3"><button class="btn btn-outline-light" ${finalized ? "disabled" : ""} onclick="openQR('${subject}')">Scan QR</button>${finalized ? `${badge("Finalized", "text-bg-success")}<button class="btn btn-outline-light btn-sm" onclick="resetAttendance('${subject}')">Re-open</button>` : `<button class="btn btn-brand flex-grow-1" onclick="finalizeAttendance('${subject}')">Finalize and auto-mark rest absent</button>`}</div>`)}
        <h5 class="display fw-bold">Mark Attendance</h5><div class="vstack gap-2 mb-4">${cluster.map((s, i) => attendanceRow(s, i, att[s.studentId] || "pending", allThree.has(s.studentId), finalized, subject)).join("")}</div>`;
      }

      function attendanceRow(s, i, status, allThree, disabled, subject) {
        const btnClass = (x) => status !== x ? "btn-outline-light" : x === "present" ? "btn-success" : x === "late" ? "btn-warning" : "btn-danger";
        return card("p-2 d-flex flex-row align-items-center gap-2", `<span class="mono soft text-center" style="width:26px">${i + 1}</span>${avatar(s.name, 34)}<div class="flex-grow-1 overflow-hidden"><b class="text-truncate d-block">${esc(s.name)}</b><div class="small soft mono">${s.id} ${allThree ? "- all subjects" : ""}</div></div>${["present","late","absent"].map((x) => `<button class="btn btn-sm ${btnClass(x)}" ${disabled ? "disabled" : ""} onclick="setAttendanceStatus('${subject}','${s.studentId}','${x}')">${x}</button>`).join("")}`);
      }

      function getAllThreeSet(scores) {
        const clusters = Object.fromEntries(SUBJECTS.map((sub) => [sub, getBottomCluster(scores, sub).map((s) => s.studentId)]));
        return new Set(STUDENTS.filter((s) => SUBJECTS.every((sub) => clusters[sub].includes(s.id))).map((s) => s.id));
      }

      function setAttendanceStatus(subject, studentId, status) {
        if (state.attendance.finalized?.[subject]) return;
        state.attendance[subject] = { ...(state.attendance[subject] || {}), [studentId]: status };
        saveAttendance(); render();
      }

      function finalizeAttendance(subject) {
        const subj = { ...(state.attendance[subject] || {}) };
        getBottomCluster(currentScores(), subject).forEach((s) => { if (!subj[s.studentId]) subj[s.studentId] = "absent"; });
        state.attendance[subject] = subj;
        state.attendance.finalized = { ...(state.attendance.finalized || {}), [subject]: true };
        saveAttendance(); render();
      }

      function resetAttendance(subject) {
        state.attendance[subject] = {};
        state.attendance.finalized = { ...(state.attendance.finalized || {}), [subject]: false };
        saveAttendance(); render();
      }

      function openQR(subject) {
        state.modal = `<div class="modal d-block" tabindex="-1" style="background:rgba(0,0,0,.72)"><div class="modal-dialog modal-dialog-centered"><div class="modal-content bg-dark text-white border-secondary"><div class="modal-header"><h5 class="modal-title">QR Attendance - ${subject}</h5><button class="btn-close btn-close-white" onclick="closeModal()"></button></div><div class="modal-body text-center"><div class="qr-box mx-auto mb-3"></div><p class="soft small">Type a student ID from this cluster and mark present.</p><div class="input-group"><input id="qr-input" class="form-control" placeholder="TRA001" onkeydown="if(event.key==='Enter') markQR('${subject}')"><button class="btn btn-brand" onclick="markQR('${subject}')">Mark</button></div></div></div></div></div>`;
        render(); setTimeout(() => document.getElementById("qr-input")?.focus(), 0);
      }

      function markQR(subject) {
        const id = document.getElementById("qr-input").value.trim().toUpperCase();
        if (getBottomCluster(currentScores(), subject).some((s) => s.studentId === id)) setAttendanceStatus(subject, id, "present");
        state.modal = ""; render();
      }

      function closeModal() { state.modal = ""; render(); }

      function facultyTopics(subject) {
        const cluster = getBottomCluster(currentScores(), subject).map(scoreStudent);
        return card("p-4 mb-4", `<h5 class="display fw-bold">${subject} Topic Focus</h5>${cluster.map((s) => mini("p-3 mb-2", `<div class="d-flex align-items-center gap-2 mb-2">${avatar(s.name, 32)}<div><b>${esc(s.name)}</b><div class="small soft mono">${s.id} - score ${s[subject]}</div></div></div>${generateTopicMastery(s.studentId, state.testId, subject).sort((a,b) => a.score - b.score).slice(0,4).map((x) => `<div class="mt-2"><div class="d-flex justify-content-between small"><span>${esc(x.topic)}</span><span>${x.score}%</span></div>${progress(x.score, SUBJECT_THEMES[subject].accent)}</div>`).join("")}`)).join("")}`);
      }

      function facultyNotes(subject) {
        const cluster = getBottomCluster(currentScores(), subject).map(scoreStudent);
        return card("p-4 mb-4", `<h5 class="display fw-bold">Faculty Notes</h5>${cluster.map((s) => {
          const key = `${s.studentId}:${subject}`, notes = state.facultyNotes[key] || [];
          return mini("p-3 mb-2", `<div class="d-flex align-items-center gap-2">${avatar(s.name, 32)}<div class="flex-grow-1"><b>${esc(s.name)}</b><div class="small soft mono">${s.id}</div></div></div><div class="input-group input-group-sm my-2"><input id="note-${key}" class="form-control" placeholder="Add a note"><button class="btn btn-brand" onclick="addNote('${key}')">Add</button></div>${notes.map((n) => `<div class="small soft border-top border-secondary border-opacity-25 py-1 d-flex justify-content-between"><span>${esc(n.text)}</span><button class="btn btn-sm btn-link text-danger p-0" onclick="deleteNote('${key}','${n.id}')">x</button></div>`).join("")}`);
        }).join("")}`);
      }

      function addNote(key) {
        const text = document.getElementById(`note-${key}`).value.trim();
        if (!text) return;
        state.facultyNotes[key] = [{ id: Date.now().toString(), text, at: new Date().toISOString() }, ...(state.facultyNotes[key] || [])];
        setStore(StorageKeys.facultyNotes, state.facultyNotes); render();
      }

      function deleteNote(key, id) {
        state.facultyNotes[key] = (state.facultyNotes[key] || []).filter((n) => n.id !== id);
        setStore(StorageKeys.facultyNotes, state.facultyNotes); render();
      }

      function adminView() {
        const tabs = [["overview","Overview"],["predict","At Risk"],["students","Students"],["clusters","Clusters"],["attend","Attendance"],["comms","Comms"]];
        return `${shell("Admin - The Rankers Academy", "Console", `<div class="d-inline-flex align-items-center justify-content-center rounded-circle text-white fw-bold brand-gradient" style="width:38px;height:38px">A</div>`, "940px")}
          ${testSelector()}<div class="d-flex gap-2 overflow-auto pb-1 mb-4">${tabs.map(([id,label]) => `<button class="btn btn-sm ${state.adminTab === id ? "btn-light" : "btn-outline-light"} rounded-pill fw-bold flex-shrink-0" onclick="state.adminTab='${id}';render()">${label}</button>`).join("")}</div>
          ${state.adminTab === "overview" ? adminOverview() : state.adminTab === "predict" ? adminPredict() : state.adminTab === "students" ? adminStudents() : state.adminTab === "clusters" ? adminClusters() : state.adminTab === "attend" ? adminAttendance() : parentComms()}
        </div></div>`;
      }

      function adminOverview() {
        const ranked = getRankings(currentScores());
        const avg = Math.round(currentScores().reduce((n, s) => n + s.total, 0) / STUDENTS.length);
        return `<div class="row g-3 mb-4">${kpi("Class Average", `${avg}/300`, currentTest().name)}${kpi("Top Score", ranked[0].total, STUDENTS.find((s) => s.id === ranked[0].studentId).name)}${kpi("All-Subject Cluster", getAllThreeSet(currentScores()).size, "students")}${kpi("At-Risk Alerts", getPredictiveAlerts().length, "predictive warnings")}</div>
        ${card("p-4 mb-4", `<h5 class="display fw-bold">Subject Averages</h5><div class="row g-3">${SUBJECTS.map((sub) => {
          const avgSub = Math.round(currentScores().reduce((n, s) => n + s[sub], 0) / STUDENTS.length);
          return `<div class="col-md-4">${mini("p-3", `${subjectIcon(sub)}<b class="ms-2">${sub}</b><div class="display fs-3 fw-bold mt-2">${avgSub}</div>${progress(avgSub, SUBJECT_THEMES[sub].accent)}`)}</div>`;
        }).join("")}</div>`)}${leaderboard(ranked.slice(0, 10))}`;
      }

      function adminPredict() {
        const alerts = getPredictiveAlerts();
        return card("p-4 mb-4", `<h5 class="display fw-bold">Predictive Alerts</h5><div class="vstack gap-2">${alerts.map((a) => {
          const notes = SUBJECTS.flatMap((sub) => state.facultyNotes[`${a.id}:${sub}`] || []);
          return mini("p-3", `<div class="d-flex align-items-start gap-3">${avatar(a.name, 38)}<div class="flex-grow-1"><div class="d-flex justify-content-between"><b>${esc(a.name)}</b>${badge(`S${a.severity}`, a.severity >= 4 ? "text-bg-danger" : "text-bg-warning text-dark")}</div><div class="small soft mono">${a.id} - ranks ${a.ranks.join(" -> ")}</div><ul class="small soft mb-1 mt-2">${a.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>${notes.length ? `<div class="small text-info">Faculty notes: ${notes.map((n) => esc(n.text)).join("; ")}</div>` : ""}</div></div>`);
        }).join("") || `<div class="soft small">No active risk alerts.</div>`}</div>`);
      }

      function adminStudents() {
        const q = state.adminSearch.toLowerCase();
        const ranked = getRankings(currentScores(), state.adminSort).map(scoreStudent).filter((s) => !q || s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q));
        return card("p-3 mb-4", `<div class="row g-2 mb-3"><div class="col-md"><input class="form-control" value="${esc(state.adminSearch)}" placeholder="Search name or ID" oninput="state.adminSearch=this.value;render()"></div><div class="col-md-auto"><select class="form-select" onchange="state.adminSort=this.value;render()">${["total","Physics","Chemistry","Maths"].map((k) => `<option ${state.adminSort === k ? "selected" : ""} value="${k}">${k}</option>`).join("")}</select></div></div>${leaderboard(ranked)}`);
      }

      function adminClusters() {
        const sc = currentScores(), allThree = getAllThreeSet(sc), notice = buildNotice(sc);
        const schedule = card("p-4 mb-4", `<h5 class="display fw-bold">Cluster Schedule</h5><div class="row g-2">${SUBJECTS.map((sub) => `<div class="col-md-4">${mini("p-3", `${subjectIcon(sub)}<b class="ms-2">${sub}</b><div class="small soft mt-2">${CLUSTER_SCHEDULE[sub].faculty}<br>${CLUSTER_SCHEDULE[sub].time}</div>`)}</div>`).join("")}</div>`);
        const allSubjectBlock = allThree.size ? card("p-4 mb-4", `<h5 class="display fw-bold">All-Subjects Cluster</h5>${[...allThree].map((id) => {
          const s = scoreStudent(sc.find((x) => x.studentId === id));
          return mini("p-2 mb-2 d-flex flex-row align-items-center gap-2", `${avatar(s.name, 30)}<div class="flex-grow-1"><b>${esc(s.name)}</b><div class="small soft mono">${s.id}</div></div><span class="mono small">P${s.Physics} C${s.Chemistry} M${s.Maths}</span>`);
        }).join("")}`) : "";
        const subjectBlocks = SUBJECTS.map((sub) => {
          const rows = getBottomCluster(sc, sub)
            .filter((s) => !allThree.has(s.studentId))
            .map(scoreStudent)
            .map((s, i) => mini("p-2 mb-2 d-flex flex-row align-items-center gap-2", `<span class="mono soft">${i + 1}</span>${avatar(s.name, 28)}<div class="flex-grow-1 text-truncate"><b>${esc(s.name)}</b><div class="small soft mono">${s.id}</div></div><b style="color:${SUBJECT_THEMES[sub].accent}">${s[sub]}</b>`))
            .join("") || `<div class="small soft">All weak ${sub} students are in the all-subjects group.</div>`;
          return `<div class="col-lg-4">${card("p-3 h-100", `<h6 class="display fw-bold">${sub} Cluster</h6>${rows}`)}</div>`;
        }).join("");
        const noticeBlock = card("p-4 my-4", `<div class="d-flex justify-content-between"><h5 class="display fw-bold">Faculty Notice</h5><button class="btn btn-outline-light btn-sm" onclick="navigator.clipboard?.writeText(document.getElementById('notice').innerText)">Copy</button></div><pre id="notice" class="message-box bg-black bg-opacity-25 border border-secondary border-opacity-25 rounded-3 p-3 mono">${esc(notice)}</pre>`);
        return `${schedule}${allSubjectBlock}<div class="row g-3">${subjectBlocks}</div>${noticeBlock}`;
      }

      function buildNotice(sc) {
        const lines = [`The Rankers Academy - ${currentTest().name}`, `Cluster sessions for ${currentTest().date}`, ""];
        SUBJECTS.forEach((sub) => {
          lines.push(`${sub} (${CLUSTER_SCHEDULE[sub].time}) - ${CLUSTER_SCHEDULE[sub].faculty}`);
          getBottomCluster(sc, sub).map(scoreStudent).forEach((s, i) => lines.push(`${i + 1}. ${s.name} (${s.id}) - ${s[sub]}/100`));
          lines.push("");
        });
        return lines.join("\n");
      }

      function adminAttendance() {
        return card("p-4 mb-4", `<h5 class="display fw-bold">Attendance Records</h5>${SUBJECTS.map((sub) => {
          const cluster = getBottomCluster(currentScores(), sub), att = state.attendance[sub] || {};
          const present = cluster.filter((s) => ["present", "late"].includes(att[s.studentId])).length;
          const rate = Math.round(present / cluster.length * 100);
          const absent = cluster.map(scoreStudent).filter((s) => att[s.studentId] === "absent");
          return mini("p-3 mb-3", `<div class="d-flex justify-content-between align-items-center"><div>${subjectIcon(sub)}<b class="ms-2">${sub}</b><div class="small soft">${CLUSTER_SCHEDULE[sub].time}</div></div>${badge(`${rate}%`, rate >= 80 ? "text-bg-success" : rate >= 50 ? "text-bg-warning text-dark" : "text-bg-danger")}</div><div class="mt-2">${progress(rate, SUBJECT_THEMES[sub].accent)}</div>${absent.length ? `<div class="small text-danger mt-2">Absentees: ${absent.map((s) => `${esc(s.name)} (${s.id})`).join(", ")}</div>` : ""}`);
        }).join("")}`);
      }

      function parentComms() {
        const messages = state.commsTab === "post-test" ? postTestMessages() : absenceMessages();
        const sent = messages.filter((m) => state.parentAlerts[msgId(m)]).length;
        return `${card("p-4 mb-4", `<div class="d-flex align-items-center gap-3"><div class="d-inline-flex align-items-center justify-content-center rounded-circle text-white fw-bold brand-gradient" style="width:48px;height:48px">PA</div><div><h5 class="display fw-bold mb-0">Parent Communications</h5><div class="small soft">Auto-drafted WhatsApp/SMS - review before sending</div></div></div><div class="row g-2 mt-3"><div class="col"><button class="card bg-black bg-opacity-25 border-secondary rounded-3 p-3 w-100 text-start text-white ${state.commsTab === "post-test" ? "border-light" : ""}" onclick="state.commsTab='post-test';render()"><div class="small soft text-uppercase fw-bold">Post-Test Reports</div><b>${postTestMessages().length} drafts</b></button></div><div class="col"><button class="card bg-black bg-opacity-25 border-secondary rounded-3 p-3 w-100 text-start text-white ${state.commsTab === "absences" ? "border-light" : ""}" onclick="state.commsTab='absences';render()"><div class="small soft text-uppercase fw-bold">Absence Alerts</div><b>${absenceMessages().length} drafts</b></button></div></div><div class="d-flex justify-content-between align-items-center mt-3 small soft"><span>${sent}/${messages.length} sent - ${messages.length - sent} queued</span><button class="btn btn-brand btn-sm" onclick="sendAllMessages()" ${messages.length ? "" : "disabled"}>Send all queued</button></div>`)}
        <div class="vstack gap-2">${messages.map(messageCard).join("") || card("p-4 text-center soft", "No drafts yet.")}</div>`;
      }

      function postTestMessages() {
        const ranked = getRankings(currentScores());
        return STUDENTS.map((stu) => {
          const me = currentScores().find((s) => s.studentId === stu.id);
          const rank = ranked.find((s) => s.studentId === stu.id).rank;
          const flagged = SUBJECTS.filter((s) => getStudentClusterFlags(stu.id, currentScores())[s]);
          const tone = rank <= 10 ? "Celebrate" : rank <= 25 ? "Positive" : flagged.length === 3 ? "Concerned" : "Support";
          let body = `Dear Parent,\n\n${stu.name} appeared in ${currentTest().name} (${currentTest().date}) at The Rankers Academy.\n\nTotal: ${me.total}/300 - Rank: #${rank} of ${STUDENTS.length}\nPhysics: ${me.Physics} - Chemistry: ${me.Chemistry} - Maths: ${me.Maths}\n\n`;
          body += tone === "Celebrate" ? `Outstanding performance. ${stu.name.split(" ")[0]} cracked the top 10. Congratulations!` : tone === "Positive" ? `Solid showing this round. Encourage ${stu.name.split(" ")[0]} to keep the momentum.` : flagged.length ? `${stu.name.split(" ")[0]} will join faculty-led revision for ${flagged.join(", ")} after class. Please ensure attendance.` : "Steady performance. Keep up the consistency.";
          body += "\n\n- The Rankers Academy";
          return { studentId: stu.id, student: stu, tone, body, type: "post-test" };
        });
      }

      function absenceMessages() {
        const messages = [];
        SUBJECTS.forEach((sub) => Object.entries(state.attendance[sub] || {}).forEach(([sid, status]) => {
          if (status !== "absent") return;
          const stu = STUDENTS.find((s) => s.id === sid);
          messages.push({ studentId: sid, student: stu, subject: sub, type: "absence", tone: "Absence", body: `Dear Parent,\n\n${stu.name} was marked ABSENT for the ${sub} revision session today (${CLUSTER_SCHEDULE[sub].time}).\n\nThis was a faculty-led targeted coaching session for students who scored below the threshold. Missing it directly impacts ${stu.name.split(" ")[0]}'s performance.\n\nPlease discuss this at home.\n\n- ${CLUSTER_SCHEDULE[sub].faculty}\n  The Rankers Academy` });
        }));
        return messages;
      }

      function msgId(m) { return `${m.studentId}-${m.type}-${m.subject || ""}-${state.testId}`; }

      function messageCard(m) {
        const sent = state.parentAlerts[msgId(m)];
        return card("p-3", `<div class="d-flex align-items-center gap-3">${avatar(m.student.name, 36)}<div class="flex-grow-1"><b>${esc(m.student.name)}</b> ${badge(m.tone, m.type === "absence" || m.tone === "Concerned" ? "text-bg-danger" : "text-bg-success")} ${m.subject ? badge(m.subject) : ""}<div class="small soft mono">${m.student.parentPhone}</div></div><button class="btn btn-sm btn-outline-light" onclick="toggleMessage('${msgId(m)}')">View</button>${sent ? badge("Sent", "text-bg-success") : `<button class="btn btn-sm btn-brand" onclick='sendMessage(${JSON.stringify(msgId(m))})'>Send</button>`}</div><div id="body-${msgId(m)}" class="mt-3 d-none"><pre class="message-box bg-black bg-opacity-25 border border-secondary border-opacity-25 rounded-3 p-3">${esc(m.body)}</pre>${sent ? `<div class="small soft mono">Sent at ${new Date(sent.sentAt).toLocaleString("en-IN")}</div>` : ""}</div>`);
      }

      function toggleMessage(id) { document.getElementById(`body-${id}`)?.classList.toggle("d-none"); }

      function sendMessage(id) {
        const msg = [...postTestMessages(), ...absenceMessages()].find((m) => msgId(m) === id);
        state.parentAlerts[id] = { ...msg, sentAt: new Date().toISOString(), testId: state.testId };
        setStore(StorageKeys.parentAlerts, state.parentAlerts); render();
      }

      function sendAllMessages() {
        const messages = state.commsTab === "post-test" ? postTestMessages() : absenceMessages();
        messages.forEach((m) => {
          const id = msgId(m);
          if (!state.parentAlerts[id]) state.parentAlerts[id] = { ...m, sentAt: new Date().toISOString(), testId: state.testId };
        });
        setStore(StorageKeys.parentAlerts, state.parentAlerts); render();
      }
    </script>
  </body>
</html>
