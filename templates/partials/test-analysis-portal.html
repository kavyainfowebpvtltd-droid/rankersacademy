{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ analysis_title }}</title>
    <script src="{% static 'js/admin-theme.js' %}"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/admin-theme-toggle.css' %}" />
    <link rel="stylesheet" href="{% static 'css/admin-light-overrides.css' %}" data-theme-light-link />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap");

      :root {
        --brand-a: #ff8a00;
        --brand-b: #e52e71;
        --brand-c: #7c3aed;
        --muted: #a1a1aa;
      }

      body {
        min-height: 100vh;
        color: #fafafa;
        background:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(124, 58, 237, .2), transparent 60%),
          radial-gradient(ellipse 60% 50% at 100% 100%, rgba(229, 46, 113, .13), transparent 60%),
          radial-gradient(ellipse 60% 50% at 0% 100%, rgba(255, 138, 0, .1), transparent 60%),
          #06060a;
        font-family: "DM Sans", system-ui, sans-serif;
      }

      .display { font-family: "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: 0; }
      .mono { font-family: "DM Mono", monospace; }
      .soft { color: var(--muted); }
      .brand-gradient { background: linear-gradient(135deg, var(--brand-a), var(--brand-b) 52%, var(--brand-c)); }
      .brand-text {
        background: linear-gradient(135deg, #ffb55a, #f72585 50%, #a78bfa);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .glass {
        background: rgba(7, 7, 12, .78);
        backdrop-filter: blur(18px) saturate(160%);
      }
      .btn-brand {
        --bs-btn-color: #fff;
        --bs-btn-border-color: transparent;
        --bs-btn-hover-color: #fff;
        --bs-btn-hover-border-color: transparent;
        background: linear-gradient(135deg, var(--brand-a), var(--brand-b) 52%, var(--brand-c));
      }
      .app-shell { min-height: 100vh; }
      .sticky-head { position: sticky; top: 0; z-index: 5; }
      .hover-card {
        transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
      }
      .hover-card:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, .32) !important;
        box-shadow: 0 1rem 2rem rgba(0, 0, 0, .32) !important;
      }
      .subject-card:hover .progress-bar {
        filter: brightness(1.18);
      }
      .student-highlight {
        --bs-table-bg: rgba(13, 202, 240, .22);
        --bs-table-striped-bg: rgba(13, 202, 240, .28);
        outline: 2px solid rgba(13, 202, 240, .7);
        outline-offset: -2px;
      }
      .rank-medal {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.9rem;
        height: 1.9rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, .08);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16);
        font-size: 1.25rem;
        line-height: 1;
      }
      .leaderboard-rank {
        width: 1%;
        white-space: nowrap;
        padding-right: .25rem !important;
      }
      .leaderboard-rank .rank-medal {
        width: 1.4rem;
        height: 1.4rem;
        margin-left: .2rem;
        background: transparent;
        box-shadow: none;
        font-size: 1rem;
      }
      .leaderboard-student {
        padding-left: .15rem !important;
      }
      .reward-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        width: 48px;
        height: 48px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--brand-a), var(--brand-b) 52%, var(--brand-c));
        box-shadow: 0 .5rem 1.4rem rgba(229, 46, 113, .22);
        color: #fff;
        font-size: 1.45rem;
        line-height: 1;
      }
      .rise { animation: rise .35s cubic-bezier(.2,.8,.3,1) both; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .qr-box {
        width: 144px;
        height: 144px;
        background:
          linear-gradient(90deg, #fff 10px, transparent 10px) 0 0 / 18px 18px,
          linear-gradient(#fff 10px, transparent 10px) 0 0 / 18px 18px,
          #111;
        border: 10px solid #fff;
        border-radius: .5rem;
      }
      pre.message-box {
        white-space: pre-wrap;
        font-size: .78rem;
      }
      .analysis-toolbar {
        border: 1px solid rgba(148, 163, 184, .24);
        border-radius: 8px;
        background: rgba(15, 23, 42, .62);
        box-shadow: 0 18px 38px rgba(2, 6, 23, .18);
      }
      .analysis-control {
        min-width: 220px;
      }
      .analysis-batch-control {
        min-width: min(100%, 520px);
      }
      .analysis-toolbar-stack {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .analysis-selector-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 1rem;
      }
      .analysis-test-control {
        min-width: 0;
        width: 100%;
      }
      .analysis-control label {
        display: block;
        margin-bottom: .4rem;
        color: var(--muted);
        font-size: .72rem;
        font-weight: 800;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .analysis-input-wrap {
        position: relative;
      }
      .analysis-input-wrap i {
        position: absolute;
        top: 50%;
        left: .85rem;
        transform: translateY(-50%);
        color: #38bdf8;
        pointer-events: none;
      }
      .analysis-picker {
        width: 100%;
        height: 42px;
        padding-left: 2.35rem;
        border: 1px solid rgba(148, 163, 184, .28);
        border-radius: 8px;
        background: rgba(2, 6, 23, .3);
        color: inherit;
        font-weight: 700;
        transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
      }
      .analysis-picker:hover {
        border-color: rgba(56, 189, 248, .68);
      }
      .analysis-picker:focus {
        outline: none;
        border-color: #38bdf8;
        box-shadow: 0 0 0 .2rem rgba(56, 189, 248, .18);
      }
      .analysis-picker option {
        color: #111827;
      }
      .analysis-test-dropdown {
        width: 100%;
      }
      .analysis-test-button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: .75rem;
        min-height: 42px;
        height: auto;
        padding: .6rem 2.45rem .6rem 2.35rem;
        text-align: left;
      }
      .analysis-test-button:disabled {
        opacity: .62;
        cursor: not-allowed;
      }
      .analysis-test-text {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .analysis-input-wrap .analysis-test-chevron {
        left: auto;
        right: .85rem;
      }
      .analysis-test-menu {
        width: 100%;
        max-height: min(360px, 52vh);
        overflow-y: auto;
        padding: .35rem;
        border: 1px solid rgba(148, 163, 184, .28);
        border-radius: 8px;
        background: var(--bs-body-bg);
        color: var(--bs-body-color);
        box-shadow: 0 1.1rem 2.4rem rgba(2, 6, 23, .22);
      }
      .analysis-test-option {
        display: block;
        width: 100%;
        padding: .65rem .75rem;
        border-radius: 6px;
        color: inherit;
        font-weight: 700;
        line-height: 1.25;
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .analysis-test-option:hover,
      .analysis-test-option:focus {
        background: rgba(56, 189, 248, .12);
        color: inherit;
      }
      .analysis-test-option.active,
      .analysis-test-option:active {
        background: linear-gradient(135deg, #0ea5e9, #2563eb);
        color: #fff;
      }
      .analysis-batch-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: .45rem;
      }
      .analysis-batch-tab {
        min-height: 42px;
        padding: 0 .9rem;
        border: 1px solid rgba(148, 163, 184, .3);
        border-radius: 8px;
        background: rgba(2, 6, 23, .3);
        color: inherit;
        font-weight: 800;
        white-space: nowrap;
        transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
      }
      .analysis-batch-tab:hover {
        transform: translateY(-1px);
        border-color: rgba(56, 189, 248, .7);
      }
      .analysis-batch-tab.active {
        border-color: transparent;
        background: linear-gradient(135deg, #0ea5e9, #2563eb);
        color: #fff;
        box-shadow: 0 .7rem 1.3rem rgba(37, 99, 235, .2);
      }
      .analysis-chip-row {
        display: flex;
        gap: .55rem;
        overflow-x: auto;
        padding: .15rem .05rem .7rem;
        scrollbar-width: thin;
      }
      .analysis-chip {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        max-width: min(480px, 86vw);
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, .3);
        background: rgba(15, 23, 42, .44);
        color: inherit;
        padding: .55rem .85rem;
        font-size: .82rem;
        font-weight: 800;
        transition: transform .18s ease, border-color .18s ease, background .18s ease;
      }
      .analysis-chip:hover {
        transform: translateY(-1px);
        border-color: #38bdf8;
      }
      .analysis-chip.active {
        border-color: transparent;
        background: linear-gradient(135deg, #0ea5e9, #2563eb);
        color: #fff;
        box-shadow: 0 .7rem 1.3rem rgba(37, 99, 235, .22);
      }
      .analysis-chip-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .analysis-chip-date {
        flex: 0 0 auto;
      }
      .analysis-download-btn {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      @media (max-width: 575.98px) {
        .analysis-selector-row {
          grid-template-columns: 1fr;
        }
        .analysis-download-btn {
          width: 100%;
        }
      }
      .analysis-section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: .75rem;
        margin-bottom: .8rem;
      }
      .analysis-section-title h5 {
        margin: 0;
      }
      .analysis-bar {
        display: flex;
        align-items: center;
        gap: .75rem;
        margin-top: .7rem;
      }
      .analysis-bar-label {
        width: 86px;
        font-size: .76rem;
        font-weight: 800;
      }
      .analysis-bar-track {
        flex: 1;
        height: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, .18);
      }
      .analysis-bar-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #14b8a6, #0ea5e9);
      }
      .analysis-empty {
        min-height: 260px;
        display: grid;
        place-items: center;
        text-align: center;
      }
      html[data-admin-theme="light"] body:not(.login-page-body) .analysis-toolbar,
      html[data-admin-theme="light"] body:not(.login-page-body) .analysis-chip {
        background: #ffffff !important;
        border-color: #e2e8f0 !important;
        color: #111827 !important;
        box-shadow: 0 12px 28px rgba(30, 64, 175, .08) !important;
      }
      html[data-admin-theme="light"] body:not(.login-page-body) .analysis-picker {
        background: #f8fbff !important;
        border-color: #dbe4f0 !important;
        color: #111827 !important;
      }
      html[data-admin-theme="light"] body:not(.login-page-body) .analysis-batch-tab {
        background: #f8fbff !important;
        border-color: #dbe4f0 !important;
        color: #111827 !important;
      }
      html[data-admin-theme="light"] body:not(.login-page-body) .analysis-batch-tab.active {
        background: linear-gradient(135deg, #0ea5e9, #2563eb) !important;
        color: #ffffff !important;
      }
      html[data-admin-theme="light"] body:not(.login-page-body) .analysis-chip.active {
        background: linear-gradient(135deg, #0ea5e9, #2563eb) !important;
        color: #ffffff !important;
      }
    </style>
  </head>
  <body data-page="{{ analysis_page }}">
    <main id="app"></main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const SUBJECTS = ["Physics", "Chemistry", "Biology", "Maths"];
      const CLUSTER_SIZE = 12;
      const SUBJECT_THEMES = {
        Physics: { from: "#0ea5e9", to: "#06b6d4", accent: "#22d3ee", icon: "P", short: "PHY" },
        Chemistry: { from: "#d946ef", to: "#ec4899", accent: "#f472b6", icon: "C", short: "CHM" },

        Maths: { from: "#f59e0b", to: "#f97316", accent: "#fb923c", icon: "M", short: "MAT" }
      };
      const TOPICS = {

        Chemistry: ["Atomic Structure", "Chemical Bonding", "Thermochemistry", "Equilibrium", "Organic Reactions", "Coordination Compounds", "Electrochemistry", "Periodic Table"],

      };
      const STATIC_PLACEHOLDER_MODE = {{ test_analysis_static_mode|yesno:"true,false" }};
      const ANALYSIS_PAYLOAD = JSON.parse('{{ test_analysis_payload|default:"{}"|escapejs }}');
      const IS_ADMIN_PAGE = document.body.dataset.page === "admin";
      const ADMIN_ANALYSIS = ANALYSIS_PAYLOAD.admin || null;
      const FACULTY_ANALYSIS = ANALYSIS_PAYLOAD.faculty || null;
      const ACTIVE_ANALYSIS = IS_ADMIN_PAGE ? ADMIN_ANALYSIS : FACULTY_ANALYSIS;
      const STUDENT_NAMES = [
        "Aarav Sharma","Vivaan Gupta","Aditya Patel","Vihaan Iyer","Arjun Reddy","Sai Kumar","Reyansh Joshi","Krishna Mehta","Ishaan Singh","Shaurya Malhotra",
        "Ananya Verma","Diya Kapoor","Aanya Rao","Saanvi Bhat","Aaradhya Nair","Kavya Pillai","Pari Desai","Riya Khanna","Anika Bose","Navya Menon",
        "Atharv Trivedi","Aarush Saxena","Dev Bhatia","Kabir Chopra","Yash Agarwal","Rudra Dube","Veer Naidu","Ayan Mishra","Aryan Tiwari","Aanav Goel",
        "Myra Bansal","Aadhya Goyal","Sara Sinha","Ira Choudhury","Tara Pandey","Kiara Sehgal","Pihu Kashyap","Avni Mahajan","Anaya Shukla","Ishita Yadav",
        "Daksh Dewan","Parth Bedi","Aaryan Bali","Rohit Anand","Karan Bajaj","Riya Sood","Tanvi Bhalla","Suhani Walia","Mahi Sethi","Naina Gera"
      ];
      const DEMO_STUDENTS = STUDENT_NAMES.map((name, i) => ({
        id: `TRA${String(i + 1).padStart(3, "0")}`,
        name,
        password: `demo${String(i + 1).padStart(3, "0")}`,
        batch: i < 25 ? "Alpha" : "Star-01",
        grade: i % 2 ? "10th Grade" : "9th Grade",
        parentPhone: `+91 9${String(800000000 + i * 13579).slice(0, 9)}`
      }));
      const DEMO_TESTS = [
        { id: "T01", name: "VECTOR ADDITION TEST", batch: "Star-01", batchKeys: ["star01"], date: "15 Apr 2026", shortDate: "Apr 15" },
        { id: "T02", name: "MOTION TEST", batch: "Alpha", batchKeys: ["alpha"], date: "22 Apr 2026", shortDate: "Apr 22" },
        { id: "T03", name: "WEEKLY MOCK TEST", batch: "Star-01", batchKeys: ["star01"], date: "29 Apr 2026", shortDate: "Apr 29" }
      ];
      const USE_BACKEND_ANALYSIS_DATA = !STATIC_PLACEHOLDER_MODE;
      const STUDENTS = USE_BACKEND_ANALYSIS_DATA ? (ACTIVE_ANALYSIS?.students || []) : [];
      const TESTS = USE_BACKEND_ANALYSIS_DATA ? (ACTIVE_ANALYSIS?.completedTests || []) : [];
      const BACKEND_BATCHES = USE_BACKEND_ANALYSIS_DATA ? (ACTIVE_ANALYSIS?.batches || []) : [];
      const BATCH_TABS = [
        { id: "star01", label: "STAR 01" },
        { id: "star02", label: "STAR 02" },
        { id: "alpha", label: "Alpha Batch" },
        { id: "grade10", label: "10th Grade" },
        { id: "grade9", label: "9th Grade" },
      ];
      const BATCHES = buildBatchOptions();
      const DEFAULT_ADMIN_UPCOMING_TEST = {
        id: "",
        name: "Upcoming Test",
        date: "Awaiting schedule",
        shortDate: "Soon",
        kind: "placeholder",
        canLaunchNow: false,
        isLive: false,
      };
      const ADMIN_UPCOMING_TEST = USE_BACKEND_ANALYSIS_DATA
        ? (ACTIVE_ANALYSIS?.upcomingTest || DEFAULT_ADMIN_UPCOMING_TEST)
        : DEFAULT_ADMIN_UPCOMING_TEST;
      const CLUSTER_SCHEDULE = {
        Physics: { time: "4:00 - 4:30 PM", faculty: "Mr. Rajesh Kumar", room: "Conference Room A" },
        Chemistry: { time: "4:30 - 5:00 PM", faculty: "Dr. Priya Verma", room: "Conference Room A" },
        Biology: { time: "5:00 - 5:30 PM", faculty: "Mr. Amit Sharma", room: "Conference Room A" },
        Maths: { time: "5:30 - 6:00 PM", faculty: "Mr. Amit Sharma", room: "Conference Room A" }
      };
      const ADMIN_CREDS = { user: "admin", pwd: "admin@2026" };
      const FACULTY_CREDS = {
        physics: { user: "physics", pwd: "coach@2026", name: "Mr. Rajesh Kumar", subject: "Physics" },
        chemistry: { user: "chemistry", pwd: "coach@2026", name: "Dr. Priya Verma", subject: "Chemistry" },
        maths: { user: "maths", pwd: "coach@2026", name: "Mr. Amit Sharma", subject: "Maths" },
        biology: { user: "biology", pwd: "coach@2026", name: "Mr. Amit Sharma", subject: "Biology" }
      };
      const BADGES = [
        ["first_test", "&#127919;", "Mock Test Starter", "Completed the first academy test", "bronze"],
        ["top_25", "&#128200;", "Rank Booster", "Entered the top 25 merit band", "silver"],
        ["top_10", "&#9889;", "JEE Main Sprinter", "Cracked the top 10 in class", "gold"],
        ["top_3", "&#127942;", "NEET Podium Performer", "Reached the top 3 merit list", "gold"],
        ["rank_1", "&#128081;", "AIR Mindset Champion", "Held rank #1 on a test", "platinum"],
        ["climb_5", "&#128640;", "Comeback Climber", "Climbed 5+ ranks in one test", "silver"],
        ["streak_3", "&#128293;", "Consistency Streak", "Improved across 3 tests in a row", "gold"],
        ["subject_90", "&#127891;", "Subject Mastery Badge", "Scored 90+ in any subject", "gold"],
        ["attend_perfect", "&#9989;", "Revision Warrior", "Attended every assigned booster session", "silver"],
        ["no_cluster", "&#128142;", "Concept Clear Badge", "Stayed out of coaching clusters this test", "bronze"]
      ].map(([id, icon, name, desc, tier]) => ({ id, icon, name, desc, tier }));
      const StorageKeys = {
        attendance: (testId) => `tra4_att:${testId}`,
        facultyNotes: "tra4_fac_notes",
        parentAlerts: "tra4_parent_alerts",
        session: "tra4_session"
      };
      const ROUTES = {
        login: "{% url 'login' %}",
        logout: "{% url 'logout' %}",
        student: "{% url 'login' %}",
        faculty: "{% url 'test-analysis-faculty-page' %}",
        admin: "{% url 'test-analysis-admin-page' %}"
      };
      const ANALYSIS_API = {
        attendanceStatus: "{% url 'test-analysis-attendance-status-api' %}",
        attendanceFinalize: "{% url 'test-analysis-attendance-finalize-api' %}",
        noteCreate: "{% url 'test-analysis-note-create-api' %}",
        noteDelete: "{% url 'test-analysis-note-delete-api' %}",
        batches: "{% url 'test-analysis-batches-api' %}",
        tests: "{% url 'test-analysis-tests-api' %}",
        summary: "{% url 'test-analysis-summary-api' %}"
      };
      const ANALYSIS_DOWNLOAD_PDF_URL = "{% url 'test-analysis-download-pdf' %}";
      const SERVER_SESSION = JSON.parse('{{ test_analysis_session|escapejs }}');
      const ANALYSIS_URL_PARAMS = new URLSearchParams(window.location.search);
      const DEFAULT_ANALYSIS_BATCH_ID = resolveInitialBatchId();
      const DEFAULT_ANALYSIS_TEST_ID = resolveInitialTestId(DEFAULT_ANALYSIS_BATCH_ID);

      const state = {
        page: document.body.dataset.page || "login",
        user: SERVER_SESSION || getStore(StorageKeys.session, null),
        loginMode: "student",
        batchId: DEFAULT_ANALYSIS_BATCH_ID,
        testId: document.body.dataset.page === "admin" ? DEFAULT_ANALYSIS_TEST_ID : (TESTS.at(-1)?.id || ""),
        studentTab: "home",
        studentLeaderboardOpen: false,
        facultyTab: "attend",
        adminTab: "overview",
        adminSort: "total",
        adminSearch: "",
        adminRecentTestIds: [],
        commsTab: "post-test",
        online: navigator.onLine,
        attendance: blankAttendance(),
        facultyNotes: {},
        parentAlerts: getStore(StorageKeys.parentAlerts, {}),
        modal: ""
      };
      window.state = state;

      if (SERVER_SESSION) {
        setStore(StorageKeys.session, SERVER_SESSION);
      }

      const BACKEND_SCORES_BY_TEST = USE_BACKEND_ANALYSIS_DATA ? (ACTIVE_ANALYSIS?.scoresByTest || {}) : {};
      const BACKEND_FOCUS_BY_TEST = USE_BACKEND_ANALYSIS_DATA ? (ACTIVE_ANALYSIS?.focusByTest || {}) : {};
      const BACKEND_ATTENDANCE_BY_TEST = USE_BACKEND_ANALYSIS_DATA ? (ACTIVE_ANALYSIS?.attendanceByTest || {}) : {};
      const BACKEND_NOTES_BY_TEST = USE_BACKEND_ANALYSIS_DATA ? (ACTIVE_ANALYSIS?.notesByTest || {}) : {};
      const allScores = USE_BACKEND_ANALYSIS_DATA
        ? Object.fromEntries(
            TESTS.map((t) => [
              t.id,
              (BACKEND_SCORES_BY_TEST[t.id] || []).map((row) => ({
                studentId: row.studentId,
                testId: row.testId || t.id,
                Physics: Number(row.Physics) || 0,
                Chemistry: Number(row.Chemistry) || 0,
                Biology: Number(row.Biology) || 0,
                Maths: Number(row.Maths) || 0,
                total: Number(row.total) || 0,
                totalMarks: Number(row.totalMarks) || 0,
                sectionScores: Array.isArray(row.sectionScores) ? row.sectionScores : [],
                rank: row.rank,
                batchRank: row.batchRank,
                attempted: row.attempted !== false,
              })),
            ])
          )
        : {};
      const STUDENT_LOOKUP = new Map(STUDENTS.map((student) => [student.id, student]));
      const TEST_LOOKUP = new Map(
        [...TESTS, ADMIN_UPCOMING_TEST].filter(Boolean).map((test) => [test.id, test])
      );
      const ALL_STUDENT_IDS = Array.from(
        new Set([
          ...STUDENTS.map((student) => student.id),
          ...Object.values(allScores).flatMap((scores) => scores.map((score) => score.studentId)),
        ])
      );
      const app = document.getElementById("app");

      window.addEventListener("online", () => { state.online = true; render(); });
      window.addEventListener("offline", () => { state.online = false; render(); });
      document.addEventListener("keydown", (e) => {
        if (!state.user || state.user.type !== "student" || ["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
        if (["1", "2", "3"].includes(e.key)) {
          state.studentTab = ["home", "analytics", "rewards"][Number(e.key) - 1];
          render();
        }
      });

      if (IS_ADMIN_PAGE) {
        const initialBatchTests = testsForBatch(state.batchId);
        if (!initialBatchTests.some((test) => test.id === state.testId)) {
          state.testId = latestTestForList(initialBatchTests)?.id || "";
        }
        seedAdminRecentTestTabs();
      }
      loadAttendance();
      if (!guardRoute()) {
        syncAnalysisUrlParams(true);
        render();
      }

      function guardRoute() {
        if (!state.user) {
          if (state.page !== "login") {
            window.location.href = ROUTES.login;
            return true;
          }
          return false;
        }

        if (state.page === "login") {
          window.location.href = routeForUser(state.user);
          return true;
        }

        const expected = state.page === "teacher" ? "faculty" : state.page;
        if (state.user.type !== expected) {
          window.location.href = routeForUser(state.user);
          return true;
        }
        return false;
      }

      function routeForUser(user) {
        return ROUTES[user.type] || ROUTES.login;
      }

      function saveSession() {
        setStore(StorageKeys.session, state.user);
      }

      function clearSession() {
        localStorage.removeItem(StorageKeys.session);
      }

      function hashCode(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
        return Math.abs(h);
      }

      function normalizeBatchKey(value) {
        const normalized = String(value || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "");
        const aliases = {
          star1: "star01",
          star01: "star01",
          star2: "star02",
          star02: "star02",
          alpha: "alpha",
          alphabatch: "alpha",
          grade10: "grade10",
          class10: "grade10",
          "10th": "grade10",
          "10": "grade10",
          grade9: "grade9",
          class9: "grade9",
          "9th": "grade9",
          "9": "grade9",
        };
        return aliases[normalized] || normalized;
      }

      function batchDisplayLabel(value) {
        const preferred = {
          star01: "STAR 01",
          star02: "STAR 02",
          alpha: "Alpha Batch",
          grade10: "10th Grade",
          grade9: "9th Grade",
        };
        const key = normalizeBatchKey(value);
        return preferred[key] || String(value || "").trim() || "Unassigned";
      }

      function splitBatchValues(value) {
        return String(value || "").split(/[,/&|]+/).map((item) => item.trim()).filter(Boolean);
      }

      function batchKeysForTest(test) {
        const explicitKeys = Array.isArray(test?.batchKeys) ? test.batchKeys.map(normalizeBatchKey).filter(Boolean) : [];
        if (explicitKeys.length) return explicitKeys;
        return splitBatchValues(test?.batch).map(normalizeBatchKey).filter(Boolean);
      }

      function buildBatchOptions() {
        const options = new Map();
        const add = (value, label = "") => {
          const key = normalizeBatchKey(value || label);
          if (!key || options.has(key)) return;
          options.set(key, { id: key, label: label || batchDisplayLabel(value), studentCount: 0, testCount: 0 });
        };

        BATCH_TABS.forEach((batch) => add(batch.id, batch.label));
        BACKEND_BATCHES.forEach((batch) => add(batch.id || batch.label, batch.label));
        STUDENTS.forEach((student) => {
          add(student.batch);
          if (["grade10", "grade9"].includes(normalizeBatchKey(student.grade))) add(student.grade);
        });
        TESTS.forEach((test) => splitBatchValues(test.batch).forEach((value) => add(value)));

        const rows = Array.from(options.values());
        rows.forEach((batch) => {
          batch.studentCount = STUDENTS.filter((student) => studentMatchesBatch(student, batch.id)).length;
          batch.testCount = TESTS.filter((test) => testHasDeclaredBatch(test, batch.id)).length;
        });
        return rows;
      }

      function currentBatch() {
        return BATCHES.find((batch) => batch.id === state.batchId) || BATCHES[0] || { id: "", label: "Select Batch" };
      }

      function visibleBatchTabs() {
        return BATCH_TABS.map((tab) => BATCHES.find((batch) => batch.id === tab.id) || tab);
      }

      function studentMatchesBatch(student, batchId = state.batchId) {
        if (!batchId) return true;
        return [student?.batch, student?.grade].some((value) => normalizeBatchKey(value) === batchId);
      }

      function testHasDeclaredBatch(test, batchId) {
        if (!batchId) return true;
        const keys = batchKeysForTest(test);
        return !keys.length || keys.includes(batchId);
      }

      function testsForInitialBatch(batchId) {
        return TESTS.filter((test) => testHasDeclaredBatch(test, batchId));
      }

      function resolveInitialBatchId() {
        const rawBatch = ANALYSIS_URL_PARAMS.get("batch_id") || ANALYSIS_URL_PARAMS.get("batch");
        const batchFromUrl = normalizeBatchKey(rawBatch);
        if (batchFromUrl && BATCHES.some((batch) => batch.id === batchFromUrl)) return batchFromUrl;

        const urlTest = normalizeTestId(ANALYSIS_URL_PARAMS.get("test_id") || ANALYSIS_URL_PARAMS.get("test"));
        const selectedTest = TESTS.find((test) => test.id === urlTest);
        const testBatch = batchKeysForTest(selectedTest)[0];
        if (testBatch && BATCHES.some((batch) => batch.id === testBatch)) return testBatch;

        const batchWithTests = BATCHES.find((batch) => testsForInitialBatch(batch.id).length);
        const tabWithTests = BATCH_TABS.find((batch) => testsForInitialBatch(batch.id).length);
        return tabWithTests?.id || batchWithTests?.id || BATCH_TABS[0]?.id || BATCHES[0]?.id || "";
      }

      function resolveInitialTestId(batchId) {
        const rawTest = ANALYSIS_URL_PARAMS.get("test_id") || ANALYSIS_URL_PARAMS.get("test");
        const urlTest = normalizeTestId(rawTest);
        const tests = testsForInitialBatch(batchId);
        if (urlTest && tests.some((test) => test.id === urlTest)) return urlTest;
        return latestTestForList(tests)?.id || TESTS.at(-1)?.id || "";
      }

      function normalizeTestId(value) {
        const raw = String(value || "").trim();
        if (!raw) return "";
        if (/^SCH/i.test(raw)) return `SCH${raw.replace(/^SCH/i, "")}`;
        if (/^\d+$/.test(raw)) return `SCH${raw}`;
        return raw;
      }

      function latestTestForList(tests) {
        return [...tests].sort((a, b) => String(a.sortAt || a.date || "").localeCompare(String(b.sortAt || b.date || ""))).at(-1) || null;
      }

      function generateScores(testId) {
        const testHash = hashCode(testId);
        return STUDENTS.map((s) => {
          const sh = hashCode(s.id);
          const Physics = Math.max(18, Math.min(99, (sh % 65) + 25 + ((testHash + sh) % 22) - 11));
          const Chemistry = Math.max(18, Math.min(99, ((sh * 7) % 65) + 25 + ((testHash * 3 + sh) % 22) - 11));
          const Biology = Math.max(18, Math.min(99, ((sh * 13) % 65) + 25 + ((testHash * 5 + sh) % 22) - 11));
          const Maths = Math.max(18, Math.min(99, ((sh * 17) % 65) + 25 + ((testHash * 7 + sh) % 22) - 11));
          return { studentId: s.id, testId, Physics, Chemistry, Biology, Maths, total: Physics + Chemistry + Biology + Maths };
        });
      }

      function generateTopicMastery(studentId, testId, subject) {
        const backendTopics = BACKEND_FOCUS_BY_TEST[testId]?.[studentId];
        if (Array.isArray(backendTopics) && backendTopics.length) {
          return backendTopics.map((item) => ({
            topic: item.topic || `${subject} focus`,
            score: Number(item.score) || 0,
          }));
        }
        const topics = TOPICS[subject] || TOPICS[normalizeSubjectName(subject)] || [`${subject || "Subject"} focus`];
        return topics.map((topic, i) => {
          const score = (hashCode(studentId) + hashCode(testId) + hashCode(subject) + hashCode(topic) + i * 7) % 100;
          return { topic, score: Math.max(15, Math.min(98, score)) };
        });
      }

      function normalizeSubjectName(name) {
        const value = String(name || "").trim().toLowerCase();
        if (value.includes("physics") || value === "phy") return "Physics";
        if (value.includes("chemistry") || value === "chem") return "Chemistry";
        if (value.includes("biology") || value === "bio" || value.includes("botany") || value.includes("zoology")) return "Biology";
        if (value.includes("math")) return "Maths";
        return "";
      }

      function sectionDisplayLabel(section, index = 0) {
        if (section?.shortLabel) return section.shortLabel;
        const normalized = normalizeSubjectName(section?.name || section?.sectionName);
        if (normalized && SUBJECT_THEMES[normalized]?.short) return SUBJECT_THEMES[normalized].short;

        const rawName = String(section?.name || section?.sectionName || `SEC ${index + 1}`).trim();
        if (!rawName) return `SEC ${index + 1}`;
        const compactName = rawName.replace(/\s+/g, " ");
        if (compactName.length <= 8) return compactName.toUpperCase();
        const parts = compactName.split(" ").filter(Boolean);
        if (parts.length === 1) return compactName.slice(0, 8).toUpperCase();
        return parts.slice(0, 3).map((part) => part[0]).join("").toUpperCase();
      }

      function sectionIdentity(section, index = 0) {
        const rawName = String(section?.name || section?.sectionName || "").trim().toLowerCase();
        const normalized = normalizeSubjectName(rawName);
        return normalized || rawName || `section-${index}`;
      }

      function normalizeSectionItems(sections = []) {
        return (Array.isArray(sections) ? sections : []).map((section, index) => {
          const sectionName = String(section?.name || section?.sectionName || `Section ${index + 1}`).trim();
          const score = Number(section?.score || 0);
          const total = Number(section?.total || 0);
          const parsedPercentage = Number(section?.percentage);
          const percentage = Number.isFinite(parsedPercentage)
            ? parsedPercentage
            : (total > 0 ? Math.round((score / total) * 1000) / 10 : 0);
          return {
            ...section,
            name: sectionName,
            sectionName,
            shortLabel: section?.shortLabel || sectionDisplayLabel({ name: sectionName }, index),
            score,
            total,
            percentage,
          };
        });
      }

      function subjectTheme(subject, index = 0) {
        return SUBJECT_THEMES[subject] || Object.values(SUBJECT_THEMES)[index % Object.values(SUBJECT_THEMES).length] || SUBJECT_THEMES.Physics;
      }

      function subjectDefinitionsForTest(test = currentTest()) {
        const configuredSections = normalizeSectionItems(test?.sectionBreakdown || []);
        const scoreSections = normalizeSectionItems(
          (rawScoresForTest(test?.id) || []).find((row) => Array.isArray(row.sectionScores) && row.sectionScores.length)?.sectionScores || [],
        );
        const seedSections = configuredSections.length ? configuredSections : scoreSections;

        if (!seedSections.length) {
          return SUBJECTS.map((subject, index) => ({
            key: subject,
            label: subject,
            name: subject,
            sectionName: subject,
            shortLabel: SUBJECT_THEMES[subject]?.short || sectionDisplayLabel({ name: subject }, index),
            total: 0,
            index,
          }));
        }

        const fallbackTestSubject = seedSections.length === 1 ? normalizeSubjectName(test?.subject) : "";
        return seedSections.map((section, index) => {
          const sectionName = section.name || section.sectionName || `Section ${index + 1}`;
          const normalized = normalizeSubjectName(sectionName);
          const fallbackSubject = fallbackTestSubject || SUBJECTS[index] || normalized || sectionName;
          const key = normalized || fallbackSubject;
          const label = SUBJECT_THEMES[key] ? key : sectionName;
          return {
            ...section,
            key,
            label,
            shortLabel: SUBJECT_THEMES[key]?.short || section.shortLabel || sectionDisplayLabel(section, index),
            total: Number(section.total) || 0,
            index,
          };
        });
      }

      function currentSubjectDefinitions() {
        return subjectDefinitionsForTest(currentTest());
      }

      function currentSubjectKeys() {
        return currentSubjectDefinitions().map((subject) => subject.key);
      }

      function leaderboardSectionCellData(row, subject, index = 0) {
        const normalizedRowSections = normalizeSectionItems(row?.sectionScores || []);
        const targetKey = sectionIdentity(subject, index);
        const fallbackName = String(subject?.name || subject?.sectionName || subject?.key || `Section ${index + 1}`).trim();

        const matchedSection = normalizedRowSections.find(
          (item, itemIndex) => sectionIdentity(item, itemIndex) === targetKey,
        );
        if (matchedSection) return matchedSection;

        const indexedSection = normalizedRowSections[index];
        if (indexedSection) return indexedSection;

        const normalizedKey = normalizeSubjectName(fallbackName);
        const legacyScoreCandidates = [
          row?.[fallbackName],
          row?.[subject?.sectionName],
          subject?.key ? row?.[subject.key] : undefined,
          normalizedKey ? row?.[normalizedKey] : undefined,
        ];
        const legacyScore = legacyScoreCandidates.find((value) => value !== undefined && value !== null && value !== "");
        if (legacyScore !== undefined) {
          return {
            name: fallbackName || subject?.key || `Section ${index + 1}`,
            sectionName: fallbackName || subject?.key || `Section ${index + 1}`,
            shortLabel: subject?.shortLabel || sectionDisplayLabel({ name: fallbackName }, index),
            score: Number(legacyScore || 0),
            total: Number(subject?.total || 0),
          };
        }
        return null;
      }

      function scoreForSubject(score, subject, index = 0) {
        const section = leaderboardSectionCellData(score, subject, index);
        if (section) return Number(section.score) || 0;
        const key = typeof subject === "string" ? subject : subject?.key;
        return Number(score?.[key]) || 0;
      }

      function totalForSubject(score, subject, index = 0) {
        const section = leaderboardSectionCellData(score, subject, index);
        if (section && Number(section.total) > 0) return Number(section.total) || 0;
        return Number(subject?.total) || 0;
      }

      function rowTotalScore(row) {
        const total = Number(row?.total);
        if (Number.isFinite(total) && total > 0) return total;
        return normalizeSectionItems(row?.sectionScores || []).reduce((sum, section) => sum + (Number(section.score) || 0), 0);
      }

      function rowTotalMarks(row) {
        const total = analysisTotalMarks(row);
        if (total) return total;
        return normalizeSectionItems(row?.sectionScores || []).reduce((sum, section) => sum + (Number(section.total) || 0), 0);
      }

      function getRankings(scores, key = "total") {
        const parsedRank = (value) => {
          const rank = Number.parseInt(value, 10);
          return Number.isInteger(rank) ? rank : Number.MAX_SAFE_INTEGER;
        };
        const useBackendRanks = key === "total" && scores.some((score) => score?.rank !== undefined);
        const subjectDef = key === "total"
          ? null
          : currentSubjectDefinitions().find((subject) => (
            subject.key === key
            || subject.name === key
            || subject.sectionName === key
          ));
        const subjectIndex = Number.isInteger(subjectDef?.index) ? subjectDef.index : 0;
        const scoreValueForKey = (row) => {
          if (key === "total") {
            return rowTotalScore(row);
          }
          if (subjectDef) {
            return scoreForSubject(row, subjectDef, subjectIndex);
          }
          return Number(row?.[key]) || 0;
        };
        return [...scores]
          .sort((a, b) => {
            const attemptedA = a?.attempted !== false;
            const attemptedB = b?.attempted !== false;
            if (attemptedA !== attemptedB) {
              return attemptedA ? -1 : 1;
            }

            const scoreDiff = scoreValueForKey(b) - scoreValueForKey(a);
            if (scoreDiff) {
              return scoreDiff;
            }

            const rankDiff = parsedRank(a?.rank) - parsedRank(b?.rank);
            if (rankDiff) {
              return rankDiff;
            }

            return String(a?.studentId || "").localeCompare(String(b?.studentId || ""));
          })
          .map((s, i) => ({
            ...s,
            rank: useBackendRanks
              ? (s?.attempted === false ? "NA" : (s?.rank ?? i + 1))
              : (s?.attempted === false ? "NA" : i + 1),
          }));
      }

      function getBottomCluster(scores, subject, count = CLUSTER_SIZE) {
        const subjectDef = currentSubjectDefinitions().find((item) => item.key === subject) || { key: subject, name: subject, sectionName: subject, index: 0 };
        const index = Number.isInteger(subjectDef.index) ? subjectDef.index : 0;
        return [...scores].sort((a, b) => scoreForSubject(a, subjectDef, index) - scoreForSubject(b, subjectDef, index)).slice(0, count);
      }

      function getStudentClusterFlags(studentId, scores) {
        return Object.fromEntries(currentSubjectKeys().map((sub) => [sub, getBottomCluster(scores, sub).some((s) => s.studentId === studentId)]));
      }

      function calculateXP(studentId) {
        let xp = 0;
        TESTS.forEach((t, ti) => {
          const scores = allScores[t.id] || [];
          const me = scores.find((s) => s.studentId === studentId);
          const rankEntry = getRankings(scores).find((s) => s.studentId === studentId);
          if (!me || !rankEntry) return;
          const rank = rankEntry.rank;
          xp += Math.floor(me.total / 3);
          xp += rank === 1 ? 200 : rank <= 3 ? 120 : rank <= 10 ? 60 : rank <= 25 ? 25 : 0;
          if (ti) {
            const prevEntry = getRankings(allScores[TESTS[ti - 1].id] || []).find((s) => s.studentId === studentId);
            if (prevEntry && prevEntry.rank > rank) xp += (prevEntry.rank - rank) * 10;
          }
        });
        const level = Math.floor(Math.sqrt(xp / 30)) + 1;
        const nextLevelXP = level * level * 30;
        const prevLevelXP = (level - 1) * (level - 1) * 30;
        return { xp, level, progress: (xp - prevLevelXP) / (nextLevelXP - prevLevelXP) };
      }

      function getEarnedBadges(studentId) {
        const earned = new Set(["first_test"]);
        let bestRank = 999, ever90 = false, climbedFive = false, streak = 0;
        TESTS.forEach((t, i) => {
          const scores = allScores[t.id] || [], me = scores.find((s) => s.studentId === studentId);
          const rankEntry = getRankings(scores).find((s) => s.studentId === studentId);
          if (!me || !rankEntry) return;
          const rank = rankEntry.rank;
          bestRank = Math.min(bestRank, rank);
          ever90 ||= subjectDefinitionsForTest(t).some((subject, index) => scoreForSubject(me, subject, index) >= 90);
          if (i) {
            const prevEntry = getRankings(allScores[TESTS[i - 1].id] || []).find((s) => s.studentId === studentId);
            if (prevEntry) {
              if (prevEntry.rank - rank >= 5) climbedFive = true;
              streak = prevEntry.rank > rank ? streak + 1 : 0;
            }
          }
        });
        if (bestRank <= 25) earned.add("top_25");
        if (bestRank <= 10) earned.add("top_10");
        if (bestRank <= 3) earned.add("top_3");
        if (bestRank === 1) earned.add("rank_1");
        if (climbedFive) earned.add("climb_5");
        if (streak >= 2) earned.add("streak_3");
        if (ever90) earned.add("subject_90");
        const latestTestId = TESTS.at(-1)?.id;
        const flags = latestTestId ? getStudentClusterFlags(studentId, allScores[latestTestId] || []) : {};
        const flagged = currentSubjectKeys().filter((s) => flags[s]);
        if (!flagged.length) earned.add("no_cluster");
        if (flagged.length && flagged.every((s) => ["present", "late"].includes(state.attendance[s]?.[studentId]))) earned.add("attend_perfect");
        return earned;
      }

      function calculateStreaks(studentId) {
        let improveStreak = 0;
        for (let i = TESTS.length - 1; i > 0; i--) {
          const curEntry = getRankings(allScores[TESTS[i].id] || []).find((s) => s.studentId === studentId);
          const prevEntry = getRankings(allScores[TESTS[i - 1].id] || []).find((s) => s.studentId === studentId);
          if (!curEntry || !prevEntry) break;
          const cur = curEntry.rank;
          const prev = prevEntry.rank;
          if (prev > cur) improveStreak++;
          else break;
        }
        return { improveStreak };
      }

      function getPredictiveAlerts() {
        const alerts = [];
        const scopedTests = state.user?.type === "admin" ? testsForBatch() : TESTS;
        const scoresFor = (testId) => state.user?.type === "admin"
          ? filterScoresByBatch(rawScoresForTest(testId), state.batchId)
          : (allScores[testId] || []);
        const scopedStudentIds = state.user?.type === "admin"
          ? Array.from(new Set(scopedTests.flatMap((test) => scoresFor(test.id).map((score) => score.studentId))))
          : ALL_STUDENT_IDS;

        scopedStudentIds.forEach((studentId) => {
          const stu = getStudentById(studentId) || { id: studentId, name: studentId, parentPhone: "", batch: "" };
          const reasons = [];
          let severity = 0;
          const ranks = scopedTests.map((t) => {
            const rankEntry = getRankings(scoresFor(t.id)).find((s) => s.studentId === studentId);
            return rankEntry ? rankEntry.rank : null;
          });
          const recentRanks = ranks.filter((rank) => Number.isInteger(rank));
          if (!recentRanks.length) return;
          if (recentRanks.length >= 2) {
            const drop = recentRanks.at(-1) - recentRanks.at(-2);
            if (drop >= 8) { reasons.push(`Dropped ${drop} ranks vs last test`); severity += 3; }
            else if (drop >= 4) { reasons.push(`Dropped ${drop} ranks vs last test`); severity += 1; }
          }
          if (scopedTests.length && scopedTests.every((t, index) => {
            const totalStudents = scoresFor(t.id).length;
            const rank = ranks[index];
            return totalStudents > 0 && rank !== null && rank > Math.max(0, totalStudents - 15);
          })) { reasons.push("Bottom-15 in all tests"); severity += 2; }
          const clusterCount = scopedTests.reduce((n, t) => {
            const testScores = scoresFor(t.id);
            if (!testScores.some((score) => score.studentId === studentId)) return n;
            return n + Object.values(getStudentClusterFlags(studentId, testScores)).filter(Boolean).length;
          }, 0);
          if (clusterCount >= 6) { reasons.push(`In ${clusterCount} subject clusters across ${scopedTests.length} tests`); severity += 2; }
          let absent = 0, marked = 0;
          currentSubjectKeys().forEach((sub) => {
            const status = state.attendance[sub]?.[studentId];
            if (status) marked++;
            if (status === "absent") absent++;
          });
          if (marked && absent / marked >= .5) { reasons.push(`${absent}/${marked} sessions absent`); severity += 2; }
          if (reasons.length) alerts.push({ ...stu, reasons, severity, ranks: ranks.map((rank) => rank ?? "NA") });
        });
        return alerts.sort((a, b) => b.severity - a.severity);
      }

      function blankAttendance() { return { ...Object.fromEntries(SUBJECTS.map((subject) => [subject, {}])), finalized: {} }; }
      function getStore(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } }
      function setStore(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
      function cloneData(value, fallback) {
        if (value === undefined || value === null) return fallback;
        try {
          return JSON.parse(JSON.stringify(value));
        } catch {
          return fallback;
        }
      }
      function noteStateKey(studentId, subject) {
        return `${String(studentId || "")}:${subject}`;
      }
      function parseNoteStateKey(key) {
        const separatorIndex = String(key || "").lastIndexOf(":");
        if (separatorIndex === -1) {
          return { studentId: String(key || ""), subject: "" };
        }
        return {
          studentId: key.slice(0, separatorIndex),

        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Requested-With": "XMLHttpRequest"
          },
          credentials: "same-origin",
          body: JSON.stringify(payload),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.error) {
          throw new Error(data.error || "Request failed");
        }
        return data;
      }
      function esc(v) { return String(v ?? "").replace(/[&<>\"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c])); }
      function rawScoresForTest(testId) {

      function testHasScoresInBatch(test, batchId = state.batchId) {
        return rawScoresForTest(test?.id).some((score) => studentMatchesBatch(getStudentById(score.studentId) || {}, batchId));
      }
      function testMatchesBatch(test, batchId = state.batchId) {
        if (!batchId) return true;

          id: score.studentId,

          parentPhone: "",

      function analysisTotalMarks(score = null) {
        const scoreTotal = Number(score?.totalMarks);

        if (Number.isFinite(testTotal) && testTotal > 0) return testTotal;
