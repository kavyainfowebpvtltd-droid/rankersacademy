services:

  db:
    image: mysql:8.0
    container_name: rankers-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: Vishal@2026
      MYSQL_DATABASE: rankers_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pVishal@2026"]
      interval: 10s
      timeout: 5s
      retries: 15


  web:
    build: .
    container_name: rankers-app
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn sds_main.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --threads 2
      --timeout 120
      --access-logfile -
      --error-logfile -
      "

    ports:
      - "8081:8000"

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    healthcheck:
      test: ["CMD-SHELL", "python manage.py check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3


volumes:
  mysql_data:
  static_volume:
  media_volume:
